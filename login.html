<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Bharti Jewellers</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --header-bg: #000000;
            --accent-gold: #C5A059;
            --bg-light: #f4f6f9;
        }
        body {
            margin: 0; padding: 0;
            font-family: 'Poppins', sans-serif;
            background: var(--bg-light);
            display: flex; justify-content: center; align-items: center;
            height: 100vh;
        }
        .login-card {
            background: white;
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 400px;
            text-align: center;
            border-top: 5px solid var(--accent-gold);
        }
        .logo-icon {
            font-size: 3rem;
            color: var(--accent-gold);
            margin-bottom: 10px;
        }
        h2 { margin: 0 0 20px 0; color: #111; font-weight: 700; text-transform: uppercase; letter-spacing: 1px;}
        .form-group { margin-bottom: 20px; text-align: left; position: relative; }
        label { display: block; font-size: 0.85rem; margin-bottom: 6px; color: #555; font-weight: 600;}
        input {
            width: 100%; padding: 12px 12px 12px 40px; border: 1px solid #ddd;
            border-radius: 8px; font-size: 1rem; box-sizing: border-box;
            background: #fafafa; font-family: inherit;
        }
        input:focus { border-color: var(--accent-gold); outline: none; background: white;}
        .form-group i {
            position: absolute; left: 15px; bottom: 14px; color: #aaa; font-size: 1.1rem;
        }
        .btn {
            width: 100%; padding: 14px; border: none; border-radius: 8px;
            background: #111; color: var(--accent-gold);
            font-weight: 700; font-size: 1rem; cursor: pointer;
            transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn:hover { background: #000; transform: scale(1.01); }
        #error-msg { color: #d32f2f; font-size: 0.85rem; margin-top: 15px; font-weight: 500; display: none; }
    </style>
</head>
<body>

<div class="login-card">
    <div class="logo-icon"><i class="fas fa-ring"></i></div>
    <h2>Bharti Jewellers</h2>
    <p style="color:#666; font-size:0.85rem; margin-top:-15px; margin-bottom:25px;">Cloud Application Login</p>
    
    <div class="form-group">
        <label>Email ID</label>
        <i class="fas fa-envelope"></i>
        <input type="email" id="email" placeholder="admin@bharti.com">
    </div>
    
    <div class="form-group">
        <label>Password</label>
        <i class="fas fa-lock"></i>
        <input type="password" id="password" placeholder="••••••••">
    </div>
    
    <button class="btn" onclick="login()"><i class="fas fa-sign-in-alt"></i> Login to System</button>
    <div id="error-msg">Incorrect Email or Password!</div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="db.js?v=35"></script>

<script>
    // Agar pehle se login hai toh seedha dashboard par bhejo
    firebase.auth().onAuthStateChanged((user) => {
        if (user) { window.location.href = 'index.html'; }
    });

    async function login() {
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const errorEl = document.getElementById('error-msg');
        
        errorEl.style.display = 'none';
        
        if(!email || !password) {
            errorEl.innerText = "Please fill all fields!";
            errorEl.style.display = 'block';
            return;
        }
        
        try {
            await firebase.auth().signInWithEmailAndPassword(email, password);
            window.location.href = 'index.html';
        } catch (error) {
            console.error(error);
            errorEl.innerText = "Invalid Email ID or Password!";
            errorEl.style.display = 'block';
        }
    }
</script>
</body>
</html>
