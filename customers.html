<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Customers & CRM - Bharti Jewellers</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --header-bg: #000000; --sidebar-bg: #111111; --accent-gold: #C5A059;
            --active-red: #D32F2F; --bg-light: #f4f6f9; --border-color: #2a2a2a;
            --whatsapp: #25D366; --in-green: #2e7d32; --out-red: #c62828; --info-blue: #1976d2;
        }

        body { margin: 0; padding: 0; font-family: 'Poppins', sans-serif; background: var(--bg-light); padding-top: 60px; color: #333; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        a { text-decoration: none; color: inherit; }

        .app-header { position: fixed; top: 0; left: 0; width: 100%; height: 60px; background: var(--header-bg); display: flex; align-items: center; padding: 0 15px; z-index: 2000; box-shadow: 0 4px 10px rgba(0,0,0,0.4); border-bottom: 2px solid var(--accent-gold); justify-content: space-between;}
        .header-title { color: var(--accent-gold); font-size: 1.2rem; font-weight: 700; margin-left: 15px; text-transform: uppercase; display: flex; align-items: center;}
        .menu-toggle { background: none; border: none; color: white; font-size: 1.5rem; cursor: pointer; padding: 5px; }
        
        .sidebar-drawer { position: fixed; top: 60px; left: -280px; width: 280px; height: calc(100vh - 60px); background: var(--sidebar-bg); z-index: 1999; transition: left 0.3s ease-in-out; border-right: 1px solid #333; display: flex; flex-direction: column; }
        .sidebar-drawer.open { left: 0; }
        .sidebar-menu { list-style: none; padding: 0; margin: 0; overflow-y: auto; flex:1;}
        .sidebar-menu li a { display: flex; align-items: center; padding: 15px 20px; color: #ccc; text-decoration: none; border-bottom: 1px solid #222; font-size: 1rem; transition: 0.2s;}
        .sidebar-menu li a:hover { background: #222; color: #fff; padding-left: 25px; }
        .sidebar-menu li a.active { background: linear-gradient(90deg, var(--active-red), transparent); color: white; border-left: 5px solid #fff; }
        .sidebar-overlay { position: fixed; top: 60px; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 1500; display: none; }
        .sidebar-overlay.show { display: block; }

        .app-container { padding: 25px; max-width: 1200px; margin: 0 auto; }
        
        .search-box { position: relative; margin-bottom: 25px; }
        .search-box input { width: 100%; padding: 16px 50px 16px 20px; border-radius: 12px; border: 1px solid #ddd; font-size: 1rem; outline: none; box-shadow: 0 4px 15px rgba(0,0,0,0.03); transition: 0.2s;}
        .search-box input:focus { border-color: var(--accent-gold); box-shadow: 0 0 0 3px rgba(197, 160, 89, 0.1); }
        .search-box i { position: absolute; right: 20px; top: 18px; color: #999; font-size: 1.2rem; }

        .main-tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid #ddd; padding-bottom: 10px; }
        .main-tab { padding: 10px 20px; font-size: 1rem; font-weight: 600; cursor: pointer; border: none; background: transparent; color: #666; border-radius: 8px; transition: 0.2s; display: flex; align-items: center; gap: 8px; }
        .main-tab:hover { background: #e2e8f0; }
        .main-tab.active { background: var(--accent-gold); color: #000; box-shadow: 0 4px 10px rgba(205, 164, 52, 0.3); }

        .cust-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 20px; }
        .card { background: white; border-radius: 16px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.04); border-left: 6px solid #333; transition: transform 0.2s; display: flex; flex-direction: column; }
        .card:hover { transform: translateY(-4px); box-shadow: 0 8px 25px rgba(0,0,0,0.08); }
        .card.has-due { border-left-color: var(--active-red); }

        .cust-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 15px; }
        .cust-header-left { display: flex; align-items: center; gap: 15px; }
        .avatar { width: 50px; height: 50px; border-radius: 50%; background: var(--accent-gold); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 1.4rem; font-weight: bold; text-transform: uppercase; flex-shrink: 0; overflow: hidden;}
        
        .cust-info h4 { margin: 0 0 4px 0; font-size: 1.15rem; color: #222; }
        .cust-info p { margin: 0; font-size: 0.85rem; color: #666; display: flex; align-items: center; gap: 8px; }
        
        .cust-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: auto; padding-top: 15px; border-top: 1px dashed #eee; }
        .stat-item { font-size: 0.8rem; color: #777; background: #fafafa; padding: 10px; border-radius: 8px; border: 1px solid #f0f0f0;}
        .stat-val { font-weight: 700; font-size: 1.05rem; display: block; color:#333; margin-top:3px;}
        
        .text-green { color: var(--in-green); }
        .text-red { color: var(--active-red); }
        .text-blue { color: var(--info-blue); }

        .cust-actions { margin-top: 15px; display: flex; gap: 10px; justify-content: space-between; }
        .btn-action { flex: 1; padding: 10px; border-radius: 8px; font-size: 0.9rem; font-weight: 600; text-align: center; cursor: pointer; border: 1px solid #ddd; background: white; color: #333; transition: 0.2s; display: flex; justify-content: center; align-items: center; gap: 6px; }
        .btn-action:hover { background: #f4f6f9; }
        .btn-primary { background: #333; color: white; border: none; }
        .btn-primary:hover { background: #000; }
        .btn-icon { width: 40px; height: 40px; flex: none; display: flex; align-items: center; justify-content: center; padding: 0; border-radius: 8px; }

        .fab { position: fixed; bottom: 30px; right: 30px; width: 65px; height: 65px; background: var(--active-red); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 20px rgba(211, 47, 47, 0.4); font-size: 1.6rem; cursor: pointer; z-index: 100; transition: 0.2s;}
        .fab:active { transform: scale(0.95); }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 2100; justify-content: center; align-items: center; backdrop-filter: blur(4px);}
        .modal-content { background: white; padding: 0; width: 95%; max-width: 900px; border-radius: 16px; max-height: 90vh; overflow-y: auto; position: relative; animation: slideUp 0.3s ease-out; display: flex; flex-direction: column;}
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        
        .modal-header { padding: 20px 25px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; background: #fafafa; border-radius: 16px 16px 0 0;}
        .modal-title { margin: 0; font-size: 1.3rem; font-weight: 700; color: #333;}
        .close-btn { font-size: 2rem; background: none; border: none; cursor: pointer; color: #888; transition: 0.2s; line-height: 1;}
        .close-btn:hover { color: var(--active-red); }

        .modal-body { padding: 25px; overflow-y: auto;}

        .form-group { margin-bottom: 18px; }
        label { display: block; margin-bottom: 6px; font-size: 0.9rem; color: #555; font-weight: 600;}
        input, select, textarea { width: 100%; padding: 14px; border: 1px solid #ddd; border-radius: 10px; font-size: 1rem; background: #fafafa; font-family: inherit; transition: 0.2s;}
        input[type="file"] { padding: 10px; background: white; }
        input:focus, select:focus, textarea:focus { border-color: var(--active-red); background: #fff; box-shadow: 0 0 0 3px rgba(211, 47, 47, 0.1);}
        .btn-save { width: 100%; padding: 15px; background: var(--active-red); color: white; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 1.05rem; margin-top: 10px; transition: 0.2s;}
        .btn-save:hover { background: #b71c1c; }
        .btn-danger { background: white; color: var(--active-red); border: 2px solid var(--active-red); padding: 12px; width: 100%; border-radius: 10px; font-weight: bold; cursor: pointer; margin-top: 15px; transition: 0.2s;}
        .btn-danger:hover { background: var(--active-red); color: white; }

        .c360-header { text-align: center; border-bottom: 1px solid #eee; padding-bottom: 20px; margin-bottom: 20px; background: #fafafa; border-radius: 12px; padding-top: 20px;}
        .c360-name { font-size: 1.6rem; font-weight: 700; color: #222; margin: 0; display: flex; align-items: center; justify-content: center; gap: 10px;}
        .c360-phone { color: #666; font-size: 0.95rem; margin-top: 8px;}
        
        .tabs { display: flex; overflow-x: auto; background: #e0e0e0; border-radius: 10px; padding: 5px; gap: 5px; scrollbar-width: none; margin-bottom: 20px;}
        .tab { flex: 1; min-width: 120px; text-align: center; padding: 12px; font-size: 0.9rem; font-weight: 600; cursor: pointer; color: #555; border-radius: 8px; transition: 0.2s; border: none; background: transparent; white-space: nowrap; display: flex; justify-content: center; align-items: center; gap: 8px;}
        .tab.active { background: white; color: var(--active-red); box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .tab-content { display: none; animation: fadeIn 0.3s; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .khata-summary { background: #fff3e0; border: 1px solid #ffe0b2; padding: 15px 20px; border-radius: 10px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center;}
        .khata-summary-text { font-size: 1rem; color: #e65100; font-weight: 600; text-transform: uppercase;}
        .khata-summary-val { font-size: 1.6rem; font-weight: 800; color: #d84315; }

        .table-responsive { overflow-x: auto; border-radius: 10px; border: 1px solid #eee; background: white; }
        .data-table { width: 100%; border-collapse: collapse; font-size: 0.9rem; min-width: 800px;}
        .data-table th { text-align: left; padding: 15px; background: #f8f9fa; color: #444; border-bottom: 2px solid #ddd; font-weight: 700; text-transform: uppercase; font-size: 0.8rem; letter-spacing: 0.5px;}
        .data-table td { padding: 15px; border-bottom: 1px solid #f0f0f0; vertical-align: middle; color: #333;}
        .data-table tr:hover { background: #fafafa; }
        
        .badge { padding: 6px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; display: inline-block; letter-spacing: 0.5px;}
        .bg-green { background: #e8f5e9; color: #2e7d32; border: 1px solid #c8e6c9;}
        .bg-red { background: #ffebee; color: #c62828; border: 1px solid #ffcdd2;}
        .bg-blue { background: #e3f2fd; color: #1565c0; border: 1px solid #bbdefb;}
        .bg-gold { background: #fff8e1; color: #f57f17; border: 1px solid #ffecb3;}

        .btn-small { padding: 8px 14px; font-size: 0.85rem; background: #f1f5f9; border: 1px solid #cbd5e1; border-radius: 8px; cursor: pointer; color: #334155; font-weight: 600; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; transition: 0.2s;}
        .btn-small:hover { background: #e2e8f0; }
        .btn-small.pay { background: var(--accent-gold); color: #000; border-color: #b08d4a; }
        .btn-small.pay:hover { background: #b08d4a; }

        .tag { padding: 4px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: bold; display: inline-block; margin-top: 4px; }
        .tag-rate { background: #fff8e1; color: #f57f17; border: 1px solid #ffecb3;}
        .tag-budget { background: #ffebee; color: #c62828; border: 1px solid #ffcdd2;}
        .tag-design { background: #e3f2fd; color: #1565c0; border: 1px solid #bbdefb;}
        
        .history-log { font-size: 0.85rem; color: #4a5568; margin-top: 5px; max-height: 120px; overflow-y: auto; background: #f8f9fa; padding: 10px; border-radius: 8px; border: 1px solid #e2e8f0; box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);}
        .history-log div { margin-bottom: 6px; border-bottom: 1px dashed #cbd5e1; padding-bottom: 6px; line-height: 1.4;}
        .history-log div:last-child { margin-bottom: 0; border-bottom: none; padding-bottom: 0; }
        .history-date { font-size: 0.7rem; color: #94a3b8; font-weight: bold; display: block; margin-bottom: 2px;}

        .task-box { margin-top:10px; padding:10px; background:#fff4e5; border-radius:8px; border-left:4px solid #f57c00; font-size:0.85rem; line-height:1.4; color:#333; }
        .task-box strong { color:#e65100; display:block; margin-bottom:3px; }

        @media (max-width: 768px) {
            .app-container { padding: 15px; }
            .cust-grid { grid-template-columns: 1fr; }
            .modal-content { width: 95%; max-height: 90vh; }
            .modal-body { padding: 15px; }
            .tabs { padding-bottom: 5px; }
            .khata-summary { flex-direction: column; align-items: flex-start; gap: 5px; }
            .main-tabs { flex-direction: column; }
        }
    </style>
</head>
<body>

    <div id="sidebar-overlay" class="sidebar-overlay" onclick="toggleSidebar()"></div>
    <header class="app-header">
        <div class="header-title">
            <button class="menu-toggle" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
            <span style="margin-left:10px;">BHARTI JEWELLERS</span>
        </div>
    </header>
    
    <aside id="app-sidebar" class="sidebar-drawer">
        <!-- Sidebar menu unchanged -->
    </aside>

    <div class="app-container">
        <h2 style="margin-top:0; color:#333; margin-bottom: 15px;"><i class="fas fa-users" style="color:var(--active-red);"></i> Customers & Lead Management</h2>

        <div class="main-tabs">
            <button class="main-tab active" id="tabBtn-directory" onclick="switchMainTab('directory')"><i class="fas fa-address-book"></i> Customer Directory (Khata)</button>
            <button class="main-tab" id="tabBtn-crm" onclick="switchMainTab('crm')"><i class="fas fa-bullseye"></i> Follow-up Pipeline (Leads)</button>
        </div>

        <div class="search-box">
            <input type="text" id="searchMain" placeholder="Search by Name, Mobile, or City..." onkeyup="filterData()">
            <i class="fas fa-search"></i>
        </div>

        <div id="view-directory" class="cust-grid"></div>

        <div id="view-crm" style="display:none;">
            <!-- CRM content unchanged -->
        </div>

        <div class="fab" id="mainFab" onclick="openCustomerModal()">
            <i class="fas fa-user-plus"></i>
        </div>
    </div>

    <!-- MODALS (unchanged except onclick fixes in render functions) -->
    <!-- NEW CUSTOMER MODAL -->
    <div id="custModal" class="modal">
        <div class="modal-content" style="max-width:450px;">
            <div class="modal-header">
                <h3 id="custModalTitle" class="modal-title">New Customer</h3>
                <button class="close-btn" onclick="closeModal('custModal')">&times;</button>
            </div>
            
            <div class="modal-body">
                <input type="hidden" id="cId">
                <div class="form-group" style="text-align:center;">
                    <label style="text-align:left;">Customer Photo</label>
                    <input type="file" id="cPhoto" accept="image/*" capture="environment" onchange="previewPhoto(event)">
                    <img id="photoPreview" src="" style="display:none; width: 120px; height: 120px; border-radius: 50%; margin: 15px auto 0 auto; object-fit: cover; border: 3px solid #eee;">
                    <input type="hidden" id="cPhotoBase64">
                </div>
                <div class="form-group">
                    <label>Full Name <span class="text-red">*</span></label>
                    <input type="text" id="cName" placeholder="e.g. Rahul Sharma">
                </div>
                <div class="form-group">
                    <label>Mobile Number <span class="text-red">*</span></label>
                    <input type="tel" id="cMobile" placeholder="e.g. 9876543210">
                </div>
                <div class="form-group">
                    <label>Aadhar Number (Optional)</label>
                    <input type="text" id="cAadhar" placeholder="12-digit Aadhar Number" maxlength="12">
                </div>
                <div class="form-group">
                    <label>PAN Card (Optional KYC)</label>
                    <input type="text" id="cPan" placeholder="e.g. ABCDE1234F" maxlength="10" style="text-transform: uppercase;">
                </div>
                <div class="form-group">
                    <label>City / Address</label>
                    <input type="text" id="cCity" placeholder="e.g. Mumbai">
                </div>
                <button class="btn-save" onclick="saveCustomer()"><i class="fas fa-save"></i> Save Details</button>
                <button id="btnDeleteCust" class="btn-danger" style="display:none;" onclick="deleteCustomer()"><i class="fas fa-trash"></i> Permanently Delete</button>
            </div>
        </div>
    </div>

    <!-- Lead Modal unchanged -->
    <!-- 360 Modal unchanged -->

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="db.js?v=35"></script>
    <script>
        // --- UI CONTROLS ---
        function toggleSidebar() { 
            const sidebar = document.getElementById('app-sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            if (!sidebar.classList.contains('open')) {
                sidebar.classList.add('open'); overlay.classList.add('show');
                history.pushState({ view: 'sidebar' }, '', '#menu');
            } else {
                sidebar.classList.remove('open'); overlay.classList.remove('show');
                if (window.location.hash === '#menu') history.back();
            }
        }

        function openModal(id) { 
            const targetId = id || 'custModal'; 
            const modal = document.getElementById(targetId);
            if (modal) {
                modal.style.display = 'flex';
                history.pushState({ view: 'modal', id: targetId }, '', '#' + targetId);
            }
        }

        function closeModal(id) { 
            const targetId = id || 'custModal';
            const modal = document.getElementById(targetId);
            if (modal) {
                modal.style.display = 'none';
                if (window.location.hash === '#' + targetId) history.back();
            }
        }

        window.addEventListener('popstate', function(event) {
            const sidebar = document.getElementById('app-sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            if (sidebar && sidebar.classList.contains('open')) {
                sidebar.classList.remove('open'); overlay.classList.remove('show');
            }
            document.querySelectorAll('.modal').forEach(m => m.style.display = 'none');
        });

        let currentMainTab = 'directory';
        function switchMainTab(tab) {
            currentMainTab = tab;
            document.getElementById('tabBtn-directory').classList.toggle('active', tab === 'directory');
            document.getElementById('tabBtn-crm').classList.toggle('active', tab === 'crm');
            document.getElementById('view-directory').style.display = tab === 'directory' ? 'grid' : 'none';
            document.getElementById('view-crm').style.display = tab === 'crm' ? 'block' : 'none';
            document.getElementById('mainFab').style.display = tab === 'directory' ? 'flex' : 'none';
            filterData();
        }

        function previewPhoto(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('photoPreview').src = e.target.result;
                    document.getElementById('photoPreview').style.display = 'block';
                    document.getElementById('cPhotoBase64').value = e.target.result;
                }
                reader.readAsDataURL(file);
            }
        }

        let dbCustomers = [], dbSales = [], dbOrders = [], dbLoans = [], dbSchemes = [], dbDeposits = [];
        let aggregatedCustomers = [];

        window.onload = async function() {
            await loadAllData();
        };

        async function loadAllData() {
            dbCustomers = await getAllItems('customers');
            dbSales = await getAllItems('sales');
            dbOrders = await getAllItems('orders');
            dbLoans = await getAllItems('loans');
            try { dbSchemes = await getAllItems('schemes'); } catch(e){}
            try { dbDeposits = await getAllItems('deposits'); } catch(e){}
            aggregateData();
        }

        function aggregateData() {
            aggregatedCustomers = dbCustomers.map(c => {
                const mySales = dbSales.filter(s => s.customerId == c.id && s.status !== 'cancelled');
                const totalSales = mySales.reduce((sum, s) => sum + (parseFloat(s.grandTotal) || 0), 0);
                let pendingSales = 0;
                mySales.forEach(s => {
                    let due = parseFloat(s.pendingAmount) || 0;
                    if(due > 0) pendingSales += due;
                });
                const myLoans = dbLoans.filter(l => l.customerId == c.id && l.status === 'active');
                let activeLoanPrin = 0;
                myLoans.forEach(l => {
                    if(l.ledger && l.ledger.length > 0) activeLoanPrin += l.ledger[l.ledger.length-1].closingPrincipal;
                    else activeLoanPrin += parseFloat(l.amount);
                });
                const myDeps = dbDeposits.filter(d => d.customerId == c.id);
                let depBalance = 0;
                myDeps.forEach(d => {
                    if(d.type === 'IN') depBalance += parseFloat(d.amount);
                    if(d.type === 'OUT') depBalance -= parseFloat(d.amount);
                });
                return { ...c, totalSales, pendingSales, activeLoanPrin, depBalance, inquiries: c.inquiries || [] };
            });
            aggregatedCustomers.sort((a,b) => b.id - a.id);
            filterData();
        }

        function filterData() {
            const term = document.getElementById('searchMain').value.toLowerCase();
            const filtered = aggregatedCustomers.filter(c => 
                c.name.toLowerCase().includes(term) || 
                String(c.mobile).includes(term) ||
                (c.city && c.city.toLowerCase().includes(term))
            );
            if (currentMainTab === 'directory') renderCustomers(filtered);
            if (currentMainTab === 'crm') renderCrmTable(filtered);
        }

        // --- DIRECTORY RENDER (FIXED onClick quotes) ---
        function renderCustomers(list) {
            const container = document.getElementById('view-directory');
            container.innerHTML = '';
            if (list.length === 0) {
                container.innerHTML = `<div style="text-align:center; padding:40px; color:#999; grid-column: 1/-1;">No customers found.</div>`;
                return;
            }
            list.forEach(c => {
                const hasDue = c.pendingSales > 0 || c.activeLoanPrin > 0;
                const initial = c.name ? c.name.charAt(0).toUpperCase() : 'U';
                const avatarContent = c.photo ? `<img src="${c.photo}" style="width:100%; height:100%; object-fit:cover;">` : initial;
                
                container.innerHTML += `
                    <div class="card ${hasDue ? 'has-due' : ''}">
                        <div class="cust-header">
                            <div class="cust-header-left">
                                <div class="avatar" style="${c.photo ? 'background:transparent;' : ''}">${avatarContent}</div>
                                <div class="cust-info">
                                    <h4>${c.name}</h4>
                                    <p><i class="fas fa-phone"></i> ${c.mobile} | <i class="fas fa-map-marker-alt"></i> ${c.city || 'N/A'}</p>
                                </div>
                            </div>
                            <button class="btn-icon" style="background:var(--whatsapp); color:white; border:none;" onclick="waMessage('${c.mobile}', '${c.name}')" title="WhatsApp"><i class="fab fa-whatsapp"></i></button>
                        </div>
                        <div class="cust-stats">
                            <div class="stat-item">Udhari (Dues)<span class="stat-val ${c.pendingSales > 0 ? 'text-red' : 'text-green'}">₹${c.pendingSales.toLocaleString()}</span></div>
                            <div class="stat-item">Active Loans<span class="stat-val text-blue">₹${c.activeLoanPrin.toLocaleString()}</span></div>
                            <div class="stat-item">Jama (Deposits)<span class="stat-val text-green">₹${c.depBalance.toLocaleString()}</span></div>
                            <div class="stat-item">Total Bought<span class="stat-val" style="color:#555;">₹${c.totalSales.toLocaleString()}</span></div>
                        </div>
                        <div class="cust-actions">
                            <button class="btn-action btn-primary" onclick="open360Modal('${c.id}')"><i class="fas fa-book-open"></i> Open Khata & Profile</button>
                            <button class="btn-action" onclick="openCustomerModal('${c.id}')" style="flex: 0.4;" title="Edit Customer Details"><i class="fas fa-edit"></i> Edit</button>
                        </div>
                    </div>
                `;
            });
        }

        // --- CRM PIPELINE RENDER (FIXED onClick quotes) ---
        function getTagClass(reason) {
            if(!reason) return 'tag-design';
            if(reason.includes('Rate')) return 'tag-rate';
            if(reason.includes('Budget')) return 'tag-budget';
            if(reason.includes('Stock')) return 'tag-rate';
            return 'tag-design';
        }

        function renderCrmTable(list) {
            const tbody = document.getElementById('crmBody');
            tbody.innerHTML = '';
            let hasLeads = false;
            list.forEach(c => {
                if(c.inquiries && c.inquiries.length > 0) {
                    c.inquiries.forEach((inq, idx) => {
                        hasLeads = true;
                        const historyHTML = inq.history.map(note => {
                            const parts = note.split('] ');
                            if(parts.length > 1) return `<div><span class="history-date">${parts[0].replace('[', '')}</span>${parts[1]}</div>`;
                            return `<div>${note}</div>`;
                        }).join('');
                        
                        let actionLogic = '';
                        if(inq.reason === "Waiting for Rate Drop") {
                            actionLogic = `<button class="btn-small pay" style="width:100%; margin-bottom:8px; justify-content:center;" onclick="sendOffer('${c.id}', ${idx}, 'Rate Dropped! Come to store.')"><i class="fas fa-chart-line"></i> Send Rate Alert</button>`;
                        } else if(inq.reason === "Item Not in Stock") {
                            actionLogic = `<button class="btn-small" style="width:100%; margin-bottom:8px; justify-content:center; border-color:#f57c00; color:#f57c00;" onclick="sendOffer('${c.id}', ${idx}, 'Aapke pasand ka item market se aa gaya hai, Photos check karein.')"><i class="fas fa-images"></i> Send Item Photos</button>`;
                        } else if(inq.occasion && inq.occasion !== "None") {
                            actionLogic = `<button class="btn-small" style="width:100%; margin-bottom:8px; justify-content:center; border-color:#e53e3e; color:#e53e3e;" onclick="sendOffer('${c.id}', ${idx}, 'Special ${inq.occasion} Discount inside!')"><i class="fas fa-gift"></i> Send Event Offer</button>`;
                        } else {
                            actionLogic = `<button class="btn-small" style="width:100%; margin-bottom:8px; justify-content:center; border-color:#3182ce; color:#3182ce;" onclick="sendOffer('${c.id}', ${idx}, 'Special Discount on ${inq.item}')"><i class="fas fa-tag"></i> Send General Offer</button>`;
                        }

                        let taskHtml = '';
                        if(inq.task) {
                            taskHtml = `<div class="task-box"><strong><i class="fas fa-tasks"></i> Pending Task:</strong>${inq.task}</div>`;
                        }

                        tbody.innerHTML += `
                            <tr>
                                <td><strong style="font-size:1.05rem;">${c.name}</strong><br><span style="color:#666; font-size:0.85rem;"><i class="fas fa-phone"></i> ${c.mobile}</span></td>
                                <td>
                                    <span style="font-weight:600; font-size:1rem;">${inq.item}</span><br>
                                    <span class="tag ${getTagClass(inq.reason)}">${inq.reason}</span>
                                    ${inq.price ? `<br><small style="color:#888; display:block; margin-top:4px;">Budget: ₹${inq.price}</small>` : ''}
                                    ${taskHtml}
                                </td>
                                <td>${(inq.occasion && inq.occasion !== 'None') ? `<b>${inq.occasion}</b><br><small>${inq.date}</small>` : '-'}</td>
                                <td><div class="history-log">${historyHTML}</div></td>
                                <td>
                                    ${actionLogic}
                                    <button class="btn-small" style="width:100%; justify-content:center; background:#1e293b; color:white; border:none;" onclick="logFollowUp('${c.id}', ${idx})"><i class="fas fa-plus-circle"></i> Log Update / Task Entry</button>
                                </td>
                            </tr>
                        `;
                    });
                }
            });
            if(!hasLeads) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding:30px; color:#888;">No active follow-ups or tasks. Log a new walk-in!</td></tr>';
            }
        }

        function openLeadModal() {
            document.getElementById('lName').value = '';
            document.getElementById('lPhone').value = '';
            document.getElementById('lItem').value = '';
            document.getElementById('lTask').value = '';
            document.getElementById('lPrice').value = '';
            document.getElementById('lDate').value = '';
            openModal('leadModal');
        }

        async function saveLead() {
            const name = document.getElementById('lName').value;
            const mobile = document.getElementById('lPhone').value;
            const item = document.getElementById('lItem').value;
            const task = document.getElementById('lTask').value;
            const reason = document.getElementById('lReason').value;
            const price = document.getElementById('lPrice').value;
            const occasion = document.getElementById('lOccasion').value;
            const date = document.getElementById('lDate').value;
            if(!name || !mobile || !item) return alert("Name, Phone, and Viewed Item are required.");
            let cust = dbCustomers.find(c => c.mobile == mobile);
            if(!cust) {
                const newId = await addItem('customers', { name, mobile, joined: new Date().toISOString(), inquiries: [] });
                cust = await getItem('customers', newId);
            }
            if(!cust.inquiries) cust.inquiries = [];
            const timestamp = new Date().toLocaleString('en-IN', {day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'});
            cust.inquiries.push({
                id: Date.now(),
                item, task, reason, price, occasion, date,
                status: 'Active',
                history: [`[${timestamp}] Store visit recorded. Added to CRM.`]
            });
            await updateItem('customers', cust);
            closeModal('leadModal');
            await loadAllData(); 
        }

        async function logFollowUp(custId, inqIndex) {
            const feedback = prompt(`Enter progress update or customer response:`);
            if(feedback) {
                const c = dbCustomers.find(x => x.id == custId); // loose comparison for string
                const timestamp = new Date().toLocaleString('en-IN', {day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'});
                c.inquiries[inqIndex].history.unshift(`[${timestamp}] ${feedback}`);
                await updateItem('customers', c);
                await loadAllData();
            }
        }

        async function sendOffer(custId, inqIndex, message) {
            const c = dbCustomers.find(x => x.id == custId);
            const timestamp = new Date().toLocaleString('en-IN', {day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'});
            c.inquiries[inqIndex].history.unshift(`[${timestamp}] WhatsApp Sent: ${message}`);
            await updateItem('customers', c);
            await loadAllData();
            waMessage(c.mobile, c.name, message);
        }

        // --- CUSTOMER CRUD (FIXED: no parseInt on IDs) ---
        function openCustomerModal(id = null) {
            const delBtn = document.getElementById('btnDeleteCust');
            document.getElementById('cPhoto').value = ''; 
            document.getElementById('photoPreview').style.display = 'none';
            document.getElementById('photoPreview').src = '';
            document.getElementById('cPhotoBase64').value = '';

            if(id) {
                const c = dbCustomers.find(x => x.id == id);
                document.getElementById('custModalTitle').innerText = "Edit Customer";
                document.getElementById('cId').value = c.id; // string ID
                document.getElementById('cName').value = c.name;
                document.getElementById('cMobile').value = c.mobile;
                document.getElementById('cAadhar').value = c.aadhar || '';
                document.getElementById('cPan').value = c.pan || '';
                document.getElementById('cCity').value = c.city || '';
                if(c.photo) {
                    document.getElementById('photoPreview').src = c.photo;
                    document.getElementById('photoPreview').style.display = 'block';
                    document.getElementById('cPhotoBase64').value = c.photo;
                }
                delBtn.style.display = 'block';
            } else {
                document.getElementById('custModalTitle').innerText = "New Customer";
                document.getElementById('cId').value = '';
                document.getElementById('cName').value = '';
                document.getElementById('cMobile').value = '';
                document.getElementById('cAadhar').value = '';
                document.getElementById('cPan').value = '';
                document.getElementById('cCity').value = '';
                delBtn.style.display = 'none';
            }
            openModal('custModal');
        }

        async function saveCustomer() {
            // 🔥 FIX: Keep ID as string, do not parseInt
            const rawId = document.getElementById('cId').value;
            const id = rawId || null; // string or null
            const name = document.getElementById('cName').value.trim();
            const mobile = document.getElementById('cMobile').value.trim();
            const aadhar = document.getElementById('cAadhar').value.trim();
            const pan = document.getElementById('cPan').value.trim().toUpperCase();
            const city = document.getElementById('cCity').value;
            const photo = document.getElementById('cPhotoBase64').value;

            if(!name || !mobile) return alert("Name and Mobile are mandatory.");
            if(aadhar && (aadhar.length !== 12 || isNaN(aadhar))) return alert("Please enter a valid 12-digit Aadhar Number or leave it blank.");

            // Duplicate check
            let duplicateReason = "";
            const isDuplicate = dbCustomers.some(c => {
                if (id && c.id == id) return false; // skip self
                if (c.name.toLowerCase() === name.toLowerCase() && c.mobile === mobile) {
                    duplicateReason = "This Name and Mobile Number combination already exists!";
                    return true;
                }
                if (aadhar && c.aadhar === aadhar) {
                    duplicateReason = "This Aadhar Number already exists in the system!";
                    return true;
                }
                if (pan && c.pan === pan) {
                    duplicateReason = "This PAN Card already exists in the system!";
                    return true;
                }
                return false;
            });
            if (isDuplicate) return alert("⚠️ Duplicate Entry Detected:\n\n" + duplicateReason);

            if(id) {
                const c = await getItem('customers', id); // id is string
                c.name = name; c.mobile = mobile; c.aadhar = aadhar; c.pan = pan; c.city = city; c.photo = photo;
                await updateItem('customers', c);
            } else {
                await addItem('customers', { name, mobile, aadhar, pan, city, photo, joined: new Date().toISOString(), inquiries: [] });
            }
            closeModal('custModal');
            loadAllData(); 
        }

        async function deleteCustomer() {
            // 🔥 FIX: No parseInt
            const id = document.getElementById('cId').value;
            const c = aggregatedCustomers.find(x => x.id == id);
            const hasOrders = dbOrders.filter(o => o.customerId == id).length > 0;
            const hasSchemes = dbSchemes.filter(s => s.customerId == id).length > 0;
            if(c.totalSales > 0 || c.activeLoanPrin > 0 || c.depBalance !== 0 || hasOrders || hasSchemes) {
                return alert("⚠️ Cannot delete customer.\n\nThey have existing transactions (Sales, Loans, Orders, or Deposits) linked to their account.");
            }
            if(!confirm("Are you sure you want to permanently delete this customer profile?")) return;
            await deleteItem('customers', id);
            alert("Customer deleted successfully.");
            closeModal('custModal');
            loadAllData();
        }

        function waMessage(mobile, name, customMsg = null) {
            let phone = mobile.toString().replace(/\D/g, ''); 
            if(phone.length === 10) phone = '+91' + phone;
            else if(phone.length === 12 && phone.startsWith('91')) phone = '+' + phone;
            else if(!phone.startsWith('+')) phone = '+' + phone;
            const msg = customMsg 
                ? `Hello ${name},\n${customMsg}\n\nGreetings from *Bharti Jewellers*!`
                : `Hello ${name},\n\nGreetings from *Bharti Jewellers*!`;
            window.open(`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`, '_blank');
        }

        // --- 360 MODAL (all onClick references fixed) ---
        function switch360Tab(tab, btn) {
            document.querySelectorAll('#c360Modal .tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('#c360Modal .tab-content').forEach(c => c.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById(`tab-${tab}`).classList.add('active');
        }

        function open360Modal(id) {
            const c = aggregatedCustomers.find(x => x.id == id);
            if(!c) return;

            const v360Avatar = document.getElementById('v360Avatar');
            if(c.photo) {
                v360Avatar.innerHTML = `<img src="${c.photo}" style="width:100%; height:100%; border-radius:50%; object-fit:cover;">`;
                v360Avatar.style.background = 'transparent';
            } else {
                v360Avatar.innerHTML = c.name.charAt(0).toUpperCase();
                v360Avatar.style.background = 'var(--accent-gold)';
            }

            // Edit button using string ID
            document.getElementById('v360Name').innerHTML = `${c.name} <button class="btn-small" style="font-size:0.85rem; margin-left:10px; background:#f1f5f9; color:#333; border: 1px solid #ddd;" onclick="closeModal('c360Modal'); openCustomerModal('${c.id}');"><i class="fas fa-edit"></i> Edit</button>`;
            
            document.getElementById('v360Phone').innerText = c.mobile;
            document.getElementById('v360City').innerHTML = `
                ${c.city || 'N/A'}<br>
                <span style="display:inline-block; margin-top:8px; padding:4px 8px; background:#e2e8f0; border-radius:6px; font-size:0.85rem; color:#333;">
                    <i class="fas fa-id-card"></i> Aadhar: <b>${c.aadhar || '<span style="color:#c62828;">Pending</span>'}</b> &nbsp;|&nbsp; PAN: <b>${c.pan || 'N/A'}</b>
                </span>
            `;

            // Khata rendering (id is string, so use ==)
            const bKhata = document.getElementById('b360Khata');
            bKhata.innerHTML = '';
            const mySales = dbSales.filter(s => s.customerId == id && s.status !== 'cancelled').sort((a,b) => new Date(b.date) - new Date(a.date));
            let totalUdhari = 0;
            if(mySales.length === 0) {
                bKhata.innerHTML = '<tr><td colspan="7" style="text-align:center; padding: 25px; color:#888;">No Sales or Khata history found.</td></tr>';
            } else {
                mySales.forEach(s => {
                    const total = parseFloat(s.grandTotal || 0);
                    const paid = parseFloat(s.paidAmount || 0);
                    const due = parseFloat(s.pendingAmount || 0);
                    if (due > 0) totalUdhari += due;
                    const isPaid = due <= 0;
                    const badge = isPaid ? `<span class="badge bg-green">Cleared</span>` : `<span class="badge bg-red">Due</span>`;
                    let actionHtml = due > 0 
                        ? `<button class="btn-small pay" onclick="window.location.href='sales.html?edit=${s.id}'"><i class="fas fa-hand-holding-usd"></i> Receive Due</button>`
                        : `<button class="btn-small" onclick="window.location.href='sales.html?edit=${s.id}'"><i class="fas fa-eye"></i> View Bill</button>`;
                    bKhata.innerHTML += `
                        <tr>
                            <td>${new Date(s.date).toLocaleDateString('en-IN', {day:'numeric', month:'short', year:'numeric'})}</td>
                            <td style="font-weight:bold; color:#555;">#${s.id}</td>
                            <td style="font-weight:600; font-size:1rem;">₹${total.toLocaleString()}</td>
                            <td style="color:var(--in-green); font-weight:600;">₹${paid.toLocaleString()}</td>
                            <td style="color:var(--out-red); font-weight:bold; font-size:1rem;">₹${due > 0 ? due.toLocaleString() : '0'}</td>
                            <td>${badge}</td>
                            <td style="text-align:center;">${actionHtml}</td>
                        </tr>
                    `;
                });
            }
            document.getElementById('v360TotalUdhari').innerText = "₹" + totalUdhari.toLocaleString();

            // CRM Inquiries
            const bInquiries = document.getElementById('b360Inquiries');
            bInquiries.innerHTML = '';
            if(!c.inquiries || c.inquiries.length === 0) {
                bInquiries.innerHTML = '<tr><td colspan="3" style="text-align:center;">No CRM leads or tasks found.</td></tr>';
            } else {
                c.inquiries.forEach(inq => {
                    const historyHTML = inq.history.map(note => {
                        const parts = note.split('] ');
                        if(parts.length > 1) return `<div><span class="history-date">${parts[0].replace('[', '')}</span>${parts[1]}</div>`;
                        return `<div>${note}</div>`;
                    }).join('');
                    let taskHtml = inq.task ? `<div class="task-box" style="margin-top:6px;"><strong>Pending Task:</strong>${inq.task}</div>` : '';
                    bInquiries.innerHTML += `
                        <tr>
                            <td style="vertical-align:top;"><strong style="font-size:1rem;">${inq.item}</strong>${taskHtml}</td>
                            <td style="vertical-align:top;"><span class="tag ${getTagClass(inq.reason)}">${inq.reason}</span><br><small style="color:#666;">Budget: ₹${inq.price || 'N/A'}</small></td>
                            <td><div class="history-log">${historyHTML}</div></td>
                        </tr>
                    `;
                });
            }

            // Orders
            const bOrders = document.getElementById('b360Orders');
            bOrders.innerHTML = '';
            const myOrders = dbOrders.filter(o => o.customerId == id).sort((a,b) => new Date(b.orderDate) - new Date(a.orderDate));
            if(myOrders.length === 0) bOrders.innerHTML = '<tr><td colspan="6" style="text-align:center;">No Custom Orders found.</td></tr>';
            else {
                myOrders.forEach(o => {
                    let badge = `<span class="badge bg-blue">${o.status}</span>`;
                    if(o.status === 'completed') badge = `<span class="badge bg-green">Ready</span>`;
                    if(o.status === 'delivered') badge = `<span class="badge bg-gold">Delivered</span>`;
                    bOrders.innerHTML += `
                        <tr>
                            <td>${new Date(o.orderDate).toLocaleDateString()}</td>
                            <td>${o.category}</td>
                            <td>₹${(o.estAmount||0).toLocaleString()}</td>
                            <td class="text-green">₹${(o.advancePaid||0).toLocaleString()}</td>
                            <td>${badge}</td>
                            <td style="text-align:center;"><a href="orders.html" class="btn-small"><i class="fas fa-arrow-right"></i> Manage</a></td>
                        </tr>
                    `;
                });
            }

            // Loans
            const bLoans = document.getElementById('b360Loans');
            bLoans.innerHTML = '';
            const myLoans = dbLoans.filter(l => l.customerId == id).sort((a,b) => new Date(b.date) - new Date(a.date));
            if(myLoans.length === 0) bLoans.innerHTML = '<tr><td colspan="6" style="text-align:center;">No Gold Loans found.</td></tr>';
            else {
                myLoans.forEach(l => {
                    const badge = l.status === 'active' ? `<span class="badge bg-red">Active</span>` : `<span class="badge bg-green">Closed</span>`;
                    let prin = l.amount;
                    if(l.ledger && l.ledger.length > 0) prin = l.ledger[l.ledger.length-1].closingPrincipal;
                    bLoans.innerHTML += `
                        <tr>
                            <td>${new Date(l.date).toLocaleDateString()}</td>
                            <td>${l.description}</td>
                            <td style="font-weight:bold;">₹${parseFloat(prin).toLocaleString()}</td>
                            <td>${l.ratePercent}%</td>
                            <td>${badge}</td>
                            <td style="text-align:center;"><a href="loans.html" class="btn-small"><i class="fas fa-arrow-right"></i> Manage</a></td>
                        </tr>
                    `;
                });
            }

            // Schemes
            const bSchemes = document.getElementById('b360Schemes');
            bSchemes.innerHTML = '';
            const mySchemes = dbSchemes.filter(s => s.customerId == id).sort((a,b) => new Date(b.startDate) - new Date(a.startDate));
            if(mySchemes.length === 0) bSchemes.innerHTML = '<tr><td colspan="5" style="text-align:center;">No BC Schemes found.</td></tr>';
            else {
                mySchemes.forEach(s => {
                    let badge = `<span class="badge bg-blue">Active</span>`;
                    if(s.status === 'completed') badge = `<span class="badge bg-gold">Matured</span>`;
                    if(s.status === 'redeemed') badge = `<span class="badge bg-green">Redeemed</span>`;
                    const paidM = s.ledger.filter(m => m.status === 'paid' || m.status === 'bonus_applied').length;
                    bSchemes.innerHTML += `
                        <tr>
                            <td>${new Date(s.startDate).toLocaleDateString()}</td>
                            <td style="font-weight:bold;">₹${parseFloat(s.amount).toLocaleString()}</td>
                            <td>${paidM} / 12</td>
                            <td>${badge}</td>
                            <td style="text-align:center;"><a href="schemes.html" class="btn-small"><i class="fas fa-arrow-right"></i> Manage</a></td>
                        </tr>
                    `;
                });
            }

            // Deposits
            const bDeps = document.getElementById('b360Deposits');
            document.getElementById('v360DepBal').innerText = "₹" + c.depBalance.toLocaleString();
            bDeps.innerHTML = '';
            const myDeps = dbDeposits.filter(d => d.customerId == id).sort((a,b) => new Date(b.date) - new Date(a.date));
            if(myDeps.length === 0) bDeps.innerHTML = '<tr><td colspan="4" style="text-align:center;">No Deposit records found.</td></tr>';
            else {
                myDeps.forEach(d => {
                    const isIN = d.type === 'IN';
                    const color = isIN ? 'var(--in-green)' : 'var(--out-red)';
                    bDeps.innerHTML += `
                        <tr>
                            <td>${new Date(d.date).toLocaleDateString()}</td>
                            <td style="font-weight:bold; color:${color};">${isIN ? 'Received' : 'Returned'}</td>
                            <td style="font-weight:bold; color:${color};">₹${parseFloat(d.amount).toLocaleString()}</td>
                            <td>${d.note || '-'}</td>
                        </tr>
                    `;
                });
            }

            document.querySelectorAll('#c360Modal .tab')[0].click();
            openModal('c360Modal');
        }
    </script>
