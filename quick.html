<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Search - Bharti Jewellers</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .master-container { padding: 20px; max-width: 800px; margin: auto; background: #fff; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        
        /* Search Bar Style */
        .search-box { width: 100%; padding: 15px; font-size: 1.2rem; border: 2px solid #d4af37; border-radius: 8px; margin-bottom: 20px; box-sizing: border-box; text-align: center;}
        
        /* Action Section (Hidden by default) */
        .action-section { display: none; }
        .customer-title { text-align: center; color: #333; margin-bottom: 20px; font-size: 1.5rem; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        
        /* Left & Right Grid */
        .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        
        .column { padding: 15px; border-radius: 8px; }
        .col-left { background: #e8f5e9; border: 1px solid #c8e6c9; } /* Green tint for IN */
        .col-right { background: #ffebee; border: 1px solid #ffcdd2; } /* Red tint for OUT */
        
        h3 { text-align: center; margin-top: 0; font-size: 1.1rem; }
        .col-left h3 { color: #2e7d32; }
        .col-right h3 { color: #c62828; }
        
        /* Buttons */
        .action-btn { width: 100%; padding: 12px; margin-bottom: 10px; border: none; border-radius: 5px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: 0.2s; }
        
        /* Left Buttons (Greenish) */
        .btn-in { background: #4caf50; color: white; }
        .btn-in:hover { background: #388e3c; }
        
        /* Right Buttons (Reddish) */
        .btn-out { background: #f44336; color: white; }
        .btn-out:hover { background: #d32f2f; }

        /* General Button (Blue) */
        .btn-neutral { background: #2196f3; color: white; margin-top: 20px; }
    </style>
</head>
<body>

<div class="master-container">
    
    <!-- Step 1: Search Bar -->
    <input type="text" id="searchCustomer" class="search-box" list="customerList" placeholder="🔍 Customer Ka Naam Search Karein..." onchange="showActions()">
    <datalist id="customerList"></datalist>

    <!-- Step 2: Action Buttons (Appears after selection) -->
    <div id="actionPanel" class="action-section">
        <h2 class="customer-title" id="displayCustName">Customer Name</h2>
        
        <div class="action-grid">
            
            <!-- LEFT SIDE: IN (Jama / Aaya) -->
            <div class="column col-left">
                <h3>⬇️ IN (Jama / Aaya)</h3>
                <button class="action-btn btn-in" onclick="openForm('Sale')">🛒 Sale (Bikri)</button>
                <button class="action-btn btn-in" onclick="openForm('Byaaj Jama')">💰 Byaaj Jama</button>
                <button class="action-btn btn-in" onclick="openForm('Girvi Jama')">💍 Girvi Jama (Purana)</button>
                <button class="action-btn btn-in" onclick="openForm('Release')">🔓 Release (Chhudana)</button>
                <button class="action-btn btn-in" onclick="openForm('Payment In')">💵 Other Payment In</button>
            </div>

            <!-- RIGHT SIDE: OUT (Karcha / Gaya) -->
            <div class="column col-right">
                <h3>⬆️ OUT (Udhar / Gaya)</h3>
                <button class="action-btn btn-out" onclick="openForm('Girvi Rakha')">🏦 Girvi Rakha (Loan Diya)</button>
                <button class="action-btn btn-out" onclick="openForm('Purchase')">🛍️ Purchase (Khareedi)</button>
                <button class="action-btn btn-out" onclick="openForm('Payment Diya')">💸 Payment Diya</button>
                <button class="action-btn btn-out" onclick="openForm('Expense')">📝 Expense (Kharcha)</button>
            </div>
            
        </div>
        
        <!-- Reset Button -->
        <button class="action-btn btn-neutral" onclick="resetSearch()">❌ Cancel / New Search</button>
    </div>

</div>

<!-- Aapki Database file -->
<script src="db.js"></script>

<script>
    // 1. Page load hote hi Customers list me bharo
    window.onload = async function() {
        try {
            const customers = await getAllItems('customers');
            const datalist = document.getElementById('customerList');
            datalist.innerHTML = ''; 
            
            customers.forEach(cust => {
                if(cust.name) {
                    let option = document.createElement('option');
                    option.value = cust.name + (cust.mobile ? ` - ${cust.mobile}` : '');
                    datalist.appendChild(option);
                }
            });
        } catch (error) {
            console.error("Customer load nahi hue:", error);
        }
    };

    // 2. Customer select hone par Actions show karo
    function showActions() {
        let inputVal = document.getElementById('searchCustomer').value;
        
        if (inputVal.length > 2) { // Kam se kam 3 letter ya selection par
            document.getElementById('actionPanel').style.display = 'block';
            document.getElementById('displayCustName').innerText = "👤 " + inputVal.split(' - ')[0]; // Sirf naam dikhao
        } else {
            document.getElementById('actionPanel').style.display = 'none';
        }
    }

    // 3. Reset karna wapas search ke liye
    function resetSearch() {
        document.getElementById('searchCustomer').value = '';
        document.getElementById('actionPanel').style.display = 'none';
    }

    // 4. Buttons par click karne par kya hoga?
    function openForm(actionType) {
        let customer = document.getElementById('displayCustName').innerText.replace('👤 ', '');
        
        // Abhi ke liye alert chalega
        alert(`Aap ${customer} ke liye "${actionType}" ki entry karna chahte hain.\n\nYahan par hum ek chota popup form khol sakte hain.`);
        
        // Yahan aap bataiye kya karna hai!
    }
</script>

</body>
</html>
