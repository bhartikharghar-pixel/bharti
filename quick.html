<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Rojmel - Bharti Jewellers</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #f0f2f5; margin: 0; padding: 15px; color: #333; }
        .master-container { max-width: 1200px; margin: auto; }
        
        .header { display: flex; justify-content: space-between; align-items: center; background: #fff; padding: 15px 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 20px; border-bottom: 3px solid #C5A059;}
        .header h1 { margin: 0; font-size: 1.5rem; color: #000; text-transform: uppercase; letter-spacing: 1px;}
        .refresh-btn { background: #111; color: #C5A059; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 0.95rem; display: flex; align-items: center; gap: 8px;}
        .refresh-btn:hover { background: #000; }

        /* --- QUICK ACTION BUTTONS --- */
        .action-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 25px; }
        @media(max-width: 800px) { .action-grid { grid-template-columns: repeat(2, 1fr); } }
        @media(max-width: 450px) { .action-grid { grid-template-columns: 1fr; } }
        
        .action-btn { background: #fff; padding: 15px; border-radius: 8px; border: 1px solid #ddd; font-size: 1.05rem; font-weight: 700; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 10px; transition: 0.2s; box-shadow: 0 2px 5px rgba(0,0,0,0.02);}
        .btn-green { color: #2e7d32; border-bottom: 3px solid #4caf50; }
        .btn-green:hover { background: #e8f5e9; }
        .btn-red { color: #c62828; border-bottom: 3px solid #f44336; }
        .btn-red:hover { background: #ffebee; }

        /* --- ASLI ROJMEL (LEDGER) BOOK --- */
        .rojmel-book { background: #fff; border-radius: 12px; box-shadow: 0 5px 20px rgba(0,0,0,0.08); overflow: hidden; border: 1px solid #ddd; }
        .rojmel-header { background: #111; color: #fff; padding: 15px; text-align: center; font-size: 1.2rem; font-weight: bold; text-transform: uppercase; letter-spacing: 2px;}
        
        .rojmel-split { display: flex; width: 100%; border-bottom: 2px solid #333; }
        @media(max-width: 768px) { .rojmel-split { flex-direction: column; } .jama-side { border-right: none !important; border-bottom: 2px solid #333; } }
        
        .jama-side, .nama-side { flex: 1; display: flex; flex-direction: column; border-right: 2px solid #333; }
        .nama-side { border-right: none; }
        
        .side-title { padding: 12px; text-align: center; font-weight: 800; font-size: 1.2rem; text-transform: uppercase; border-bottom: 1px dashed #ccc; }
        .title-jama { color: #2e7d32; background: #f1f8e9; }
        .title-nama { color: #c62828; background: #ffebee; }

        .rojmel-list { list-style: none; padding: 0; margin: 0; flex: 1; min-height: 300px;}
        .r-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 15px; border-bottom: 1px solid #eee; font-size: 0.95rem; }
        .r-item:hover { background: #fafafa; }
        
        .r-detail { flex: 1; padding-right: 10px; }
        .r-desc { font-weight: 700; color: #222; display: block; margin-bottom: 3px;}
        .r-sub { font-size: 0.8rem; color: #666; }
        .r-amt { font-weight: 800; font-size: 1.1rem; }
        .amt-jama { color: #2e7d32; }
        .amt-nama { color: #c62828; }

        /* Highlight specific rows */
        .row-opening { background: #e3f2fd !important; }
        .row-closing { background: #fff8e1 !important; border-top: 2px dashed #C5A059; }

        .rojmel-footer { display: flex; width: 100%; background: #111; color: #C5A059; font-size: 1.3rem; font-weight: 800; text-transform: uppercase; }
        @media(max-width: 768px) { .rojmel-footer { flex-direction: column; } .foot-left { border-right: none !important; border-bottom: 1px solid #333; } }
        
        .foot-left, .foot-right { flex: 1; display: flex; justify-content: space-between; padding: 15px 20px; border-right: 2px solid #333; }
        .foot-right { border-right: none; }

        /* --- POPUP MODAL --- */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); justify-content: center; align-items: center;}
        .modal-content { background: #fff; padding: 25px; border-radius: 12px; width: 95%; max-width: 480px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); position: relative; max-height: 90vh; overflow-y: auto;}
        .close-btn { position: absolute; right: 15px; top: 15px; font-size: 24px; cursor: pointer; color: #888; background: none; border: none; }
        
        .form-group { margin-bottom: 15px; position: relative; }
        .form-row { display: flex; gap: 10px; margin-bottom: 15px; }
        .form-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 5px; color: #555; }
        .form-group input, .form-group select { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 1rem; background: #fafafa;}
        .form-group input:focus { border-color: #C5A059; background: #fff; outline: none; }
        
        .dropdown-list { display: none; position: absolute; width: 100%; max-height: 180px; overflow-y: auto; background: white; border: 1px solid #ccc; z-index: 2000; box-shadow: 0 5px 15px rgba(0,0,0,0.1); border-radius: 6px; margin-top: 2px; }
        .dropdown-item { padding: 12px; border-bottom: 1px solid #eee; cursor: pointer; font-size: 0.95rem; color: #333; }
        .dropdown-item:hover { background: #fdfbf7; color: #C5A059; font-weight: bold; }

        .amount-box { background: #fff8e1; padding: 15px; border-radius: 8px; border: 1px solid #ffe082; margin-top: 10px; margin-bottom: 15px; }
        .amount-row { display: flex; justify-content: space-between; font-size: 0.95rem; margin-bottom: 5px; color: #555; font-weight: 600;}
        .amount-total { font-size: 1.3rem; font-weight: 800; color: #D32F2F; border-top: 1px dashed #ccc; padding-top: 8px; margin-top: 5px; display: flex; justify-content: space-between;}
        
        .save-btn { width: 100%; padding: 16px; background: #C5A059; color: #000; font-size: 1.1rem; font-weight: 800; border: none; border-radius: 8px; cursor: pointer; text-transform: uppercase; margin-top: 10px;}
    </style>
</head>
<body>

<div class="master-container">
    
    <div class="header">
        <h1><i class="fas fa-book-open"></i> Quick Rojmel</h1>
        <button class="refresh-btn" onclick="location.reload()"><i class="fas fa-sync-alt"></i> Refresh</button>
    </div>

    <div class="action-grid">
        <button class="action-btn btn-green" onclick="openPopup('Sale')"><i class="fas fa-shopping-bag"></i> Sale (Bikri)</button>
        <button class="action-btn btn-green" onclick="openPopup('Byaaj Jama')"><i class="fas fa-coins"></i> Byaaj Jama</button>
        <button class="action-btn btn-green" onclick="openPopup('Girvi Chhudaya')"><i class="fas fa-unlock"></i> Girvi Chhudaya</button>
        <button class="action-btn btn-green" onclick="openPopup('Payment In')"><i class="fas fa-wallet"></i> Payment Aaya</button>
        
        <button class="action-btn btn-red" onclick="openPopup('Girvi Diya')"><i class="fas fa-hand-holding-usd"></i> Girvi Diya</button>
        <button class="action-btn btn-red" onclick="openPopup('Purchase')"><i class="fas fa-shopping-cart"></i> Khareedi</button>
        <button class="action-btn btn-red" onclick="openPopup('Payment Diya')"><i class="fas fa-money-bill-wave"></i> Payment Diya</button>
        <button class="action-btn btn-red" onclick="openPopup('Expense')"><i class="fas fa-file-invoice"></i> Kharcha</button>
    </div>

    <div class="rojmel-book">
        <div class="rojmel-header">Aaj Ka Hisaab (Rojmel) - <span id="todayDateStr"></span></div>
        
        <div class="rojmel-split">
            <div class="jama-side">
                <div class="side-title title-jama">JAMA (IN)</div>
                <ul class="rojmel-list" id="jamaList">
                    </ul>
            </div>

            <div class="nama-side">
                <div class="side-title title-nama">NAMA (OUT)</div>
                <ul class="rojmel-list" id="namaList">
                    </ul>
            </div>
        </div>

        <div class="rojmel-footer">
            <div class="foot-left">
                <span>Total Jama:</span>
                <span id="totalJamaAmt">₹0</span>
            </div>
            <div class="foot-right">
                <span>Total Nama:</span>
                <span id="totalNamaAmt">₹0</span>
            </div>
        </div>
    </div>

</div>

<div id="entryModal" class="modal">
    <div class="modal-content">
        <button class="close-btn" onclick="closePopup()">&times;</button>
        <h2 id="modalTitle" style="margin-top:0; color:#C5A059; border-bottom: 2px solid #eee; padding-bottom: 10px;">Entry Form</h2>
        
        <form id="dynamicForm">
            <input type="hidden" id="actionType">
            <div id="formFields"></div>
            <button type="button" class="save-btn" onclick="saveEntry()"><i class="fas fa-check-circle"></i> Save Data</button>
        </form>
    </div>
</div>

<script src="db.js"></script>

<script>
    let allCustomers = [];
    let allInventory = [];
    let allLoans = [];
    let goldRates = { rate22k: 0, rate24k: 0, rate18k: 0, rateSilver: 0 };
    let globalGstDefault = 3;
    let selectedItemObj = null;
    let isLoanAction = false; 

    window.onload = async function() {
        document.getElementById('todayDateStr').innerText = new Date().toLocaleDateString('en-IN', {day: 'numeric', month: 'short', year: 'numeric'});
        await loadCoreData();
        await renderRojmel();
    };

    async function loadCoreData() {
        try {
            allCustomers = await getAllItems('customers').catch(()=>[]);
            allInventory = await getAllItems('inventory').catch(()=>[]); 
            allLoans = await getAllItems('loans').catch(()=>[]);
            const r = await getSetting('gold_rates'); 
            if(r) goldRates = r;
            const defaults = await getSetting('billing_defaults');
            if(defaults && defaults.gst) globalGstDefault = defaults.gst;
        } catch (error) { console.error("Data load error:", error); }
    }

    function getCustName(id) {
        let c = allCustomers.find(x => String(x.id) === String(id));
        return c ? c.name : 'Walk-in';
    }

    function getMoneyType(modeStr) {
        if(!modeStr) return 'cash';
        let m = String(modeStr).toLowerCase();
        if (m.includes('upi') || m.includes('bank') || m.includes('card')) return 'bank';
        if (m.includes('metal') || m.includes('-')) return 'none';
        return 'cash'; 
    }

    // ==========================================
    // 🔥 THE MASTER ROJMEL ENGINE (PERFECT MATH)
    // ==========================================
    async function renderRojmel() {
        try {
            let todayStr = new Date().toISOString().split('T')[0];
            
            let jamaArray = [];
            let namaArray = [];

            // 1. Calculate Opening Balance (Cash + Bank)
            let cashflow = await getAllItems('cashflow').catch(()=>[]);
            let openingBal = 0;
            
            cashflow.forEach(c => {
                let amt = Math.abs(parseFloat(c.amount)) || 0;
                let cDate = c.date ? c.date.split('T')[0] : '';
                if (getMoneyType(c.mode) === 'none') return;
                
                let type = c.type || 'OUT';
                if(parseFloat(c.amount) < 0 && c.type === 'IN') type = 'OUT';

                if (cDate < todayStr) {
                    if (type === 'IN') openingBal += amt; else openingBal -= amt;
                }
            });

            // Add Opening Balance to JAMA
            jamaArray.push({
                title: 'Opening Balance', 
                sub: 'Pichle din ka bacha cash', 
                amt: openingBal, 
                isSpecial: 'row-opening'
            });

            // 2. Fetch Sales (The Core Logic you requested)
            let sales = await getAllItems('sales').catch(()=>[]);
            sales.filter(s => s.date && s.date.startsWith(todayStr) && s.status !== 'cancelled').forEach(s => {
                let cName = getCustName(s.customerId);
                
                // Get complete Sale info
                let grossAmt = s.grandTotal || 0;
                let udhari = s.pendingAmount || 0;
                let oldGoldVal = s.oldGoldDeduction || 0;
                let discount = s.discount || 0;

                // Form string for items: "Ring (RNG01) 5.2g"
                let itemsStr = s.items.map(i => `${i.category} [${i.barcode||'-'}] ${parseFloat(i.weight||0).toFixed(3)}g`).join(' | ');

                // RULE 1: Pura Sale (Gross) hamesha JAMA me aayega
                if(grossAmt > 0) {
                    jamaArray.push({ title: `Sale: ${cName}`, sub: itemsStr, amt: grossAmt });
                }

                // RULE 2: Agar Udhari rakhi, to wo NAMA me aayegi
                if(udhari > 0) {
                    namaArray.push({ title: `Udhari (Credit): ${cName}`, sub: 'Bill me udhar bacha', amt: udhari });
                }

                // RULE 3: Agar Old Gold Jama kiya, to wo bhi NAMA me aayega
                if(oldGoldVal > 0) {
                    namaArray.push({ title: `Old Gold Exch: ${cName}`, sub: 'Bill me jama kiya', amt: oldGoldVal });
                }

                // RULE 4: Discount NAMA me aayega
                if(discount > 0) {
                    namaArray.push({ title: `Discount Given: ${cName}`, sub: 'Chhoot di', amt: discount });
                }
            });

            // 3. Fetch Purchases
            let purchases = await getAllItems('purchases').catch(()=>[]);
            purchases.filter(p => p.date && p.date.startsWith(todayStr)).forEach(p => {
                let grossAmt = p.grandTotal || 0;
                let dueAmt = p.pendingAmount || p.dueAmount || 0;
                let itemsStr = p.items.map(i => `${i.category} [${parseFloat(i.weight||0).toFixed(3)}g]`).join(' | ');

                // Purchase Gross -> NAMA
                if(grossAmt > 0) {
                    namaArray.push({ title: `Purchase (Stock)`, sub: itemsStr, amt: grossAmt });
                }
                // Agar purchase me Merchant ka udhari rakha -> JAMA
                if(dueAmt > 0) {
                    jamaArray.push({ title: `Merchant Credit`, sub: 'Paisa dena baaki hai', amt: dueAmt });
                }
            });

            // 4. Fetch Loans (Girvi)
            let loans = await getAllItems('loans').catch(()=>[]);
            loans.forEach(l => {
                let cName = getCustName(l.customerId);
                let itemStr = l.itemName || l.item || l.description || 'Item';
                let wtStr = parseFloat(l.weight || l.netWt || l.grossWt || 0).toFixed(3) + 'g';

                // Naya Loan Diya (Girvi Rakhi) -> NAMA
                if (l.date && l.date.startsWith(todayStr) && l.status === 'active') {
                    let amt = l.amount || l.loanAmount || l.principalAmount || 0;
                    namaArray.push({ title: `Girvi Diya: ${cName}`, sub: `${itemStr} (${wtStr})`, amt: amt });
                }

                // Loan Repayment Aaya (Byaaj/Chhudaya) -> JAMA
                if (l.payments && l.payments.length > 0) {
                    l.payments.filter(p => p.date && p.date.startsWith(todayStr)).forEach(p => {
                        let typeStr = p.type === 'Release' ? '(Pura Chhudaya)' : p.type;
                        jamaArray.push({ title: `Girvi ${typeStr}: ${cName}`, sub: `For ${itemStr}`, amt: p.amount });
                    });
                }
            });

            // 5. Old Gold (Direct Purchase) -> NAMA
            let oldGold = await getAllItems('old_gold').catch(()=>[]);
            oldGold.filter(o => o.date && o.date.startsWith(todayStr) && o.mode !== 'POS Exchange').forEach(o => {
                let amt = parseFloat(o.amount || o.paidAmount || o.cash || 0);
                if(amt > 0) namaArray.push({ title: `Old Gold Buy: ${getCustName(o.customerId)}`, sub: `${parseFloat(o.netWt||o.oldGoldWeight||0).toFixed(3)}g`, amt: amt });
            });

            // 6. Cashflow (Expenses, Other In/Out)
            cashflow.filter(c => c.date && c.date.startsWith(todayStr)).forEach(c => {
                let amt = parseFloat(c.amount || 0);
                let cat = String(c.category || '').toLowerCase();
                let note = String(c.note || '').toLowerCase();
                if(cat.includes('sale') || cat.includes('loan') || cat.includes('purchase') || note.includes('pos')) return;

                if (c.type === 'IN') {
                    jamaArray.push({ title: c.category || 'Payment In', sub: c.note || c.mode, amt: amt });
                } else {
                    namaArray.push({ title: c.category || 'Expense/Payment Out', sub: c.note || c.mode, amt: amt });
                }
            });

            // --- CALCULATE TOTALS ---
            let totalJamaSum = jamaArray.reduce((sum, item) => sum + item.amt, 0);
            let totalNamaSum = namaArray.reduce((sum, item) => sum + item.amt, 0);
            
            // Closing Balance is always added to NAMA to make both sides equal
            let closingBal = totalJamaSum - totalNamaSum;
            
            namaArray.push({
                title: 'Closing Balance',
                sub: 'Dukaan me bacha cash',
                amt: closingBal,
                isSpecial: 'row-closing'
            });

            // After adding closing balance, Total Nama = Total Jama
            let finalNamaSum = totalNamaSum + closingBal;

            // --- RENDER UI ---
            const createRow = (data, isJama) => {
                let amtColor = isJama ? 'amt-jama' : 'amt-nama';
                let specialCls = data.isSpecial ? data.isSpecial : '';
                return `
                <li class="r-item ${specialCls}">
                    <div class="r-detail">
                        <span class="r-desc">${data.title}</span>
                        <span class="r-sub">${data.sub}</span>
                    </div>
                    <div class="r-amt ${amtColor}">₹${data.amt.toLocaleString()}</div>
                </li>`;
            };

            document.getElementById('jamaList').innerHTML = jamaArray.map(d => createRow(d, true)).join('');
            document.getElementById('namaList').innerHTML = namaArray.map(d => createRow(d, false)).join('');

            document.getElementById('totalJamaAmt').innerText = `₹${totalJamaSum.toLocaleString()}`;
            document.getElementById('totalNamaAmt').innerText = `₹${finalNamaSum.toLocaleString()}`;

        } catch(e) { console.error("Rojmel Error:", e); }
    }


    // ==========================================
    // POPUP ENTRY LOGIC
    // ==========================================
    function openPopup(action) {
        selectedItemObj = null;
        document.getElementById('modalTitle').innerText = action + " Entry";
        document.getElementById('actionType').value = action;
        
        isLoanAction = (action === 'Byaaj Jama' || action === 'Girvi Chhudaya');
        let fieldsHTML = '';

        if(action === 'Sale') {
            fieldsHTML = `
                <div class="form-group" style="position:relative;">
                    <label>Customer Name</label>
                    <input type="text" id="p_customer" placeholder="🔍 Type Customer Name..." autocomplete="off" onfocus="showCustomerDropdown()" oninput="filterCustomerInPopup()" style="border: 2px solid #C5A059; font-weight:bold;">
                    <input type="hidden" id="p_customerId">
                    <div id="customerDropdownPopup" class="dropdown-list"></div>
                </div>
                <div class="form-group" style="position:relative;">
                    <label>Item Name / Barcode (Shop Inventory)</label>
                    <input type="text" id="p_item" placeholder="🔍 Scan ya Type karein..." autocomplete="off" onfocus="showItemDropdown()" oninput="filterItemInPopup()" required>
                    <div id="itemDropdownPopup" class="dropdown-list"></div>
                </div>
                <div class="form-row">
                    <div class="form-group" style="flex:1;"><label>Net Wt (g)</label><input type="number" step="0.001" id="p_weight" placeholder="0.000" oninput="calcSmartAmount()" required></div>
                    <div class="form-group" style="flex:1;"><label>Rate (₹/g)</label><input type="number" id="p_rate" placeholder="₹ Bhaav" oninput="calcSmartAmount()"></div>
                </div>
                <div class="form-row">
                    <div class="form-group" style="flex:1;"><label>Making (₹)</label><input type="number" id="p_making" value="0" oninput="calcSmartAmount()"></div>
                    <div class="form-group" style="flex:1;"><label>GST (%)</label><input type="number" id="p_gst" value="${globalGstDefault}" oninput="calcSmartAmount()"></div>
                </div>
                
                <div class="form-row">
                    <div class="form-group" style="flex:1;"><label>Udhari Rakhni Hai (₹)</label><input type="number" id="p_udhari" value="0" placeholder="0" oninput="calcSmartAmount()"></div>
                    <div class="form-group" style="flex:1;"><label>Old Gold Jama (₹)</label><input type="number" id="p_oldgold" value="0" placeholder="0" oninput="calcSmartAmount()"></div>
                </div>

                <div class="amount-box">
                    <div class="amount-row"><span>Gross Bill (JAMA):</span> <b id="liveMetal">₹0</b></div>
                    <div class="amount-row"><span>Deduction (NAMA):</span> <b id="liveTax">₹0</b></div>
                    <div class="amount-total"><span>Net Cash Received:</span> <span id="liveTotal">₹0</span></div>
                </div>
            `;
        } 
        else if (action === 'Girvi Diya') {
            fieldsHTML = `
                <div class="form-group" style="position:relative;">
                    <label>Customer Name</label>
                    <input type="text" id="p_customer" placeholder="🔍 Type Customer Name..." autocomplete="off" onfocus="showCustomerDropdown()" oninput="filterCustomerInPopup()" style="border: 2px solid #C5A059; font-weight:bold;">
                    <input type="hidden" id="p_customerId">
                    <div id="customerDropdownPopup" class="dropdown-list"></div>
                </div>
                <div class="form-group">
                    <label>Item Description (Customer ka Sona/Chandi)</label>
                    <input type="text" id="p_item" placeholder="✍️ Jaise: 2 Gold Bangles..." autocomplete="off" required>
                </div>
                <div class="form-row">
                    <div class="form-group" style="flex:1;"><label>Weight (g)</label><input type="number" step="0.001" id="p_weight" placeholder="0.000" required></div>
                    <div class="form-group" style="flex:1;"><label>Interest Rate (%)</label><input type="number" step="0.1" id="p_intRate" value="2.0" required></div>
                </div>
                <div class="form-group"><label>Loan Amount Given (₹)</label><input type="number" id="p_amount" placeholder="₹ Amount" style="font-size:1.2rem; font-weight:bold; color:#c62828;" required></div>
            `;
        }
        else if (action === 'Purchase') {
            fieldsHTML = `
                <div class="form-group" style="position:relative;">
                    <label>Customer/Merchant Name</label>
                    <input type="text" id="p_customer" placeholder="🔍 Type Name..." autocomplete="off" onfocus="showCustomerDropdown()" oninput="filterCustomerInPopup()" style="border: 2px solid #C5A059; font-weight:bold;">
                    <input type="hidden" id="p_customerId">
                    <div id="customerDropdownPopup" class="dropdown-list"></div>
                </div>
                <div class="form-group">
                    <label>Item Description (Khareedi Sona/Chandi)</label>
                    <input type="text" id="p_item" placeholder="✍️ Jaise: Old Chain..." autocomplete="off" required>
                </div>
                <div class="form-row">
                    <div class="form-group" style="flex:1;"><label>Net Wt (g)</label><input type="number" step="0.001" id="p_weight" placeholder="0.000" oninput="calcPurchaseAmount()" required></div>
                    <div class="form-group" style="flex:1;"><label>Rate (₹/g)</label><input type="number" id="p_rate" placeholder="₹ Bhaav" oninput="calcPurchaseAmount()"></div>
                </div>
                <div class="amount-box"><div class="amount-total"><span>Total Amount:</span> <span id="liveTotal">₹0</span></div></div>
                <div class="form-group"><label>Amount Paid (₹)</label><input type="number" id="p_amount" placeholder="Final Amount" style="font-size:1.2rem; font-weight:bold; color:#c62828;" required></div>
            `;
        }
        else if (action === 'Byaaj Jama' || action === 'Girvi Chhudaya') {
            fieldsHTML = `
                <div class="form-group" style="position:relative;">
                    <label style="color:#d32f2f;">Customer (Only Active Loans)</label>
                    <input type="text" id="p_customer" placeholder="🔍 Select Customer..." autocomplete="off" onfocus="showCustomerDropdown()" oninput="filterCustomerInPopup()" style="border: 2px solid #d32f2f; font-weight:bold;">
                    <input type="hidden" id="p_customerId">
                    <div id="customerDropdownPopup" class="dropdown-list"></div>
                </div>
                
                <div class="form-group" id="loanSelectDiv" style="display:none;">
                    <label>Select Loan Account</label>
                    <select id="p_loanId" style="font-weight:bold; color:#1976d2; border:1px solid #1976d2; background:#e3f2fd;"></select>
                </div>

                ${action === 'Girvi Chhudaya' ? `
                <div class="form-group">
                    <label>Entry Type</label>
                    <select id="p_repayType" style="font-weight:bold; border-color:#2e7d32;">
                        <option value="Jama Pete">Jama Pete (Thoda Paisa Diya)</option>
                        <option value="Release">Chhudaya (Pura Settle)</option>
                    </select>
                </div>` : `<input type="hidden" id="p_repayType" value="Byaaj">`}

                <div class="form-group"><label>Amount Received (₹)</label><input type="number" id="p_amount" placeholder="₹ Amount" style="font-size:1.2rem; font-weight:bold; color:#2e7d32;" required></div>
            `;
        }
        else {
            fieldsHTML = `
                <div class="form-group"><label>Amount (₹)</label><input type="number" id="p_amount" style="font-size:1.2rem; font-weight:bold; color:${action==='Payment Diya'||action==='Expense'?'#D32F2F':'#2e7d32'};" required></div>
                <div class="form-group"><label>Remarks / Detail</label><input type="text" id="p_desc" placeholder="Kiske liye?"></div>
            `;
        }

        document.getElementById('formFields').innerHTML = fieldsHTML;
        document.getElementById('entryModal').style.display = 'flex'; // Changed to flex for proper centering
    }

    function closePopup() { document.getElementById('entryModal').style.display = 'none'; }

    // --- SMART SEARCH DROPDOWNS ---
    function showCustomerDropdown() {
        let list = allCustomers;
        if(isLoanAction) {
            let activeLoanCustIds = allLoans.filter(l => l.status === 'active').map(l => l.customerId);
            list = allCustomers.filter(c => activeLoanCustIds.includes(c.id));
        }
        renderCustomerDropdown(list);
    }

    function filterCustomerInPopup() {
        let txt = document.getElementById('p_customer').value.toLowerCase();
        let list = allCustomers;
        if(isLoanAction) {
            let activeLoanCustIds = allLoans.filter(l => l.status === 'active').map(l => l.customerId);
            list = allCustomers.filter(c => activeLoanCustIds.includes(c.id));
        }
        let filtered = list.filter(c => (c.name && c.name.toLowerCase().includes(txt)) || (c.mobile && String(c.mobile).includes(txt)));
        renderCustomerDropdown(filtered);
    }

    function renderCustomerDropdown(list) {
        const div = document.getElementById('customerDropdownPopup');
        div.innerHTML = ''; div.style.display = 'block';
        if(list.length === 0) { 
            div.innerHTML = `<div class="dropdown-item" style="color:red; text-align:center;">${isLoanAction ? 'Koi Active Loan nahi mila!' : 'Naya Customer Add Hoga'}</div>`; 
            return; 
        }
        list.slice(0, 5).forEach(c => {
            let item = document.createElement('div');
            item.className = 'dropdown-item';
            item.innerHTML = `<b>${c.name}</b> <small style="color:#888;">${c.mobile||''}</small>`;
            item.onmousedown = function(e) {
                e.preventDefault();
                document.getElementById('p_customer').value = c.name;
                document.getElementById('p_customerId').value = c.id;
                div.style.display = 'none';
                
                if(isLoanAction) {
                    let custLoans = allLoans.filter(l => l.status === 'active' && l.customerId == c.id);
                    let sel = document.getElementById('p_loanId');
                    sel.innerHTML = '';
                    custLoans.forEach(l => {
                        let prin = l.ledger ? l.ledger[l.ledger.length-1].closingPrincipal : l.amount;
                        sel.innerHTML += `<option value="${l.id}">${l.item || l.itemName || 'Item'} (Pending: ₹${prin})</option>`;
                    });
                    document.getElementById('loanSelectDiv').style.display = 'block';
                }
            };
            div.appendChild(item);
        });
    }

    function showItemDropdown() { renderItemDropdown(allInventory); }
    function filterItemInPopup() {
        let txt = document.getElementById('p_item').value.trim().toUpperCase();
        let exactMatch = allInventory.find(item => item.status === 'stock' && item.barcode && item.barcode.toUpperCase() === txt);
        if(exactMatch) { document.getElementById('itemDropdownPopup').style.display = 'none'; selectInventoryItem(exactMatch); return; }
        let filtered = allInventory.filter(item => item.status === 'stock' && ((item.barcode && item.barcode.toUpperCase().includes(txt)) || (item.category && item.category.toUpperCase().includes(txt))));
        renderItemDropdown(filtered);
    }
    function renderItemDropdown(list) {
        const div = document.getElementById('itemDropdownPopup');
        if(!div) return;
        div.innerHTML = ''; div.style.display = 'block';
        if(list.length === 0) return;
        list.slice(0, 5).forEach(item => {
            let divItem = document.createElement('div');
            divItem.className = 'dropdown-item';
            let wt = parseFloat(item.netWt || item.grossWeight || item.weight || 0).toFixed(3);
            divItem.innerHTML = `<b>${item.barcode}</b> - ${item.category} <small style="color:#C5A059;">[${wt}g]</small>`;
            divItem.onmousedown = function(e) { e.preventDefault(); selectInventoryItem(item); div.style.display = 'none'; };
            div.appendChild(divItem);
        });
    }

    function getPurityFactor(key) {
        if (!key) return 1.0; if (key === '24K' || key === 'Silver') return 1.0; if (key === '22K') return 0.9166; if (key === '18K') return 0.75;
        let customG = goldRates.customPurities?.find(cp => cp.name === key); if (customG) return customG.pct / 100; return 1.0;
    }
    function checkIsSilver(purity) {
        if(!purity) return false; const p = purity.toUpperCase();
        return p.includes('SIL') || p.includes('92.5') || p.includes('99.9');
    }

    function selectInventoryItem(item) {
        selectedItemObj = item;
        let wt = parseFloat(item.netWt || item.grossWeight || item.weight || 0);
        document.getElementById('p_item').value = `${item.barcode} | ${item.category}`;
        document.getElementById('p_weight').value = wt;

        let isSilv = checkIsSilver(item.purity);
        let r = isSilv ? (goldRates.rateSilver / 1000) : (goldRates.rate24k / 10);
        if(item.purity === '22K') r = goldRates.rate22k / 10;
        else if(item.purity === '18K') r = (goldRates.rate18k || (goldRates.rate22k * 0.82)) / 10;
        else r = r * getPurityFactor(item.purity);

        document.getElementById('p_rate').value = parseFloat(r.toFixed(2));
        calcSmartAmount();
    }

    function calcSmartAmount() {
        let wt = parseFloat(document.getElementById('p_weight').value) || 0;
        let rate = parseFloat(document.getElementById('p_rate').value) || 0;
        let making = document.getElementById('p_making') ? (parseFloat(document.getElementById('p_making').value) || 0) : 0;
        let gstPct = document.getElementById('p_gst') ? (parseFloat(document.getElementById('p_gst').value) || 0) : 0;
        
        let udhari = parseFloat(document.getElementById('p_udhari').value) || 0;
        let oldgold = parseFloat(document.getElementById('p_oldgold').value) || 0;

        let metalVal = wt * rate;
        let baseTotal = metalVal + making;
        let gstAmt = baseTotal * (gstPct / 100);
        let grossBill = Math.round(baseTotal + gstAmt); // Pura Bill = JAMA
        
        let deduction = udhari + oldgold; // NAMA
        let netCash = grossBill - deduction; // Asli me kitna cash mila

        if(document.getElementById('liveMetal')) {
            document.getElementById('liveMetal').innerText = "₹" + grossBill.toLocaleString();
            document.getElementById('liveTax').innerText = "₹" + deduction.toLocaleString();
        }
        if(document.getElementById('liveTotal')) document.getElementById('liveTotal').innerText = "₹" + netCash.toLocaleString();
    }

    function calcPurchaseAmount() {
        let wt = parseFloat(document.getElementById('p_weight').value) || 0;
        let rate = parseFloat(document.getElementById('p_rate').value) || 0;
        let finalTotal = Math.round(wt * rate);
        if(document.getElementById('liveTotal')) document.getElementById('liveTotal').innerText = "₹" + finalTotal.toLocaleString();
        if(document.getElementById('p_amount')) document.getElementById('p_amount').value = finalTotal;
    }

    document.addEventListener('click', function(event) {
        let pCust = document.getElementById('p_customer'); let cList = document.getElementById('customerDropdownPopup');
        if (pCust && cList && !pCust.contains(event.target) && !cList.contains(event.target)) cList.style.display = 'none';
        let pItem = document.getElementById('p_item'); let iList = document.getElementById('itemDropdownPopup');
        if (pItem && iList && !pItem.contains(event.target) && !iList.contains(event.target)) iList.style.display = 'none';
    });

    // --- MAIN SAVE ENGINE ---
    async function saveEntry() {
        let action = document.getElementById('actionType').value;
        let dateToday = new Date().toISOString();
        
        try {
            const db = await dbPromise;
            const tx = db.transaction(['sales', 'purchases', 'inventory', 'cashflow', 'loans', 'customers'], 'readwrite');

            if(action === 'Byaaj Jama' || action === 'Girvi Chhudaya') {
                let loanId = document.getElementById('p_loanId').value;
                let payAmt = parseFloat(document.getElementById('p_amount').value);
                let repayType = document.getElementById('p_repayType').value; 
                
                if(!loanId || !payAmt) return alert("Details bharo!");

                let loanReq = await new Promise(r => tx.objectStore('loans').get(parseInt(loanId)).onsuccess = e => r(e.target.result));
                if(!loanReq) return alert("Loan nahi mila!");

                let lastEntry = loanReq.ledger[loanReq.ledger.length - 1];

                if(repayType === 'Byaaj') {
                    lastEntry.paidInterest = (lastEntry.paidInterest || 0) + payAmt;
                } else if(repayType === 'Jama Pete') {
                    lastEntry.paidPrincipal = (lastEntry.paidPrincipal || 0) + payAmt;
                    lastEntry.closingPrincipal = lastEntry.openPrincipal - lastEntry.paidPrincipal;
                } else if(repayType === 'Release') {
                    lastEntry.paidPrincipal = (lastEntry.paidPrincipal || 0) + payAmt;
                    lastEntry.closingPrincipal = 0;
                    loanReq.status = 'closed';
                    loanReq.closeDate = dateToday;
                }

                if(!loanReq.payments) loanReq.payments = [];
                loanReq.payments.push({ date: dateToday, amount: payAmt, mode: 'Cash', type: repayType });
                tx.objectStore('loans').put(loanReq);
                tx.objectStore('cashflow').add({ date: dateToday, type: 'IN', mode: 'Cash', category: repayType==='Byaaj'?'Interest Payment':'Loan Repayment', amount: payAmt });
            }
            else if(action === 'Sale' || action === 'Purchase' || action === 'Girvi Diya') {
                let custName = document.getElementById('p_customer').value.trim();
                let cid = document.getElementById('p_customerId').value;
                let itemNameStr = document.getElementById('p_item').value;
                
                if(!custName) return alert("Customer Name zaroori hai!");
                if(!itemNameStr) return alert("Item details bharein!");
                
                if(!cid) cid = await new Promise(r => { let r1 = tx.objectStore('customers').add({name: custName, mobile:'', city:'', bcBalance:0}); r1.onsuccess = e => r(e.target.result); });

                let wt = parseFloat(document.getElementById('p_weight').value) || 0;

                if(action === 'Sale') {
                    let rate = parseFloat(document.getElementById('p_rate').value) || 0;
                    let mkAmt = document.getElementById('p_making') ? parseFloat(document.getElementById('p_making').value) || 0 : 0;
                    let gstPct = document.getElementById('p_gst') ? parseFloat(document.getElementById('p_gst').value) || 0 : 0;
                    let udhari = parseFloat(document.getElementById('p_udhari').value) || 0;
                    let oldgold = parseFloat(document.getElementById('p_oldgold').value) || 0;

                    let baseAmt = (wt * rate) + mkAmt;
                    let gstAmt = baseAmt * (gstPct / 100);
                    let grandTotal = Math.round(baseAmt + gstAmt);
                    let paid = grandTotal - udhari - oldgold; // Net Cash

                    let barcodeVal = selectedItemObj ? selectedItemObj.barcode : itemNameStr.split('|')[0].trim();

                    if(selectedItemObj) {
                        let storeItem = await new Promise(r => tx.objectStore('inventory').get(selectedItemObj.id).onsuccess = e => r(e.target.result));
                        if(storeItem) {
                            storeItem.status = 'sold'; storeItem.pieces = 0; storeItem.netWt = 0; storeItem.weight = 0;
                            tx.objectStore('inventory').put(storeItem);
                        }
                    }
                    let saleData = {
                        date: dateToday, customerId: parseInt(cid), subTotal: baseAmt, gst: gstAmt, grandTotal: grandTotal, oldGoldDeduction: oldgold, paidAmount: paid, pendingAmount: udhari, status: 'completed',
                        items: [{ id: selectedItemObj?selectedItemObj.id:'manual', isOldGold: false, barcode: barcodeVal, category: itemNameStr, weight: wt, rate: rate, total: grandTotal }]
                    };
                    tx.objectStore('sales').add(saleData);
                    if(paid > 0) tx.objectStore('cashflow').add({ date: dateToday, type: 'IN', mode: 'Cash', category: 'POS Sale', amount: paid });
                }
                else if (action === 'Purchase') {
                    let rate = parseFloat(document.getElementById('p_rate').value) || 0;
                    let amt = parseFloat(document.getElementById('p_amount').value) || 0;
                    let purData = {
                        date: dateToday, customerId: parseInt(cid), grandTotal: Math.round(wt*rate), paidAmount: amt, status: 'completed',
                        items: [{ id: 'manual', barcode: 'CUSTOM', category: itemNameStr, weight: wt, rate: rate, total: Math.round(wt*rate) }]
                    };
                    tx.objectStore('purchases').add(purData);
                    tx.objectStore('cashflow').add({ date: dateToday, type: 'OUT', mode: 'Cash', category: 'Purchase', amount: amt });
                }
                else if (action === 'Girvi Diya') {
                    let intRate = parseFloat(document.getElementById('p_intRate').value) || 2.0;
                    let amt = parseFloat(document.getElementById('p_amount').value) || 0;
                    let loanData = {
                        customerId: parseInt(cid), date: dateToday.split('T')[0], dueDate: dateToday.split('T')[0], status: 'active',
                        item: itemNameStr, metal: 'Gold', weight: wt, amount: amt, ratePercent: intRate, durationVal: 6,
                        ledger: [{ month: new Date().toLocaleDateString('en-IN', { month:'short', year:'numeric', timeZone:'Asia/Kolkata' }), openPrincipal: amt, interestCharged: Math.round(amt * (intRate/100)), paidInterest: 0, paidPrincipal: 0, closingPrincipal: amt, status: 'active' }]
                    };
                    tx.objectStore('loans').add(loanData);
                    tx.objectStore('cashflow').add({ date: dateToday, type: 'OUT', mode: 'Cash', category: 'New Gold Loan', amount: amt });
                }
            } 
            else {
                let amt = parseFloat(document.getElementById('p_amount').value);
                let desc = document.getElementById('p_desc').value || action;
                let type = (action === 'Payment Diya' || action === 'Expense') ? 'OUT' : 'IN';
                tx.objectStore('cashflow').add({ date: dateToday, type: type, mode: 'Cash', category: action, amount: amt, note: desc });
            }

            tx.oncomplete = () => {
                closePopup();
                loadCoreData().then(() => renderRojmel()); 
            };
            tx.onerror = (e) => { console.error(e); alert("❌ Error saving data."); };

        } catch(error) { console.error("Master Save Error:", error); alert("❌ DB Error!"); }
    }
</script>
