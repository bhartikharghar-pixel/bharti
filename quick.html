<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Rojmel - Bharti Jewellers</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #f4f6f9; margin: 0; padding: 10px; color: #333; }
        .master-container { padding: 15px; max-width: 1100px; margin: auto; background: #fff; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        
        .dashboard-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid #C5A059; padding-bottom: 15px; margin-bottom: 20px;}
        .dashboard-title { margin: 0; color: #111; font-size: 1.6rem; font-weight: 800; text-transform: uppercase; letter-spacing: 1px;}
        .refresh-btn { background: #111; color: #C5A059; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-size: 0.95rem; font-weight: 700; display: flex; align-items: center; gap: 8px; transition: 0.2s;}
        .refresh-btn:hover { background: #000; transform: scale(1.02); }
        
        /* --- ACTION GRID (BUTTONS + LOGS) --- */
        .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px;}
        @media(max-width: 768px) { .action-grid { grid-template-columns: 1fr; } }
        
        .column { border-radius: 12px; background: #fafafa; border: 1px solid #e0e0e0; display: flex; flex-direction: column; padding: 15px;}
        .col-left { border-top: 5px solid #4caf50; } 
        .col-right { border-top: 5px solid #f44336; } 
        
        .col-header { text-align: center; padding-bottom: 15px; font-size: 1.2rem; font-weight: 800; text-transform: uppercase; border-bottom: 1px dashed #ccc; margin-bottom: 15px;}
        .col-left .col-header { color: #2e7d32; }
        .col-right .col-header { color: #c62828; }

        .action-wrapper { margin-bottom: 15px; background: #fff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); overflow: hidden; border: 1px solid #ddd; }
        .action-btn { width: 100%; padding: 14px; border: none; font-size: 1.05rem; font-weight: 800; cursor: pointer; transition: 0.2s; display: flex; justify-content: center; align-items: center; gap: 8px; text-decoration: none; box-sizing: border-box;}
        .btn-in { background: #e8f5e9; color: #2e7d32; border-bottom: 2px solid #c8e6c9;}
        .btn-in:hover { background: #c8e6c9; color: #1b5e20; }
        .btn-out { background: #ffebee; color: #c62828; border-bottom: 2px solid #ffcdd2;}
        .btn-out:hover { background: #ffcdd2; color: #b71c1c; }

        /* --- MINI LOGS --- */
        .mini-log { background: #fdfdfd; padding: 0 12px; max-height: 200px; overflow-y: auto; border-top: 1px solid #eee; display: none;}
        .log-item { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px dashed #ccc; padding: 10px 0; font-size: 0.9rem; font-weight: 600; }
        .log-item:last-child { border-bottom: none; }
        .log-amt { font-weight: 800; min-width: 80px; font-size: 1rem;}
        .c-in { color: #2e7d32; }
        .c-out { color: #c62828; }
        .log-mid { flex: 1; text-align: center; color: #555; font-size: 0.85rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 5px; text-transform: uppercase;}
        .log-right { min-width: 65px; text-align: right; color: #888; font-size: 0.85rem; }
        .empty-log { text-align: center; color: #aaa; font-size: 0.85rem; padding: 12px; font-style: italic; }

        /* --- ASLI ROJMEL (LEDGER) BOOK --- */
        .rojmel-book { background: #fff; border-radius: 12px; box-shadow: 0 5px 20px rgba(0,0,0,0.08); overflow: hidden; border: 1px solid #ddd; }
        .rojmel-header { background: #111; color: #fff; padding: 15px; text-align: center; font-size: 1.2rem; font-weight: bold; text-transform: uppercase; letter-spacing: 2px;}
        
        .rojmel-split { display: flex; width: 100%; border-bottom: 2px solid #333; }
        @media(max-width: 768px) { .rojmel-split { flex-direction: column; } .jama-side { border-right: none !important; border-bottom: 2px solid #333; } }
        
        .jama-side, .nama-side { flex: 1; display: flex; flex-direction: column; border-right: 2px solid #333; }
        .nama-side { border-right: none; }
        
        .side-title { padding: 12px; text-align: center; font-weight: 800; font-size: 1.2rem; text-transform: uppercase; border-bottom: 1px dashed #ccc; }
        .title-jama { color: #2e7d32; background: #f1f8e9; }
        .title-nama { color: #c62828; background: #ffebee; }

        .rojmel-list { list-style: none; padding: 0; margin: 0; flex: 1; min-height: 300px;}
        .r-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 15px; border-bottom: 1px solid #eee; font-size: 0.95rem; }
        .r-item:hover { background: #fafafa; }
        
        .r-detail { flex: 1; padding-right: 10px; }
        .r-desc { font-weight: 700; color: #222; display: block; margin-bottom: 3px;}
        .r-sub { font-size: 0.8rem; color: #666; }
        .r-amt { font-weight: 800; font-size: 1.1rem; }
        .amt-jama { color: #2e7d32; }
        .amt-nama { color: #c62828; }

        .row-opening { background: #e3f2fd !important; }
        .row-closing { background: #fff8e1 !important; border-top: 2px dashed #C5A059; }

        .rojmel-footer { display: flex; width: 100%; background: #111; color: #C5A059; font-size: 1.3rem; font-weight: 800; text-transform: uppercase; }
        @media(max-width: 768px) { .rojmel-footer { flex-direction: column; } .foot-left { border-right: none !important; border-bottom: 1px solid #333; } }
        .foot-left, .foot-right { flex: 1; display: flex; justify-content: space-between; padding: 15px 20px; border-right: 2px solid #333; }
        .foot-right { border-right: none; }

        /* --- POPUP MODAL --- */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); justify-content: center; align-items: center;}
        .modal-content { background: #fff; padding: 25px; border-radius: 12px; width: 95%; max-width: 480px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); position: relative; max-height: 90vh; overflow-y: auto;}
        .close-btn { position: absolute; right: 15px; top: 15px; font-size: 24px; cursor: pointer; color: #888; background: none; border: none; }
        
        .form-group { margin-bottom: 15px; position: relative; }
        .form-row { display: flex; gap: 10px; margin-bottom: 15px; }
        .form-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 5px; color: #555; }
        .form-group input, .form-group select { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 1rem; background: #fafafa;}
        .form-group input:focus { border-color: #C5A059; background: #fff; outline: none; }
        
        .dropdown-list { display: none; position: absolute; width: 100%; max-height: 180px; overflow-y: auto; background: white; border: 1px solid #ccc; z-index: 2000; box-shadow: 0 5px 15px rgba(0,0,0,0.1); border-radius: 6px; margin-top: 2px; }
        .dropdown-item { padding: 12px; border-bottom: 1px solid #eee; cursor: pointer; font-size: 0.95rem; color: #333; }
        .dropdown-item:hover { background: #fdfbf7; color: #C5A059; font-weight: bold; }

        .amount-box { background: #fff8e1; padding: 15px; border-radius: 8px; border: 1px solid #ffe082; margin-top: 10px; margin-bottom: 15px; }
        .amount-row { display: flex; justify-content: space-between; font-size: 0.95rem; margin-bottom: 5px; color: #555; font-weight: 600;}
        .amount-total { font-size: 1.3rem; font-weight: 800; color: #D32F2F; border-top: 1px dashed #ccc; padding-top: 8px; margin-top: 5px; display: flex; justify-content: space-between;}
        
        .save-btn { width: 100%; padding: 16px; background: #C5A059; color: #000; font-size: 1.1rem; font-weight: 800; border: none; border-radius: 8px; cursor: pointer; text-transform: uppercase; margin-top: 10px;}
    </style>
</head>
<body>

<div class="master-container">
    
    <div class="dashboard-header">
        <h1 class="dashboard-title"><i class="fas fa-bolt"></i> Quick Rojmel</h1>
        <button class="refresh-btn" onclick="location.reload()"><i class="fas fa-sync-alt"></i> Refresh</button>
    </div>

    <div class="action-grid">
        <div class="column col-left">
            <div class="col-header">⬇️ IN (Jama / Aaya)</div>
            
            <div class="action-wrapper">
                <button class="action-btn btn-in" onclick="openPopup('Sale')"><i class="fas fa-shopping-bag"></i> Sale (Bikri)</button>
                <div id="log-SaleGross" class="mini-log"></div>
            </div>

            <div class="action-wrapper">
                <button class="action-btn btn-in" onclick="openPopup('Byaaj Jama')"><i class="fas fa-coins"></i> Byaaj Jama</button>
                <div id="log-Byaaj Jama" class="mini-log"></div>
            </div>

            <div class="action-wrapper">
                <button class="action-btn btn-in" onclick="openPopup('Girvi Chhudaya')"><i class="fas fa-unlock"></i> Girvi Chhudaya</button>
                <div id="log-Girvi Chhudaya" class="mini-log"></div>
            </div>

            <div class="action-wrapper">
                <button class="action-btn btn-in" onclick="openPopup('Payment In')"><i class="fas fa-wallet"></i> Payment Aaya</button>
                <div id="log-Payment In" class="mini-log"></div>
            </div>
        </div>

        <div class="column col-right">
            <div class="col-header">⬆️ OUT (Udhar / Gaya)</div>

            <div class="action-wrapper">
                <button class="action-btn btn-out" onclick="openPopup('Girvi Diya')"><i class="fas fa-hand-holding-usd"></i> Girvi Diya</button>
                <div id="log-LoanOut" class="mini-log"></div>
            </div>

            <div class="action-wrapper">
                <button class="action-btn btn-out" onclick="openPopup('Purchase')"><i class="fas fa-shopping-cart"></i> Khareedi</button>
                <div id="log-Purchase" class="mini-log"></div>
            </div>

            <div class="action-wrapper">
                <button class="action-btn btn-out" onclick="openPopup('Payment Diya')"><i class="fas fa-money-bill-wave"></i> Payment Diya</button>
                <div id="log-Payment Diya" class="mini-log"></div>
            </div>

            <div class="action-wrapper">
                <button class="action-btn btn-out" onclick="openPopup('Expense')"><i class="fas fa-file-invoice"></i> Kharcha</button>
                <div id="log-Expense" class="mini-log"></div>
            </div>
        </div>
    </div>

    <div class="rojmel-book">
        <div class="rojmel-header">Aaj Ka Hisaab (Rojmel) - <span id="todayDateStr"></span></div>
        
        <div class="rojmel-split">
            <div class="jama-side">
                <div class="side-title title-jama">JAMA (IN)</div>
                <ul class="rojmel-list" id="jamaList"></ul>
            </div>

            <div class="nama-side">
                <div class="side-title title-nama">NAMA (OUT)</div>
                <ul class="rojmel-list" id="namaList"></ul>
            </div>
        </div>

        <div class="rojmel-footer">
            <div class="foot-left">
                <span>Total Jama:</span>
                <span id="totalJamaAmt">₹0</span>
            </div>
            <div class="foot-right">
                <span>Total Nama:</span>
                <span id="totalNamaAmt">₹0</span>
            </div>
        </div>
    </div>

</div>

<div id="entryModal" class="modal">
    <div class="modal-content">
        <button class="close-btn" onclick="closePopup()">&times;</button>
        <h2 id="modalTitle" style="margin-top:0; color:#C5A059; border-bottom: 2px solid #eee; padding-bottom: 10px;">Entry Form</h2>
        
        <form id="dynamicForm">
            <input type="hidden" id="actionType">
            <div id="formFields"></div>
            <button type="button" class="save-btn" onclick="saveEntry()"><i class="fas fa-check-circle"></i> Save Data</button>
        </form>
    </div>
</div>

<script src="db.js"></script>

<script>
    let allCustomers = [];
    let allInventory = [];
    let allLoans = [];
    let goldRates = { rate22k: 0, rate24k: 0, rate18k: 0, rateSilver: 0 };
    let globalGstDefault = 3;
    let selectedItemObj = null;
    let isLoanAction = false; 

    window.onload = async function() {
        document.getElementById('todayDateStr').innerText = new Date().toLocaleDateString('en-IN', {day: 'numeric', month: 'short', year: 'numeric'});
        await loadCoreData();
        await generatePerfectRojmel();
    };

    async function loadCoreData() {
        try {
            allCustomers = await getAllItems('customers').catch(()=>[]);
            allInventory = await getAllItems('inventory').catch(()=>[]); 
            allLoans = await getAllItems('loans').catch(()=>[]);
            const r = await getSetting('gold_rates'); 
            if(r) goldRates = r;
            const defaults = await getSetting('billing_defaults');
            if(defaults && defaults.gst) globalGstDefault = defaults.gst;
        } catch (error) { console.error("Data load error:", error); }
    }

    function getCustName(id) {
        let c = allCustomers.find(x => String(x.id) === String(id));
        return c ? c.name : 'Walk-in';
    }

    function getMoneyType(modeStr) {
        if(!modeStr) return 'cash';
        let m = String(modeStr).toLowerCase();
        if (m.includes('upi') || m.includes('bank') || m.includes('card')) return 'bank';
        if (m.includes('metal') || m.includes('-')) return 'none';
        return 'cash'; 
    }

    // --- ⭐ NEW: SMART STRING FORMATTER FOR (* AND #) ---
    function getSplitStr(payments, defaultMode, paidAmt, displayAmt) {
        let cAmt = 0, bAmt = 0;
        if (paidAmt > 0) {
            if (payments && payments.length > 0) {
                payments.forEach(p => {
                    let m = String(p.mode).toLowerCase();
                    let a = parseFloat(p.amount) || 0;
                    if(m.includes('upi')||m.includes('bank')||m.includes('card')) bAmt += a;
                    else cAmt += a;
                });
            } else {
                let m = String(defaultMode).toLowerCase();
                if(m.includes('upi')||m.includes('bank')||m.includes('card')) bAmt = paidAmt;
                else cAmt = paidAmt;
            }
        }
        
        if (cAmt === 0 && bAmt === 0) return `₹${displayAmt.toLocaleString()}`; // Pure udhari
        
        if (cAmt === displayAmt && bAmt === 0) return `₹${displayAmt.toLocaleString()}*`;
        if (bAmt === displayAmt && cAmt === 0) return `₹${displayAmt.toLocaleString()}#`;
        
        let splitParts = [];
        if(cAmt > 0) splitParts.push(`${cAmt.toLocaleString()}*`);
        if(bAmt > 0) splitParts.push(`${bAmt.toLocaleString()}#`);
        
        return `₹${displayAmt.toLocaleString()} <span style="font-size:0.75rem; font-weight:600; color:inherit;">(${splitParts.join(' + ')})</span>`;
    }

    // ==========================================
    // 🔥 THE MASTER ROJMEL ENGINE (WITH LOGS & SPLIT)
    // ==========================================
    async function generatePerfectRojmel() {
        try {
            const todayDateObj = new Date();
            const today = new Date(todayDateObj.getTime() - (todayDateObj.getTimezoneOffset() * 60000)).toISOString().split('T')[0];
            
            let jamaArray = [];
            let namaArray = [];

            let logs = {
                SaleGross: [], 'Byaaj Jama': [], 'Girvi Chhudaya': [], 'Payment In': [],
                Purchase: [], LoanOut: [], 'Payment Diya': [], Expense: []
            };

            let openCash = 0, openBank = 0;
            let todayCashIn = 0, todayBankIn = 0;
            let todayCashOut = 0, todayBankOut = 0;

            let cFlows = await getAllItems('cashflow').catch(()=>[]);
            let sales = await getAllItems('sales').catch(()=>[]);
            let purchases = await getAllItems('purchases').catch(()=>[]);
            let loans = await getAllItems('loans').catch(()=>[]);
            let oldGold = await getAllItems('old_gold').catch(()=>[]);
            
            // 1. CASHFLOW CALCULATION (Opening & Closing with Split)
            cFlows.forEach(c => {
                let amt = Math.abs(parseFloat(c.amount)) || 0;
                let cDate = c.date ? c.date.split('T')[0] : '';
                let mType = getMoneyType(c.mode);
                if(mType === 'none') return; 

                let type = c.type || 'OUT';
                if(parseFloat(c.amount) < 0 && c.type === 'IN') type = 'OUT';

                if (cDate < today) {
                    if (type === 'IN') { if(mType==='bank') openBank+=amt; else openCash+=amt; }
                    else { if(mType==='bank') openBank-=amt; else openCash-=amt; }
                } else if (cDate === today) {
                    if (type === 'IN') { if(mType==='bank') todayBankIn+=amt; else todayCashIn+=amt; }
                    else { if(mType==='bank') todayBankOut+=amt; else todayCashOut+=amt; }
                }
            });

            let openingTotal = openCash + openBank;
            let closingCash = openCash + todayCashIn - todayCashOut;
            let closingBank = openBank + todayBankIn - todayBankOut;
            let closingTotal = closingCash + closingBank;

            // Add Opening Balance to JAMA (With Split Subtitle)
            jamaArray.push({
                title: 'Opening Balance', 
                sub: `Cash: <strong style="color:#2e7d32;">₹${openCash.toLocaleString()}*</strong> &nbsp;|&nbsp; Bank: <strong style="color:#1976d2;">₹${openBank.toLocaleString()}#</strong>`, 
                amt: openingTotal, 
                isSpecial: 'row-opening'
            });

            // 2. SALES LOGIC
            sales.filter(s => s.status !== 'cancelled').forEach(s => {
                let cName = getCustName(s.customerId);
                let isCreatedToday = s.date && s.date.startsWith(today);
                
                if (isCreatedToday) {
                    let gross = (parseFloat(s.subTotal)||0) + (parseFloat(s.gst)||0);
                    let udhari = parseFloat(s.pendingAmount)||0;
                    let oldGoldVal = parseFloat(s.oldGoldDeduction)||0;
                    let itemsStr = s.items && s.items.length > 0 ? s.items.map(i => `${i.barcode||i.category}`).join(', ') : 'Items';

                    if(gross > 0) {
                        jamaArray.push({ title: `Sale: ${cName}`, sub: itemsStr, amt: gross });
                        let fAmtStr = getSplitStr(s.payments, s.mode, s.paidAmount, gross);
                        logs.SaleGross.push({ amtStr: fAmtStr, mid: cName, right: itemsStr, isIN: true });
                    }
                    if(udhari > 0) namaArray.push({ title: `Udhari (Credit): ${cName}`, sub: 'Bill me udhar bacha', amt: udhari });
                    if(oldGoldVal > 0) namaArray.push({ title: `Old Gold Exch: ${cName}`, sub: 'Bill me jama kiya', amt: oldGoldVal });
                }
            });

            // 3. PURCHASES LOGIC
            purchases.filter(p => p.date && p.date.startsWith(today)).forEach(p => {
                let mName = getMerchName(p.merchantId);
                let gross = p.grandTotal || 0;
                let due = p.pendingAmount || p.dueAmount || 0;
                let itemsStr = p.items && p.items.length > 0 ? p.items.map(i => `${i.category}`).join(', ') : 'Stock';
                
                if(gross > 0) {
                    namaArray.push({ title: `Purchase (Stock)`, sub: itemsStr, amt: gross });
                    let fAmtStr = getSplitStr(p.payments, p.paymentMode||p.mode, p.paidAmount, gross);
                    logs.Purchase.push({ amtStr: fAmtStr, mid: mName, right: itemsStr, isIN: false });
                }
                if(due > 0) jamaArray.push({ title: `Merchant Credit`, sub: 'Paisa dena baaki hai', amt: due });
            });

            // 4. LOANS LOGIC
            loans.forEach(l => {
                let cName = getCustName(l.customerId);
                let itemStr = l.itemName || l.item || l.description || 'Item';
                
                if (l.date && l.date.startsWith(today) && l.status === 'active') {
                    let amt = l.amount || l.loanAmount || l.principalAmount || 0;
                    namaArray.push({ title: `Girvi Diya: ${cName}`, sub: `${itemStr}`, amt: amt });
                    let fAmtStr = getSplitStr(null, l.paymentMode||l.mode, amt, amt);
                    logs.LoanOut.push({ amtStr: fAmtStr, mid: `${cName}`, right: itemStr, isIN: false });
                }

                if (l.payments && l.payments.length > 0) {
                    l.payments.filter(p => p.date && p.date.startsWith(today)).forEach(p => {
                        let t = p.type === 'Release' ? '(Chhudaya)' : p.type;
                        jamaArray.push({ title: `Girvi ${t}: ${cName}`, sub: `For ${itemStr}`, amt: p.amount });
                        
                        let fAmtStr = getSplitStr([p], p.mode, p.amount, p.amount);
                        if(p.type === 'Byaaj') logs['Byaaj Jama'].push({ amtStr: fAmtStr, mid: cName, right: 'Byaaj', isIN: true });
                        else logs['Girvi Chhudaya'].push({ amtStr: fAmtStr, mid: cName, right: t, isIN: true });
                    });
                }
            });

            // 5. DIRECT OLD GOLD BUY
            oldGold.filter(o => o.date && o.date.startsWith(today) && o.mode !== 'POS Exchange' && o.type !== 'MELT').forEach(o => {
                let amt = parseFloat(o.amount || o.paidAmount || o.cash || 0);
                if(amt > 0) namaArray.push({ title: `Old Gold Buy: ${getCustName(o.customerId)}`, sub: `${parseFloat(o.netWt||o.oldGoldWeight||0).toFixed(3)}g`, amt: amt });
            });

            // 6. CASHFLOW (EXPENSES & OTHERS)
            cFlows.filter(c => c.date && c.date.startsWith(today)).forEach(c => {
                let amt = Math.abs(parseFloat(c.amount)) || 0;
                let cat = String(c.category || '').toLowerCase();
                let note = String(c.note || '').toLowerCase();
                
                if(cat.includes('sale') || cat.includes('loan') || cat.includes('purchase') || note.includes('pos')) return;

                let fAmtStr = getSplitStr(null, c.mode, amt, amt);

                if (c.type === 'IN') {
                    jamaArray.push({ title: c.category || 'Payment In', sub: c.note || c.mode, amt: amt });
                    logs['Payment In'].push({ amtStr: fAmtStr, mid: c.note || c.category || 'Receipt', right: '', isIN: true });
                } else {
                    namaArray.push({ title: c.category || 'Payment Out', sub: c.note || c.mode, amt: amt });
                    if(cat.includes('expense') || cat.includes('salary')) {
                        logs['Expense'].push({ amtStr: fAmtStr, mid: c.note || c.category, right: 'Kharcha', isIN: false });
                    } else {
                        logs['Payment Diya'].push({ amtStr: fAmtStr, mid: c.note || c.category, right: 'Paid', isIN: false });
                    }
                }
            });

            // --- CALCULATE TOTALS ---
            let totalJamaSum = jamaArray.reduce((sum, item) => sum + item.amt, 0);
            let totalNamaSum = namaArray.reduce((sum, item) => sum + item.amt, 0);
            
            namaArray.push({
                title: 'Closing Balance',
                sub: `Cash: <strong style="color:#2e7d32;">₹${closingCash.toLocaleString()}*</strong> &nbsp;|&nbsp; Bank: <strong style="color:#1976d2;">₹${closingBank.toLocaleString()}#</strong>`,
                amt: closingTotal,
                isSpecial: 'row-closing'
            });

            let finalNamaSum = totalNamaSum + closingTotal;

            // --- RENDER UI ---
            const createRow = (data, isJama) => {
                let amtColor = isJama ? 'amt-jama' : 'amt-nama';
                let specialCls = data.isSpecial ? data.isSpecial : '';
                return `
                <li class="r-item ${specialCls}">
                    <div class="r-detail">
                        <span class="r-desc">${data.title}</span>
                        <span class="r-sub">${data.sub}</span>
                    </div>
                    <div class="r-amt ${amtColor}">₹${data.amt.toLocaleString()}</div>
                </li>`;
            };

            document.getElementById('jamaList').innerHTML = jamaArray.map(d => createRow(d, true)).join('');
            document.getElementById('namaList').innerHTML = namaArray.map(d => createRow(d, false)).join('');

            document.getElementById('totalJamaAmt').innerText = `₹${totalJamaSum.toLocaleString()}`;
            document.getElementById('totalNamaAmt').innerText = `₹${finalNamaSum.toLocaleString()}`;

            // Render Mini Logs
            for(let key in logs) {
                let logElement = document.getElementById('log-' + key);
                if(logElement) {
                    if(logs[key].length > 0) {
                        logElement.innerHTML = logs[key].map(item => {
                            let c = item.isIN ? 'c-in' : 'c-out';
                            return `<div class="log-item"><div class="log-format-str"><span class="p1 ${c}">${item.amtStr}</span> <span class="p2">| ${item.mid} |</span> <span class="p3">${item.right}</span></div></div>`;
                        }).join('');
                        logElement.style.display = 'block';
                    } else {
                        logElement.innerHTML = '<div class="empty-log">Aaj koi entry nahi</div>';
                        logElement.style.display = 'block';
                    }
                }
            }

        } catch(e) { console.error("Rojmel Error:", e); }
    }

    function showCustomerDropdown() {
        let list = allCustomers;

            list = allCustomers.filter(c => activeLoanCustIds.includes(c.id));
        }

    }

    function filterCustomerInPopup() {
        let txt = document.getElementById('p_customer').value.toLowerCase();
        let list = allCustomers;
        if(isLoanAction) {
            let activeLoanCustIds = allLoans.filter(l => l.status === 'active').map(l => l.customerId);
            list = allCustomers.filter(c => activeLoanCustIds.includes(c.id));
        }
        let filtered = list.filter(c => (c.name && c.name.toLowerCase().includes(txt)) || (c.mobile && String(c.mobile).includes(txt)));
        renderCustomerDropdown(filtered);
    }

    function renderCustomerDropdown(list) {
        const div = document.getElementById('customerDropdownPopup');
        div.innerHTML = ''; div.style.display = 'block';

            div.innerHTML = `<div class="dropdown-item" style="color:red; text-align:center;">${isLoanAction ? 'Koi Active Loan nahi mila!' : 'Naya Customer Add Hoga'}</div>`;

    function showItemDropdown() { renderItemDropdown(allInventory); }

        let txt = document.getElementById('p_item').value.trim().toUpperCase();

    function renderItemDropdown(list) {

        if(!div) return;

        if(list.length === 0) return;
        list.slice(0, 5).forEach(item => {

            divItem.className = 'dropdown-item';

            divItem.innerHTML = `<b>${item.barcode}</b> - ${item.category} <small style="color:#C5A059;">[${wt}g]</small>`;

        });

    function getPurityFactor(key) {
        if (!key) return 1.0; if (key === '24K' || key === 'Silver') return 1.0; if (key === '22K') return 0.9166; if (key === '18K') return 0.75;
        let customG = goldRates.customPurities?.find(cp => cp.name === key); if (customG) return customG.pct / 100; return 1.0;
    }
    function checkIsSilver(purity) {
        if(!purity) return false; const p = purity.toUpperCase();
        return p.includes('SIL') || p.includes('92.5') || p.includes('99.9');
    }

    function selectInventoryItem(item) {
        selectedItemObj = item;
        let wt = parseFloat(item.netWt || item.grossWeight || item.weight || 0);
        document.getElementById('p_item').value = `${item.barcode} | ${item.category}`;
        document.getElementById('p_weight').value = wt;

        let isSilv = checkIsSilver(item.purity);
        let r = isSilv ? (goldRates.rateSilver / 1000) : (goldRates.rate24k / 10);
        if(item.purity === '22K') r = goldRates.rate22k / 10;
        else if(item.purity === '18K') r = (goldRates.rate18k || (goldRates.rate22k * 0.82)) / 10;
        else r = r * getPurityFactor(item.purity);

        document.getElementById('p_rate').value = parseFloat(r.toFixed(2));
        calcSmartAmount();
    }

    function calcSmartAmount() {
        let wt = parseFloat(document.getElementById('p_weight').value) || 0;
        let rate = parseFloat(document.getElementById('p_rate').value) || 0;
        let making = document.getElementById('p_making') ? (parseFloat(document.getElementById('p_making').value) || 0) : 0;
        let gstPct = document.getElementById('p_gst') ? (parseFloat(document.getElementById('p_gst').value) || 0) : 0;
        
        let udhari = parseFloat(document.getElementById('p_udhari').value) || 0;
        let oldgold = parseFloat(document.getElementById('p_oldgold').value) || 0;

        let metalVal = wt * rate;
        let baseTotal = metalVal + making;
        let gstAmt = baseTotal * (gstPct / 100);
        let grossBill = Math.round(baseTotal + gstAmt); 
        
        let deduction = udhari + oldgold; 
        let netCash = grossBill - deduction; 

        if(document.getElementById('liveMetal')) {
            document.getElementById('liveMetal').innerText = "₹" + grossBill.toLocaleString();
            document.getElementById('liveTax').innerText = "₹" + deduction.toLocaleString();
        }
        if(document.getElementById('liveTotal')) {
            document.getElementById('liveTotal').innerText = "₹" + netCash.toLocaleString();
        }
        
        if(document.getElementById('p_paidCash')) {
            document.getElementById('p_paidCash').value = netCash;
            document.getElementById('p_paidBank').value = 0;
        }
    }

    function calcPurchaseAmount() {
        let wt = parseFloat(document.getElementById('p_weight').value) || 0;
        let rate = parseFloat(document.getElementById('p_rate').value) || 0;
        let finalTotal = Math.round(wt * rate);
        if(document.getElementById('liveTotal')) document.getElementById('liveTotal').innerText = "₹" + finalTotal.toLocaleString();
        if(document.getElementById('p_paidCash')) {
            document.getElementById('p_paidCash').value = finalTotal;
            document.getElementById('p_paidBank').value = 0;
        }
    }

    document.addEventListener('click', function(event) {
        let pCust = document.getElementById('p_customer'); let cList = document.getElementById('customerDropdownPopup');
        if (pCust && cList && !pCust.contains(event.target) && !cList.contains(event.target)) cList.style.display = 'none';
        let pItem = document.getElementById('p_item'); let iList = document.getElementById('itemDropdownPopup');
        if (pItem && iList && !pItem.contains(event.target) && !iList.contains(event.target)) iList.style.display = 'none';
    });

    // --- 💾 MASTER SAVE ENGINE ---
    async function saveEntry() {
        let action = document.getElementById('actionType').value;
        let dateToday = new Date().toISOString();
        
        try {
            const db = await dbPromise;
            const tx = db.transaction(['sales', 'purchases', 'inventory', 'cashflow', 'loans', 'customers'], 'readwrite');

            let cPaid = parseFloat(document.getElementById('p_paidCash').value) || 0;
            let bPaid = parseFloat(document.getElementById('p_paidBank').value) || 0;
            let totalPaid = cPaid + bPaid;

            if(action === 'Byaaj Jama' || action === 'Girvi Chhudaya') {
                let loanId = document.getElementById('p_loanId').value;
                let repayType = document.getElementById('p_repayType').value; 
                
                if(!loanId || totalPaid <= 0) return alert("Amount and Loan ID are required!");

                let loanReq = await new Promise(r => tx.objectStore('loans').get(parseInt(loanId)).onsuccess = e => r(e.target.result));
                if(!loanReq) return alert("Loan nahi mila!");

                let lastEntry = loanReq.ledger[loanReq.ledger.length - 1];

                if(repayType === 'Byaaj') {
                    lastEntry.paidInterest = (lastEntry.paidInterest || 0) + totalPaid;
                } else if(repayType === 'Jama Pete') {
                    lastEntry.paidPrincipal = (lastEntry.paidPrincipal || 0) + totalPaid;
                    lastEntry.closingPrincipal = lastEntry.openPrincipal - lastEntry.paidPrincipal;
                } else if(repayType === 'Release') {
                    lastEntry.paidPrincipal = (lastEntry.paidPrincipal || 0) + totalPaid;
                    lastEntry.closingPrincipal = 0;
                    loanReq.status = 'closed';
                    loanReq.closeDate = dateToday;
                }

                if(!loanReq.payments) loanReq.payments = [];
                if(cPaid > 0) loanReq.payments.push({ date: dateToday, amount: cPaid, mode: 'Cash', type: repayType });
                if(bPaid > 0) loanReq.payments.push({ date: dateToday, amount: bPaid, mode: 'UPI', type: repayType });
                
                tx.objectStore('loans').put(loanReq);
                
                let catName = repayType === 'Byaaj' ? 'Interest Payment' : 'Loan Repayment';
                if(cPaid > 0) tx.objectStore('cashflow').add({ date: dateToday, type: 'IN', mode: 'Cash', category: catName, amount: cPaid });
                if(bPaid > 0) tx.objectStore('cashflow').add({ date: dateToday, type: 'IN', mode: 'UPI', category: catName, amount: bPaid });
            }
            else if(action === 'Sale' || action === 'Purchase' || action === 'Girvi Diya') {
                let custName = document.getElementById('p_customer').value.trim();
                let cid = document.getElementById('p_customerId').value;
                let itemNameStr = document.getElementById('p_item').value;
                
                if(!custName) return alert("Customer Name zaroori hai!");
                if(!itemNameStr) return alert("Item details bharein!");
                
                if(!cid) cid = await new Promise(r => { let r1 = tx.objectStore('customers').add({name: custName, mobile:'', city:'', bcBalance:0}); r1.onsuccess = e => r(e.target.result); });

                let wt = parseFloat(document.getElementById('p_weight').value) || 0;

                if(action === 'Sale') {
                    let rate = parseFloat(document.getElementById('p_rate').value) || 0;
                    let mkAmt = document.getElementById('p_making') ? parseFloat(document.getElementById('p_making').value) || 0 : 0;
                    let gstPct = document.getElementById('p_gst') ? parseFloat(document.getElementById('p_gst').value) || 0 : 0;
                    let udhari = parseFloat(document.getElementById('p_udhari').value) || 0;
                    let oldgold = parseFloat(document.getElementById('p_oldgold').value) || 0;

                    let baseAmt = (wt * rate) + mkAmt;
                    let gstAmt = baseAmt * (gstPct / 100);
                    let grandTotal = Math.round(baseAmt + gstAmt);

                    let barcodeVal = selectedItemObj ? selectedItemObj.barcode : itemNameStr.split('|')[0].trim();

                    if(selectedItemObj) {
                        let storeItem = await new Promise(r => tx.objectStore('inventory').get(selectedItemObj.id).onsuccess = e => r(e.target.result));
                        if(storeItem) {
                            storeItem.status = 'sold'; storeItem.pieces = 0; storeItem.netWt = 0; storeItem.weight = 0;
                            tx.objectStore('inventory').put(storeItem);
                        }
                    }
                    
                    let paymentsArr = [];
                    if(cPaid > 0) paymentsArr.push({ mode: 'Cash', amount: cPaid, date: dateToday });
                    if(bPaid > 0) paymentsArr.push({ mode: 'UPI', amount: bPaid, date: dateToday });

                    let saleData = {
                        date: dateToday, customerId: parseInt(cid), subTotal: baseAmt, gst: gstAmt, grandTotal: grandTotal, oldGoldDeduction: oldgold, paidAmount: totalPaid, pendingAmount: udhari, status: 'completed',
                        items: [{ id: selectedItemObj?selectedItemObj.id:'manual', isOldGold: false, barcode: barcodeVal, category: itemNameStr, weight: wt, rate: rate, total: grandTotal }],
                        payments: paymentsArr
                    };
                    tx.objectStore('sales').add(saleData);
                    
                    if(cPaid > 0) tx.objectStore('cashflow').add({ date: dateToday, type: 'IN', mode: 'Cash', category: 'POS Sale', amount: cPaid });
                    if(bPaid > 0) tx.objectStore('cashflow').add({ date: dateToday, type: 'IN', mode: 'UPI', category: 'POS Sale', amount: bPaid });
                }
                else if (action === 'Purchase') {
                    let rate = parseFloat(document.getElementById('p_rate').value) || 0;
                    let grandTotal = Math.round(wt * rate);
                    
                    let paymentsArr = [];
                    if(cPaid > 0) paymentsArr.push({ mode: 'Cash', amount: cPaid, date: dateToday });
                    if(bPaid > 0) paymentsArr.push({ mode: 'UPI', amount: bPaid, date: dateToday });

                    let purData = {
                        date: dateToday, customerId: parseInt(cid), grandTotal: grandTotal, paidAmount: totalPaid, status: 'completed',
                        items: [{ id: 'manual', barcode: 'CUSTOM', category: itemNameStr, weight: wt, rate: rate, total: grandTotal }],
                        payments: paymentsArr
                    };
                    tx.objectStore('purchases').add(purData);
                    
                    if(cPaid > 0) tx.objectStore('cashflow').add({ date: dateToday, type: 'OUT', mode: 'Cash', category: 'Purchase', amount: cPaid });
                    if(bPaid > 0) tx.objectStore('cashflow').add({ date: dateToday, type: 'OUT', mode: 'UPI', category: 'Purchase', amount: bPaid });
                }
                else if (action === 'Girvi Diya') {
                    let intRate = parseFloat(document.getElementById('p_intRate').value) || 2.0;
                    let loanData = {
                        customerId: parseInt(cid), date: dateToday.split('T')[0], dueDate: dateToday.split('T')[0], status: 'active',
                        itemName: itemNameStr, metal: 'Gold', weight: wt, amount: totalPaid, ratePercent: intRate, durationVal: 6,
                        ledger: [{ month: new Date().toLocaleDateString('en-IN', { month:'short', year:'numeric', timeZone:'Asia/Kolkata' }), openPrincipal: totalPaid, interestCharged: Math.round(totalPaid * (intRate/100)), paidInterest: 0, paidPrincipal: 0, closingPrincipal: totalPaid, status: 'active' }]
                    };
                    tx.objectStore('loans').add(loanData);
                    
                    if(cPaid > 0) tx.objectStore('cashflow').add({ date: dateToday, type: 'OUT', mode: 'Cash', category: 'New Gold Loan', amount: cPaid });
                    if(bPaid > 0) tx.objectStore('cashflow').add({ date: dateToday, type: 'OUT', mode: 'UPI', category: 'New Gold Loan', amount: bPaid });
                }
            } 
            else {
                let desc = document.getElementById('p_desc').value || action;
                let type = (action === 'Payment Diya' || action === 'Expense') ? 'OUT' : 'IN';
                
                if(cPaid > 0) tx.objectStore('cashflow').add({ date: dateToday, type: type, mode: 'Cash', category: action, amount: cPaid, note: desc });
                if(bPaid > 0) tx.objectStore('cashflow').add({ date: dateToday, type: type, mode: 'UPI', category: action, amount: bPaid, note: desc });
            }

            tx.oncomplete = () => {
                closePopup();
                generatePerfectRojmel(); 
            };
            tx.onerror = (e) => { console.error(e); alert("❌ Error saving data."); };

        } catch(error) { console.error("Master Save Error:", error); alert("❌ DB Error!"); }
    }
</script>
