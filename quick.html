<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Rojmel - Bharti Jewellers</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #f4f6f9; margin: 0; padding: 10px; color: #333; }
        .master-container { padding: 15px; max-width: 1050px; margin: auto; background: #fff; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        
        .dashboard-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid #C5A059; padding-bottom: 15px; margin-bottom: 20px;}
        .dashboard-title { margin: 0; color: #111; font-size: 1.6rem; font-weight: 800; text-transform: uppercase; letter-spacing: 1px;}
        .refresh-btn { background: #111; color: #C5A059; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-size: 0.95rem; font-weight: 700; display: flex; align-items: center; gap: 8px; transition: 0.2s;}
        .refresh-btn:hover { background: #000; transform: scale(1.02); }
        
        /* --- ROJMEL GRID --- */
        .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        @media(max-width: 768px) { .action-grid { grid-template-columns: 1fr; } }
        
        .column { border-radius: 12px; background: #fafafa; border: 1px solid #e0e0e0; display: flex; flex-direction: column;}
        .col-left { border-top: 5px solid #4caf50; } 
        .col-right { border-top: 5px solid #f44336; } 
        
        .col-header { text-align: center; padding: 15px; font-size: 1.3rem; font-weight: 800; text-transform: uppercase; border-bottom: 1px dashed #ccc; margin-bottom: 15px;}
        .col-left .col-header { color: #2e7d32; background: #e8f5e9; border-radius: 12px 12px 0 0;}
        .col-right .col-header { color: #c62828; background: #ffebee; border-radius: 12px 12px 0 0;}
        
        .col-body { padding: 0 15px; flex: 1; }

        /* Static Balance Rows */
        .bal-row { background: #e3f2fd; border: 2px dashed #1976d2; padding: 15px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; font-size: 1.1rem; font-weight: 800; color: #0d47a1;}
        .closing-row { background: #fff8e1; border-color: #C5A059; color: #b08d4a; margin-top: 15px; }

        /* Action Wrappers (Button + Log Box) */
        .action-wrapper { margin-bottom: 15px; background: #fff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); overflow: hidden; border: 1px solid #ddd; }
        .action-btn { width: 100%; padding: 14px; border: none; font-size: 1.05rem; font-weight: 800; cursor: pointer; transition: 0.2s; display: flex; justify-content: center; align-items: center; gap: 8px; text-decoration: none; box-sizing: border-box;}
        .btn-in { background: #e8f5e9; color: #2e7d32; border-bottom: 2px solid #c8e6c9;}
        .btn-in:hover { background: #c8e6c9; color: #1b5e20; }
        .btn-out { background: #ffebee; color: #c62828; border-bottom: 2px solid #ffcdd2;}
        .btn-out:hover { background: #ffcdd2; color: #b71c1c; }

        /* --- MINI LOGS --- */
        .mini-log { background: #fdfdfd; padding: 0 12px; max-height: 200px; overflow-y: auto; border-top: 1px solid #eee; }
        .log-item { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px dashed #ccc; padding: 10px 0; font-size: 0.9rem; font-weight: 600; }
        .log-item:last-child { border-bottom: none; }
        
        .log-amt { font-weight: 800; min-width: 80px; font-size: 1rem;}
        .c-in { color: #2e7d32; }
        .c-out { color: #c62828; }
        
        .log-mid { flex: 1; text-align: center; color: #555; font-size: 0.85rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 5px; text-transform: uppercase;}
        .log-right { min-width: 65px; text-align: right; color: #888; font-size: 0.85rem; }
        
        .empty-log { text-align: center; color: #aaa; font-size: 0.85rem; padding: 12px; font-style: italic; }

        /* Totals Footer */
        .total-footer { background: #111; color: #C5A059; padding: 15px; border-radius: 0 0 12px 12px; display: flex; justify-content: space-between; align-items: center; font-size: 1.3rem; font-weight: 800; text-transform: uppercase; margin-top: 15px;}
    </style>
</head>
<body>

<div class="master-container">
    <div class="dashboard-header">
        <h2 class="dashboard-title"><i class="fas fa-book-open"></i> Asli Rojmel Book</h2>
        <button class="refresh-btn" onclick="location.reload()"><i class="fas fa-sync-alt"></i> Sync Data</button>
    </div>

    <div class="action-grid">
        
        <div class="column col-left">
            <div class="col-header">⬇️ JAMA (IN)</div>
            <div class="col-body">
                
                <div class="bal-row">
                    <span>Opening Cash</span>
                    <span id="openBal">₹0</span>
                </div>

                <div class="action-wrapper">
                    <a href="sales.html" class="action-btn btn-in"><i class="fas fa-cash-register"></i> Gross Sales (Bikri)</a>
                    <div id="log-SaleGross" class="mini-log"></div>
                </div>

                <div class="action-wrapper">
                    <a href="sales.html#hist" class="action-btn btn-in"><i class="fas fa-hand-holding-usd"></i> Due/Udhari Received</a>
                    <div id="log-SaleDueRecv" class="mini-log"></div>
                </div>

                <div class="action-wrapper">
                    <a href="loans.html" class="action-btn btn-in"><i class="fas fa-coins"></i> Loan Receipts (Byaaj/Jama)</a>
                    <div id="log-LoanIn" class="mini-log"></div>
                </div>

                <div class="action-wrapper">
                    <a href="cashflow.html" class="action-btn btn-in"><i class="fas fa-wallet"></i> Other Income & Advances</a>
                    <div id="log-OtherIn" class="mini-log"></div>
                </div>

            </div>
            <div class="total-footer">
                <span>Total Jama:</span>
                <span id="totalJamaUI">₹0</span>
            </div>
        </div>

        <div class="column col-right">
            <div class="col-header">⬆️ NAMA (OUT)</div>
            <div class="col-body">
                
                <div class="action-wrapper">
                    <a href="purchases.html" class="action-btn btn-out"><i class="fas fa-cart-arrow-down"></i> Stock Purchases</a>
                    <div id="log-Purchase" class="mini-log"></div>
                </div>

                <div class="action-wrapper">
                    <a href="sales.html" class="action-btn btn-out"><i class="fas fa-book"></i> Customer Udhari Given</a>
                    <div id="log-SaleDueGiven" class="mini-log"></div>
                </div>

                <div class="action-wrapper">
                    <a href="oldgold.html" class="action-btn btn-out"><i class="fas fa-ring"></i> Old Gold (Bill Exch + Buy)</a>
                    <div id="log-OldGold" class="mini-log"></div>
                </div>

                <div class="action-wrapper">
                    <a href="loans.html" class="action-btn btn-out"><i class="fas fa-hand-holding-usd"></i> New Gold Loans</a>
                    <div id="log-LoanOut" class="mini-log"></div>
                </div>

                <div class="action-wrapper">
                    <a href="cashflow.html" class="action-btn btn-out"><i class="fas fa-file-invoice-dollar"></i> Expenses & Payments</a>
                    <div id="log-Expense" class="mini-log"></div>
                </div>

                <div class="bal-row closing-row">
                    <span>Closing Cash</span>
                    <span id="closeBal">₹0</span>
                </div>

            </div>
            <div class="total-footer" style="color: #ef9a9a;">
                <span>Total Nama:</span>
                <span id="totalNamaUI">₹0</span>
            </div>
        </div>

    </div>
</div>

<script src="db.js"></script>

<script>
    let allCustomers = [];
    let allMerchants = [];

    // --- Safe Fetcher to prevent computer crashes ---
    async function safeGetAll(storeName) {
        try {
            const db = await dbPromise;
            if (!db.objectStoreNames.contains(storeName)) return [];
            const tx = db.transaction(storeName, 'readonly');
            return await new Promise((resolve) => {
                const req = tx.objectStore(storeName).getAll();
                req.onsuccess = e => resolve(e.target.result || []);
                req.onerror = () => resolve([]);
            });
        } catch(e) { return []; }
    }

    window.onload = async function() {
        allCustomers = await safeGetAll('customers');
        allMerchants = await safeGetAll('merchants');
        await generatePerfectRojmel();
    };

    function getCustName(id) {
        let c = allCustomers.find(x => String(x.id) === String(id));
        return c ? c.name : 'Walk-in';
    }
    function getMerchName(id) {
        let m = allMerchants.find(x => String(x.id) === String(id));
        return m ? m.name : 'Merchant';
    }

    // --- 📊 THE MASTER ROJMEL ENGINE (100% DAYBOOK MATH) ---
    async function generatePerfectRojmel() {
        try {
            const todayDateObj = new Date();
            const today = new Date(todayDateObj.getTime() - (todayDateObj.getTimezoneOffset() * 60000)).toISOString().split('T')[0];
            
            // Logs containers
            let logs = {
                SaleGross: [], SaleDueRecv: [], LoanIn: [], OtherIn: [],
                Purchase: [], SaleDueGiven: [], OldGold: [], LoanOut: [], Expense: []
            };

            // Totals
            let openingCash = 0;
            let todayCashIn = 0;
            let todayCashOut = 0;

            let cFlows = await safeGetAll('cashflow');
            let sales = await safeGetAll('sales');
            let purchases = await safeGetAll('purchases');
            let loans = await safeGetAll('loans');
            let oldGold = await safeGetAll('old_gold');
            let orders = await safeGetAll('orders');
            let mPayments = await safeGetAll('merchant_payments');

            // 1. CASHFLOW CALCULATION (Opening & Closing)
            cFlows.forEach(c => {
                let amt = Math.abs(parseFloat(c.amount)) || 0;
                let cDate = c.date ? c.date.split('T')[0] : '';
                let mType = String(c.mode).toLowerCase();
                if(mType.includes('metal') || mType.includes('-')) return; 

                let type = c.type || 'OUT';
                if(parseFloat(c.amount) < 0 && c.type === 'IN') type = 'OUT';

                if (cDate < today) {
                    if (type === 'IN') openingCash += amt; else openingCash -= amt;
                } else if (cDate === today) {
                    if (type === 'IN') todayCashIn += amt; else todayCashOut += amt;
                }
            });

            let closingCash = openingCash + todayCashIn - todayCashOut;

            // 2. SALES LOGIC (Gross->Jama, Udhari/OG->Nama)
            sales.filter(s => s.status !== 'cancelled').forEach(s => {
                let cName = getCustName(s.customerId);
                let isCreatedToday = s.date && s.date.startsWith(today);
                
                if (isCreatedToday) {
                    let gross = (parseFloat(s.subTotal)||0) + (parseFloat(s.gst)||0);
                    let ogDeduct = parseFloat(s.oldGoldDeduction)||0;
                    let udhari = parseFloat(s.pendingAmount)||0;
                    
                    let itemsStr = s.items && s.items.length > 0 ? s.items.map(i => `${i.barcode||i.category}`).join(', ') : 'Items';

                    if(gross > 0) logs.SaleGross.push({ amt: gross, mid: cName, right: itemsStr, isIN: true });
                    if(udhari > 0) logs.SaleDueGiven.push({ amt: udhari, mid: cName, right: 'Udhari', isIN: false });
                    if(ogDeduct > 0) logs.OldGold.push({ amt: ogDeduct, mid: cName, right: 'Bill Exch', isIN: false });
                }

                // Check Due Receipts
                if (s.payments) {
                    s.payments.forEach(p => {
                        if (p.date && p.date.startsWith(today)) {
                            let pAmt = parseFloat(p.amount)||0;
                            if(!isCreatedToday && pAmt > 0) {
                                logs.SaleDueRecv.push({ amt: pAmt, mid: cName, right: 'Due Pay', isIN: true });
                            }
                        }
                    });
                }
            });

            // 3. PURCHASES LOGIC
            purchases.filter(p => p.date && p.date.startsWith(today)).forEach(p => {
                let mName = getMerchName(p.merchantId);
                let gross = p.grandTotal || 0;
                let due = p.pendingAmount || p.dueAmount || 0;
                let itemsStr = p.items && p.items.length > 0 ? p.items.map(i => `${i.category}`).join(', ') : 'Stock';
                
                if(gross > 0) logs.Purchase.push({ amt: gross, mid: mName, right: itemsStr, isIN: false });
                if(due > 0) logs.OtherIn.push({ amt: due, mid: mName, right: 'Merchant Due', isIN: true }); // Udhari liya = JAMA
            });

            // 4. LOANS LOGIC
            loans.forEach(l => {
                let cName = getCustName(l.customerId);
                let itemStr = l.item || l.itemName || 'Item';
                
                if (l.date && l.date.startsWith(today) && l.status === 'active') {
                    let amt = l.amount || l.loanAmount || 0;
                    logs.LoanOut.push({ amt: amt, mid: `${cName}`, right: itemStr, isIN: false });
                }

                if (l.payments) {
                    l.payments.filter(p => p.date && p.date.startsWith(today)).forEach(p => {
                        let t = p.type === 'Release' ? '(Chhudaya)' : p.type;
                        logs.LoanIn.push({ amt: p.amount, mid: `${cName}`, right: t, isIN: true });
                    });
                }
            });

            // 5. DIRECT OLD GOLD BUY
            oldGold.filter(o => o.date && o.date.startsWith(today) && o.mode !== 'POS Exchange' && o.type !== 'MELT').forEach(o => {
                let amt = parseFloat(o.amount || o.paidAmount || o.cash || 0);
                let wt = parseFloat(o.netWt || o.oldGoldWeight || 0).toFixed(3) + 'g';
                if(amt > 0) logs.OldGold.push({ amt: amt, mid: getCustName(o.customerId), right: wt, isIN: false });
            });

            // 6. ORDERS & MERCHANTS
            orders.filter(o => o.orderDate && o.orderDate.startsWith(today)).forEach(o => {
                let amt = parseFloat(o.advanceAmount || 0);
                if(amt > 0) logs.OtherIn.push({ amt: amt, mid: getCustName(o.customerId), right: 'Advance', isIN: true });
            });
            mPayments.filter(m => m.date && m.date.startsWith(today)).forEach(m => {
                let amt = parseFloat(m.amount || 0);
                if(amt > 0) {
                    if(m.paymentType === 'OUT') logs.Expense.push({ amt: amt, mid: getMerchName(m.merchantId), right: 'M. Payout', isIN: false });
                    else logs.OtherIn.push({ amt: amt, mid: getMerchName(m.merchantId), right: 'M. Refund', isIN: true });
                }
            });

            // 7. CASHFLOW (EXPENSES & OTHERS)
            cFlows.filter(c => c.date && c.date.startsWith(today)).forEach(c => {
                let amt = Math.abs(parseFloat(c.amount)) || 0;
                let cat = String(c.category || '').toLowerCase();
                let note = String(c.note || '').toLowerCase();
                
                // Ignore system generated to avoid duplicates
                if(cat.includes('sale') || cat.includes('loan') || cat.includes('purchase') || note.includes('pos')) return;

                let type = c.type || 'OUT';
                if(parseFloat(c.amount) < 0 && c.type === 'IN') type = 'OUT';

                if (type === 'IN') {
                    if(!cat.includes('order') && !cat.includes('merch')) {
                        logs.OtherIn.push({ amt: amt, mid: c.note || c.category || 'Income', right: c.mode, isIN: true });
                    }
                } else {
                    if(!cat.includes('order') && !cat.includes('merch') && !cat.includes('old gold')) {
                        logs.Expense.push({ amt: amt, mid: c.note || c.category || 'Kharcha', right: c.mode, isIN: false });
                    }
                }
            });

            // --- CALCULATE AND INJECT ---
            let totalJama = openingCash;
            ['SaleGross', 'SaleDueRecv', 'LoanIn', 'OtherIn'].forEach(k => {
                logs[k].forEach(x => totalJama += x.amt);
            });

            let totalNama = 0;
            ['Purchase', 'SaleDueGiven', 'OldGold', 'LoanOut', 'Expense'].forEach(k => {
                logs[k].forEach(x => totalNama += x.amt);
            });
            totalNama += closingCash;

            // UI Update
            document.getElementById('openBal').innerText = "₹" + openingCash.toLocaleString();
            document.getElementById('closeBal').innerText = "₹" + closingCash.toLocaleString();
            document.getElementById('totalJamaUI').innerText = "₹" + totalJama.toLocaleString();
            document.getElementById('totalNamaUI').innerText = "₹" + totalNama.toLocaleString();

            const fmt = (item) => {
                let c = item.isIN ? 'c-in' : 'c-out';
                return `<div class="log-item"><span class="log-amt ${c}">₹${item.amt.toLocaleString()}</span> <span class="log-mid">| ${item.mid} |</span> <span class="log-right">${item.right}</span></div>`;
            };

            for(let key in logs) {
                let logElement = document.getElementById('log-' + key);
                if(logElement) {
                    if(logs[key].length > 0) {
                        logElement.innerHTML = logs[key].map(fmt).join('');
                        logElement.style.display = 'block';
                    } else {
                        logElement.innerHTML = '<div class="empty-log">Aaj koi entry nahi</div>';
                        logElement.style.display = 'block';
                    }
                }
            }

        } catch(e) { console.error("Rojmel Sync Error:", e); }
    }
</script>

</body>
</html>
