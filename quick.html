<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Action Dashboard - Bharti Jewellers</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #f4f6f9; margin: 0; padding: 10px; }
        .master-container { padding: 15px; max-width: 800px; margin: auto; background: #fff; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        
        .dashboard-title { text-align: center; color: #C5A059; margin-top: 0; padding-bottom: 10px; border-bottom: 2px solid #eee; font-size: 1.5rem; }
        
        /* Action Grid */
        .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 15px; }
        .column { padding: 15px; border-radius: 8px; }
        .col-left { background: #e8f5e9; border: 1px solid #c8e6c9; } 
        .col-right { background: #ffebee; border: 1px solid #ffcdd2; } 
        h3 { text-align: center; margin-top: 0; font-size: 1.1rem; margin-bottom: 15px; }
        .col-left h3 { color: #2e7d32; }
        .col-right h3 { color: #c62828; }
        
        /* Action Wrappers (Button + Log together) */
        .action-wrapper { margin-bottom: 15px; background: #fff; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); overflow: hidden; border: 1px solid #ddd; }
        .action-btn { width: 100%; padding: 12px; border: none; font-size: 1rem; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-in { background: #4caf50; color: white; }
        .btn-in:hover { background: #388e3c; }
        .btn-out { background: #f44336; color: white; }
        .btn-out:hover { background: #d32f2f; }

        /* MINI LOG UNDER BUTTONS */
        .mini-log { background: #fafafa; padding: 5px 10px; font-size: 0.85rem; max-height: 120px; overflow-y: auto; display: none; border-top: 1px solid #eee; }
        .mini-log-item { display: flex; justify-content: space-between; border-bottom: 1px dashed #ccc; padding: 6px 0; align-items: center;}
        .mini-log-item:last-child { border-bottom: none; }
        .log-amt { font-weight: bold; font-size: 0.95rem; }
        .log-code { color: #555; font-size: 0.85rem; font-weight: 600; text-transform: uppercase; text-align: center; flex: 1; }
        .log-wt { color: #333; font-weight: bold; font-size: 0.85rem; text-align: right; }

        .btn-neutral { background: #333; color: white; margin-top: 10px; width: 100%; padding: 12px; font-size: 1.1rem; border:none; border-radius: 6px; cursor: pointer;}

        /* Popup Form */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.6); backdrop-filter: blur(3px); }
        .modal-content { background-color: #fff; margin: 5% auto; padding: 20px; border-radius: 12px; width: 95%; max-width: 450px; position: relative; box-shadow: 0 5px 15px rgba(0,0,0,0.3); max-height: 90vh; overflow-y: auto;}
        .close-btn { position: absolute; right: 15px; top: 15px; font-size: 24px; cursor: pointer; color: #888; background: none; border: none; }
        
        .form-group { margin-bottom: 12px; position: relative; }
        .form-row { display: flex; gap: 10px; margin-bottom: 12px; }
        .form-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 5px; color: #555; }
        .form-group input, .form-group select { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 1rem; }
        .form-group input:focus { border-color: #C5A059; outline: none; }
        
        .dropdown-list { display: none; position: absolute; width: 100%; max-height: 180px; overflow-y: auto; background: white; border: 1px solid #ccc; z-index: 2000; box-shadow: 0 5px 15px rgba(0,0,0,0.1); border-radius: 6px; margin-top: 2px; }
        .dropdown-item { padding: 10px; border-bottom: 1px solid #eee; cursor: pointer; font-size: 0.9rem; color: #333; }
        .dropdown-item:hover { background: #fdfbf7; color: #C5A059; font-weight: bold; }

        .amount-box { background: #fff8e1; padding: 12px; border-radius: 8px; border: 1px solid #ffe082; margin-top: 10px; margin-bottom: 15px; }
        .amount-row { display: flex; justify-content: space-between; font-size: 0.9rem; margin-bottom: 5px; color: #555; }
        .amount-total { font-size: 1.2rem; font-weight: bold; color: #D32F2F; border-top: 1px dashed #ccc; padding-top: 8px; margin-top: 5px; display: flex; justify-content: space-between;}
        
        .save-btn { width: 100%; padding: 15px; background: #C5A059; color: #000; font-size: 1.1rem; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

<div class="master-container">
    <h2 class="dashboard-title">⚡ Quick Action Panel</h2>
    
    <div class="action-grid">
        <div class="column col-left">
            <h3>⬇️ IN (Aaya / Jama)</h3>
            
            <div class="action-wrapper">
                <button class="action-btn btn-in" onclick="openPopup('Sale')">🛒 Sale (Bikri)</button>
                <div id="log-Sale" class="mini-log"></div>
            </div>

            <div class="action-wrapper">
                <button class="action-btn btn-in" onclick="openPopup('Byaaj Jama')">💰 Byaaj Jama</button>
                <div id="log-Byaaj Jama" class="mini-log"></div>
            </div>

            <div class="action-wrapper">
                <button class="action-btn btn-in" onclick="openPopup('Girvi Jama')">💍 Girvi Jama</button>
                <div id="log-Girvi Jama" class="mini-log"></div>
            </div>

            <div class="action-wrapper">
                <button class="action-btn btn-in" onclick="openPopup('Payment In')">💵 Payment In</button>
                <div id="log-Payment In" class="mini-log"></div>
            </div>
        </div>

        <div class="column col-right">
            <h3>⬆️ OUT (Gaya / Udhar)</h3>
            
            <div class="action-wrapper">
                <button class="action-btn btn-out" onclick="openPopup('Girvi Rakha')">🏦 Girvi Diya</button>
                <div id="log-Girvi Rakha" class="mini-log"></div>
            </div>

            <div class="action-wrapper">
                <button class="action-btn btn-out" onclick="openPopup('Purchase')">🛍️ Purchase</button>
                <div id="log-Purchase" class="mini-log"></div>
            </div>

            <div class="action-wrapper">
                <button class="action-btn btn-out" onclick="openPopup('Payment Diya')">💸 Payment Diya</button>
                <div id="log-Payment Diya" class="mini-log"></div>
            </div>

            <div class="action-wrapper">
                <button class="action-btn btn-out" onclick="openPopup('Expense')">📝 Expense</button>
                <div id="log-Expense" class="mini-log"></div>
            </div>
        </div>
    </div>
    
    <button class="action-btn btn-neutral" onclick="location.reload()">🔄 Refresh Page</button>
</div>

<div id="entryModal" class="modal">
    <div class="modal-content">
        <button class="close-btn" onclick="closePopup()">&times;</button>
        <h2 id="modalTitle" style="margin-top:0; color:#C5A059; border-bottom: 2px solid #eee; padding-bottom: 10px;">Entry Form</h2>
        
        <form id="dynamicForm">
            <input type="hidden" id="actionType">
            
            <div class="form-group" style="position:relative;">
                <label>Customer Name</label>
                <input type="text" id="p_customer" placeholder="🔍 Type Customer Name..." autocomplete="off" onfocus="showCustomerDropdown()" oninput="filterCustomerInPopup()" style="border: 2px solid #C5A059; font-weight:bold;">
                <input type="hidden" id="p_customerId">
                <div id="customerDropdownPopup" class="dropdown-list"></div>
            </div>
            
            <div id="formFields"></div>
            
            <button type="button" class="save-btn" onclick="saveEntry()">💾 Save Entry</button>
        </form>
    </div>
</div>

<script src="db.js"></script>

<script>
    let allCustomers = [];
    let allInventory = [];
    let goldRates = { rate22k: 0, rate24k: 0, rate18k: 0, rateSilver: 0, customPurities: [], customSilverPurities: [] };
    let globalGstDefault = 3;
    let selectedItemObj = null;

    window.onload = async function() {
        await loadCoreData();
        await loadTodayLogs(); // Load entries immediately
    };

    async function loadCoreData() {
        try {
            allCustomers = await getAllItems('customers');
            allInventory = await getAllItems('inventory'); 
            const r = await getSetting('gold_rates'); 
            if(r) goldRates = r;
            const defaults = await getSetting('billing_defaults');
            if(defaults && defaults.gst) globalGstDefault = defaults.gst;
        } catch (error) { console.error("Data load error:", error); }
    }

    // --- SMART LOG LOADER (Har button ke niche data bhejne ka kaam) ---
    async function loadTodayLogs() {
        try {
            let today = new Date().toISOString().split('T')[0];
            
            // Sabhi buttons ke logs clear karne ke liye
            let logsHTML = {
                'Sale': '', 'Byaaj Jama': '', 'Girvi Jama': '', 'Payment In': '',
                'Girvi Rakha': '', 'Purchase': '', 'Payment Diya': '', 'Expense': ''
            };

            // 1. Sales Data
            let sales = await getAllItems('sales');
            sales.filter(s => s.date && s.date.startsWith(today)).forEach(s => {
                s.items.forEach(i => {
                    let dispAmt = s.paidAmount > 0 ? s.paidAmount : s.grandTotal;
                    let wtDisp = i.weight ? parseFloat(i.weight).toFixed(3) + 'g' : '';
                    let code = i.barcode || i.category;
                    logsHTML['Sale'] = `<div class="mini-log-item"><span class="log-amt" style="color:#2e7d32">₹${dispAmt.toLocaleString()}</span><span class="log-code">${code}</span><span class="log-wt">${wtDisp}</span></div>` + logsHTML['Sale'];
                });
            });

            // 2. Purchases Data
            let purchases = await getAllItems('purchases');
            purchases.filter(p => p.date && p.date.startsWith(today)).forEach(p => {
                p.items.forEach(i => {
                    let dispAmt = p.paidAmount > 0 ? p.paidAmount : p.grandTotal;
                    let wtDisp = i.weight ? parseFloat(i.weight).toFixed(3) + 'g' : '';
                    let code = i.barcode || i.category;
                    logsHTML['Purchase'] = `<div class="mini-log-item"><span class="log-amt" style="color:#c62828">₹${dispAmt.toLocaleString()}</span><span class="log-code">${code}</span><span class="log-wt">${wtDisp}</span></div>` + logsHTML['Purchase'];
                });
            });

            // 3. Loans Data (Girvi Rakha / Girvi Jama)
            let loans = await getAllItems('loans');
            loans.filter(l => l.date && l.date.startsWith(today)).forEach(l => {
                let action = l.status === 'active' ? 'Girvi Rakha' : 'Girvi Jama';
                let color = l.status === 'active' ? '#c62828' : '#2e7d32';
                let wtDisp = l.weight ? parseFloat(l.weight).toFixed(3) + 'g' : '';
                logsHTML[action] = `<div class="mini-log-item"><span class="log-amt" style="color:${color}">₹${l.amount.toLocaleString()}</span><span class="log-code">${l.item || ''}</span><span class="log-wt">${wtDisp}</span></div>` + logsHTML[action];
            });

            // 4. Cashflow Data (Payments & Expense)
            let cashflow = await getAllItems('cashflow');
            cashflow.filter(c => c.date && c.date.startsWith(today)).forEach(c => {
                if(logsHTML[c.category] !== undefined) {
                    let color = c.type === 'IN' ? '#2e7d32' : '#c62828';
                    logsHTML[c.category] = `<div class="mini-log-item"><span class="log-amt" style="color:${color}">₹${c.amount.toLocaleString()}</span><span class="log-code">${c.note || c.mode}</span><span class="log-wt">-</span></div>` + logsHTML[c.category];
                }
            });

            // UI mein HTML inject karna
            for(let key in logsHTML) {
                let logElement = document.getElementById('log-' + key);
                if(logElement) {
                    if(logsHTML[key] !== '') {
                        logElement.innerHTML = logsHTML[key];
                        logElement.style.display = 'block';
                    } else {
                        logElement.innerHTML = '';
                        logElement.style.display = 'none';
                    }
                }
            }
        } catch(e) { console.error("Log Update Error:", e); }
    }

    // --- POPUP OPEN LOGIC ---
    function openPopup(action) {
        selectedItemObj = null;
        document.getElementById('modalTitle').innerText = action + " Entry";
        document.getElementById('actionType').value = action;
        
        document.getElementById('p_customer').value = '';
        document.getElementById('p_customerId').value = '';

        let fieldsHTML = '';

        if(action === 'Sale' || action === 'Purchase' || action === 'Girvi Rakha' || action === 'Girvi Jama') {
            fieldsHTML = `
                <div class="form-group" style="position:relative;">
                    <label>Item Name / Barcode</label>
                    <input type="text" id="p_item" placeholder="🔍 Scan ya Type karein..." autocomplete="off" onfocus="showItemDropdown()" oninput="filterItemInPopup()" required>
                    <div id="itemDropdownPopup" class="dropdown-list"></div>
                </div>
                
                <div class="form-row">
                    <div class="form-group" style="flex:1;">
                        <label>Net Wt (g)</label>
                        <input type="number" step="0.001" id="p_weight" placeholder="0.000" oninput="calcSmartAmount()" required>
                    </div>
                    <div class="form-group" style="flex:1;">
                        <label>Rate (₹/g)</label>
                        <input type="number" id="p_rate" placeholder="₹ Bhaav" oninput="calcSmartAmount()">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group" style="flex:1;">
                        <label>Making (₹)</label>
                        <input type="number" id="p_making" placeholder="Flat ₹" value="0" oninput="calcSmartAmount()">
                    </div>
                    <div class="form-group" style="flex:1;">
                        <label>GST (%)</label>
                        <input type="number" id="p_gst" value="${globalGstDefault}" oninput="calcSmartAmount()">
                    </div>
                </div>

                <div class="amount-box">
                    <div class="amount-row"><span>Metal Value:</span> <b id="liveMetal">₹0</b></div>
                    <div class="amount-row"><span>Making + GST:</span> <b id="liveTax">₹0</b></div>
                    <div class="amount-total"><span>Grand Total:</span> <span id="liveTotal">₹0</span></div>
                </div>

                <div class="form-row">
                    <div class="form-group" style="flex:2;">
                        <label>Amount Paid / Given (₹)</label>
                        <input type="number" id="p_paid" placeholder="Amount" style="font-size:1.1rem; font-weight:bold; color:#2e7d32;" required>
                    </div>
                    <div class="form-group" style="flex:1;">
                        <label>Mode</label>
                        <select id="p_mode" style="font-weight:bold;">
                            <option value="Cash">Cash</option><option value="UPI">UPI</option>
                        </select>
                    </div>
                </div>
            `;
        } else {
            fieldsHTML = `
                <div class="form-group"><label>Amount (₹)</label><input type="number" id="p_amount" style="font-size:1.2rem; font-weight:bold; color:#D32F2F;" required></div>
                <div class="form-group"><label>Payment Mode</label>
                    <select id="p_mode">
                        <option value="Cash">Cash</option><option value="UPI">UPI</option>
                    </select>
                </div>
                <div class="form-group"><label>Remarks (Optional)</label><input type="text" id="p_desc" placeholder="Details..."></div>
            `;
        }

        document.getElementById('formFields').innerHTML = fieldsHTML;
        document.getElementById('entryModal').style.display = 'block';
    }

    function closePopup() {
        document.getElementById('entryModal').style.display = 'none';
    }

    // --- CUSTOMER SEARCH ---
    function showCustomerDropdown() { renderCustomerDropdown(allCustomers); }
    function filterCustomerInPopup() {
        let txt = document.getElementById('p_customer').value.toLowerCase();
        let filtered = allCustomers.filter(c => (c.name && c.name.toLowerCase().includes(txt)) || (c.mobile && String(c.mobile).includes(txt)));
        renderCustomerDropdown(filtered);
    }
    function renderCustomerDropdown(list) {
        const div = document.getElementById('customerDropdownPopup');
        div.innerHTML = ''; div.style.display = 'block';
        if(list.length === 0) { div.innerHTML = '<div class="dropdown-item">Naya Customer Add Hoga</div>'; return; }
        list.slice(0, 5).forEach(c => {
            let item = document.createElement('div');
            item.className = 'dropdown-item';
            item.innerHTML = `<b>${c.name}</b> <small style="color:#888;">${c.mobile||''}</small>`;
            item.onmousedown = function(e) {
                e.preventDefault();
                document.getElementById('p_customer').value = c.name;
                document.getElementById('p_customerId').value = c.id;
                div.style.display = 'none';
            };
            div.appendChild(item);
        });
    }

    // --- ITEM SEARCH ---
    function showItemDropdown() { renderItemDropdown(allInventory); }
    function filterItemInPopup() {
        let txt = document.getElementById('p_item').value.trim().toUpperCase();
        let exactMatch = allInventory.find(item => item.status === 'stock' && item.barcode && item.barcode.toUpperCase() === txt);
        if(exactMatch) {
            document.getElementById('itemDropdownPopup').style.display = 'none';
            selectInventoryItem(exactMatch);
            return;
        }
        let filtered = allInventory.filter(item => 
            item.status === 'stock' && ((item.barcode && item.barcode.toUpperCase().includes(txt)) || (item.category && item.category.toUpperCase().includes(txt)))
        );
        renderItemDropdown(filtered);
    }
    function renderItemDropdown(list) {
        const div = document.getElementById('itemDropdownPopup');
        if(!div) return;
        div.innerHTML = ''; div.style.display = 'block';
        if(list.length === 0) return;

        list.slice(0, 5).forEach(item => {
            let divItem = document.createElement('div');
            divItem.className = 'dropdown-item';
            let wt = parseFloat(item.netWt || item.grossWeight || item.weight || 0).toFixed(3);
            divItem.innerHTML = `<b>${item.barcode}</b> - ${item.category} <small style="color:#C5A059;">[${wt}g]</small>`;
            divItem.onmousedown = function(e) {
                e.preventDefault(); selectInventoryItem(item); div.style.display = 'none';
            };
            div.appendChild(divItem);
        });
    }

    function getPurityFactor(key) {
        if (!key) return 1.000;
        if (key === '24K' || key === 'Silver') return 1.000;
        if (key === '22K') return 0.9166;
        if (key === '18K') return 0.7500;
        let customG = goldRates.customPurities?.find(cp => cp.name === key);
        if (customG) return customG.pct / 100;
        return 1.0;
    }
    function checkIsSilver(purity) {
        if(!purity) return false;
        const p = purity.toUpperCase();
        return p.includes('SIL') || p.includes('92.5') || p.includes('99.9') || goldRates.customSilverPurities?.find(cp => cp.name.toUpperCase() === p);
    }

    function selectInventoryItem(item) {
        selectedItemObj = item;
        let wt = parseFloat(item.netWt || item.grossWeight || item.weight || 0);
        document.getElementById('p_item').value = `${item.barcode} | ${item.category}`;
        document.getElementById('p_weight').value = wt;

        let isSilv = checkIsSilver(item.purity);
        let pureRatePerGram = isSilv ? (goldRates.rateSilver / 1000) : (goldRates.rate24k / 10);
        let r = 0;
        if(item.purity === '22K') r = goldRates.rate22k / 10;
        else if(item.purity === '18K') r = (goldRates.rate18k || (goldRates.rate22k * 0.82)) / 10;
        else r = pureRatePerGram * getPurityFactor(item.purity);

        document.getElementById('p_rate').value = parseFloat(r.toFixed(2));
        calcSmartAmount();
    }

    function calcSmartAmount() {
        let wt = parseFloat(document.getElementById('p_weight').value) || 0;
        let rate = parseFloat(document.getElementById('p_rate').value) || 0;
        let making = parseFloat(document.getElementById('p_making').value) || 0;
        let gstPct = parseFloat(document.getElementById('p_gst').value) || 0;

        let metalVal = wt * rate;
        let baseTotal = metalVal + making;
        let gstAmt = baseTotal * (gstPct / 100);
        let finalTotal = Math.round(baseTotal + gstAmt);

        document.getElementById('liveMetal').innerText = "₹" + Math.round(metalVal).toLocaleString();
        document.getElementById('liveTax').innerText = "₹" + Math.round(making + gstAmt).toLocaleString();
        document.getElementById('liveTotal').innerText = "₹" + finalTotal.toLocaleString();
        document.getElementById('p_paid').value = finalTotal;
    }

    // Hide dropdowns click outside
    document.addEventListener('click', function(event) {
        let pCust = document.getElementById('p_customer');
        let cList = document.getElementById('customerDropdownPopup');
        if (pCust && cList && !pCust.contains(event.target) && !cList.contains(event.target)) cList.style.display = 'none';
        
        let pItem = document.getElementById('p_item');
        let iList = document.getElementById('itemDropdownPopup');
        if (pItem && iList && !pItem.contains(event.target) && !iList.contains(event.target)) iList.style.display = 'none';
    });

    // --- MASTER SAVE ENTRY ---
    async function saveEntry() {
        let action = document.getElementById('actionType').value;
        let custName = document.getElementById('p_customer').value.trim();
        let cid = document.getElementById('p_customerId').value;
        let dateToday = new Date().toISOString();
        
        if(!custName) return alert("Bhai, Customer ka naam zaroori hai!");

        try {
            const db = await dbPromise;
            if(!cid) cid = await addItem('customers', { name: custName, mobile: '', city: '', bcBalance: 0 });

            const tx = db.transaction(['sales', 'purchases', 'inventory', 'cashflow', 'loans'], 'readwrite');

            if(action === 'Sale' || action === 'Purchase' || action === 'Girvi Rakha' || action === 'Girvi Jama') {
                let itemNameStr = document.getElementById('p_item').value;
                if(!selectedItemObj && !itemNameStr) return alert("Item details bharein!");
                
                let wt = parseFloat(document.getElementById('p_weight').value) || 0;
                let rate = parseFloat(document.getElementById('p_rate').value) || 0;
                let mkAmt = parseFloat(document.getElementById('p_making').value) || 0;
                let gstPct = parseFloat(document.getElementById('p_gst').value) || 0;
                let paid = parseFloat(document.getElementById('p_paid').value) || 0;
                let payMode = document.getElementById('p_mode').value;

                let metalVal = wt * rate;
                let baseAmt = metalVal + mkAmt;
                let gstAmt = baseAmt * (gstPct / 100);
                let grandTotal = Math.round(baseAmt + gstAmt);
                
                let barcodeVal = selectedItemObj ? selectedItemObj.barcode : itemNameStr.split('|')[0].trim();
                
                let cartItem = {
                    id: selectedItemObj ? selectedItemObj.id : 'manual_' + Date.now(),
                    isOldGold: false, barcode: barcodeVal,
                    category: selectedItemObj ? selectedItemObj.category : barcodeVal,
                    purity: selectedItemObj ? selectedItemObj.purity : 'Unknown',
                    weight: wt, grossWt: wt, stoneWt: 0, netWt: wt, payableWt: wt, sellQty: 1,
                    rate: rate, makingType: 'flat', makingRate: mkAmt, makingAmount: mkAmt,
                    baseAmount: baseAmt, gstPct: gstPct, gstAmount: gstAmt, total: grandTotal
                };

                let saleData = {
                    date: dateToday, customerId: parseInt(cid), items: [cartItem],
                    subTotal: baseAmt, gst: gstAmt, oldGoldDeduction: 0, discountMode: 'flat', discount: 0, bcWalletDeduction: 0,
                    grandTotal: grandTotal, paidAmount: paid, pendingAmount: grandTotal - paid,
                    payments: [{ mode: payMode, amount: paid, date: dateToday }],
                    isGstBill: true, status: 'completed'
                };

                if(action === 'Sale') {
                    if(selectedItemObj) {
                        let storeItem = await new Promise(r => tx.objectStore('inventory').get(selectedItemObj.id).onsuccess = e => r(e.target.result));
                        if(storeItem) {
                            let isSilver = checkIsSilver(storeItem.purity);
                            if(isSilver || storeItem.category === 'MIX' || storeItem.pieces > 1) {
                                storeItem.pieces = Math.max(0, (parseInt(storeItem.pieces) || 1) - 1);
                                storeItem.grossWt = Math.max(0, storeItem.grossWt - wt);
                                storeItem.netWt = Math.max(0, storeItem.netWt - wt);
                                storeItem.weight = storeItem.grossWt;
                                if (storeItem.pieces <= 0 || storeItem.netWt <= 0.05) storeItem.status = 'sold';
                            } else {
                                storeItem.status = 'sold'; storeItem.pieces = 0; storeItem.netWt = 0; storeItem.weight = 0;
                            }
                            tx.objectStore('inventory').put(storeItem);
                        }
                    }
                    tx.objectStore('sales').add(saleData);
                    tx.objectStore('cashflow').add({ date: dateToday, type: 'IN', mode: payMode, category: 'POS Sale', amount: paid, note: 'Quick Sale' });
                }
                else if (action === 'Purchase') {
                    tx.objectStore('purchases').add(saleData);
                    tx.objectStore('cashflow').add({ date: dateToday, type: 'OUT', mode: payMode, category: 'Purchase', amount: grandTotal });
                }
                else if (action === 'Girvi Rakha' || action === 'Girvi Jama') {
                    let status = action === 'Girvi Rakha' ? 'active' : 'closed';
                    tx.objectStore('loans').add({
                        customerId: parseInt(cid), date: dateToday.split('T')[0], status: status,
                        item: barcodeVal, metal: (selectedItemObj && checkIsSilver(selectedItemObj.purity)) ? 'Silver' : 'Gold',
                        weight: wt, amount: grandTotal
                    });
                    if(action === 'Girvi Rakha') {
                        tx.objectStore('cashflow').add({ date: dateToday, type: 'OUT', mode: payMode, category: 'New Gold Loan', amount: grandTotal });
                    }
                }

            } else {
                let amt = parseFloat(document.getElementById('p_amount').value);
                let mode = document.getElementById('p_mode').value;
                let desc = document.getElementById('p_desc').value || action;
                let type = (action === 'Payment Diya' || action === 'Expense') ? 'OUT' : 'IN';
                tx.objectStore('cashflow').add({ date: dateToday, type: type, mode: mode, category: action, amount: amt, note: desc });
            }

            tx.oncomplete = () => {
                closePopup();
                loadCoreData();
                loadTodayLogs(); // 🔥 Ye function buttons ke niche records layega
            };
            tx.onerror = (e) => { console.error(e); alert("❌ Error saving data."); };

        } catch(error) {
            console.error("Master Save Error:", error); alert("❌ DB Error!");
        }
    }
</script>
