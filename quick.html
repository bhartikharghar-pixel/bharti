<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Quick Entry - Bharti Jewellers</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #f4f6f9; margin: 0; padding: 15px; }
        .master-container { padding: 20px; max-width: 800px; margin: auto; background: #fff; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        
        .dropdown-container { position: relative; margin-bottom: 20px; }
        .search-box { width: 100%; padding: 15px; font-size: 1.1rem; border: 2px solid #C5A059; border-radius: 8px; box-sizing: border-box; text-align: center; font-weight: bold; background: #fff;}
        .dropdown-list { display: none; position: absolute; width: 100%; max-height: 250px; overflow-y: auto; background: white; border: 1px solid #ccc; z-index: 2000; box-shadow: 0 5px 15px rgba(0,0,0,0.1); border-radius: 8px; margin-top: 5px; }
        .dropdown-item { padding: 12px 15px; border-bottom: 1px solid #eee; cursor: pointer; text-align: left; font-size: 0.95rem; color: #333; }
        .dropdown-item:hover { background: #fdfbf7; color: #C5A059; font-weight: bold; }

        .action-section { display: none; }
        .customer-title { text-align: center; color: #333; margin-bottom: 20px; font-size: 1.4rem; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        
        .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .column { padding: 15px; border-radius: 8px; }
        .col-left { background: #e8f5e9; border: 1px solid #c8e6c9; } 
        .col-right { background: #ffebee; border: 1px solid #ffcdd2; } 
        h3 { text-align: center; margin-top: 0; font-size: 1rem; }
        .col-left h3 { color: #2e7d32; }
        .col-right h3 { color: #c62828; }
        
        .action-btn { width: 100%; padding: 12px; margin-bottom: 10px; border: none; border-radius: 6px; font-size: 0.95rem; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-in { background: #4caf50; color: white; }
        .btn-in:hover { background: #388e3c; }
        .btn-out { background: #f44336; color: white; }
        .btn-out:hover { background: #d32f2f; }
        .btn-neutral { background: #333; color: white; margin-top: 20px; width: 100%; padding: 12px; font-size: 1.1rem; border:none; border-radius: 6px; cursor: pointer;}

        /* Smart Modal Style */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.6); backdrop-filter: blur(3px); }
        .modal-content { background-color: #fff; margin: 5% auto; padding: 25px; border-radius: 12px; width: 90%; max-width: 450px; position: relative; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        .close-btn { position: absolute; right: 15px; top: 15px; font-size: 24px; cursor: pointer; color: #888; background: none; border: none; }
        
        .form-group { margin-bottom: 12px; position: relative; }
        .form-row { display: flex; gap: 10px; margin-bottom: 12px; }
        .form-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 5px; color: #666; }
        .form-group input, .form-group select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 1rem; background: #f9f9f9; }
        .form-group input:focus { border-color: #C5A059; background: #fff; outline: none; }
        
        .amount-box { background: #fff8e1; padding: 15px; border-radius: 8px; border: 1px solid #ffe082; margin-top: 15px; margin-bottom: 15px; }
        .amount-row { display: flex; justify-content: space-between; font-size: 0.9rem; margin-bottom: 5px; color: #555; }
        .amount-total { font-size: 1.3rem; font-weight: bold; color: #D32F2F; border-top: 1px dashed #ccc; padding-top: 8px; margin-top: 5px; display: flex; justify-content: space-between;}
        
        .save-btn { width: 100%; padding: 15px; background: #C5A059; color: #000; font-size: 1.1rem; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>

<div class="master-container">
    <div class="dropdown-container">
        <input type="text" id="searchCustomer" class="search-box" placeholder="🔍 Select ya Search Customer..." autocomplete="off" onfocus="openDropdown()" oninput="filterDropdown()">
        <div id="dropdownList" class="dropdown-list"></div>
    </div>

    <div id="actionPanel" class="action-section">
        <h2 class="customer-title" id="displayCustName">Customer Name</h2>
        
        <div class="action-grid">
            <div class="column col-left">
                <h3>⬇️ IN (Aaya / Jama)</h3>
                <button class="action-btn btn-in" onclick="openPopup('Sale')">🛒 Smart Sale (Bikri)</button>
                <button class="action-btn btn-in" onclick="openPopup('Byaaj Jama')">💰 Byaaj Jama</button>
                <button class="action-btn btn-in" onclick="openPopup('Girvi Jama')">💍 Girvi Jama</button>
                <button class="action-btn btn-in" onclick="openPopup('Payment In')">💵 Payment In</button>
            </div>

            <div class="column col-right">
                <h3>⬆️ OUT (Gaya / Udhar)</h3>
                <button class="action-btn btn-out" onclick="openPopup('Girvi Rakha')">🏦 Girvi Diya</button>
                <button class="action-btn btn-out" onclick="openPopup('Purchase')">🛍️ Purchase</button>
                <button class="action-btn btn-out" onclick="openPopup('Payment Diya')">💸 Payment Diya</button>
                <button class="action-btn btn-out" onclick="openPopup('Expense')">📝 Expense</button>
            </div>
        </div>
        
        <button class="action-btn btn-neutral" onclick="resetSearch()">❌ Cancel / New Entry</button>
    </div>
</div>

<div id="entryModal" class="modal">
    <div class="modal-content">
        <button class="close-btn" onclick="closePopup()">&times;</button>
        <h2 id="modalTitle" style="margin-top:0; color:#C5A059; border-bottom: 2px solid #eee; padding-bottom: 10px;">Form</h2>
        
        <form id="dynamicForm">
            <input type="hidden" id="actionType">
            <input type="hidden" id="customerIdHidden">
            <input type="hidden" id="customerNameHidden">
            
            <div id="formFields"></div>
            <button type="button" class="save-btn" onclick="saveEntry()"><i class="fas fa-check-circle"></i> 💾 Save Data</button>
        </form>
    </div>
</div>

<script src="db.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>

<script>
    let allCustomers = [];
    let allInventory = [];
    let goldRates = { rate22k: 0, rate24k: 0, rate18k: 0, rateSilver: 0, customPurities: [], customSilverPurities: [] };
    let globalGstDefault = 3;
    let selectedItemObj = null; // Store selected item data completely

    window.onload = async function() {
        try {
            allCustomers = await getAllItems('customers');
            allInventory = await getAllItems('inventory'); 
            
            // Fetch global settings just like sales.html
            const r = await getSetting('gold_rates'); 
            if(r) goldRates = r;
            
            const defaults = await getSetting('billing_defaults');
            if(defaults && defaults.gst) globalGstDefault = defaults.gst;

        } catch (error) { console.error("Data load failed:", error); }
    };

    /* --- Purity Factor Logic (Same as sales.html) --- */
    function getPurityFactor(key) {
        if (!key) return 1.000;
        if (key === '24K' || key === 'Silver') return 1.000;
        if (key === '22K') return 0.9166;
        if (key === '18K') return 0.7500;
        if (key === 'Silver 92.5%') return 0.925;
        
        let customG = goldRates.customPurities?.find(cp => cp.name === key);
        if (customG) return customG.pct / 100;
        let customS = goldRates.customSilverPurities?.find(cp => cp.name === key);
        if (customS) return customS.pct / 100;
        return 1.0;
    };

    function checkIsSilver(purity) {
        if(!purity) return false;
        const p = purity.toUpperCase();
        if (p.includes('SIL') || p.includes('92.5') || p.includes('99.9')) return true;
        let customS = goldRates.customSilverPurities?.find(cp => cp.name.toUpperCase() === p);
        if (customS) return true;
        return false;
    }

    /* --- Customer Dropdown --- */
    function openDropdown() {
        document.getElementById('dropdownList').style.display = 'block';
        renderDropdown(allCustomers);
    }

    function filterDropdown() {
        let txt = document.getElementById('searchCustomer').value.toLowerCase();
        document.getElementById('dropdownList').style.display = 'block';
        let filtered = allCustomers.filter(c => 
            (c.name && c.name.toLowerCase().includes(txt)) || 
            (c.mobile && String(c.mobile).includes(txt))
        );
        renderDropdown(filtered);
    }

    function renderDropdown(list) {
        const div = document.getElementById('dropdownList');
        div.innerHTML = '';
        if(list.length === 0) {
            div.innerHTML = '<div class="dropdown-item" style="text-align:center;">Customer nahi mila</div>';
            return;
        }
        list.slice(0, 10).forEach(c => {
            let item = document.createElement('div');
            item.className = 'dropdown-item';
            item.innerHTML = `<b>${c.name}</b> <small style="color:#888;">${c.mobile ? c.mobile : ''}</small>`;
            item.onmousedown = function(e) {
                e.preventDefault();
                document.getElementById('searchCustomer').value = `${c.name} - ${c.mobile || ''}`;
                document.getElementById('dropdownList').style.display = 'none';
                document.getElementById('actionPanel').style.display = 'block';
                document.getElementById('displayCustName').innerText = "👤 " + c.name;
                
                // Store Customer ID and Name for DB
                document.getElementById('customerIdHidden').value = c.id;
                document.getElementById('customerNameHidden').value = c.name;
            };
            div.appendChild(item);
        });
    }

    function resetSearch() {
        document.getElementById('searchCustomer').value = '';
        document.getElementById('actionPanel').style.display = 'none';
    }

    /* --- Popup Form Generator --- */
    function openPopup(action) {
        selectedItemObj = null;
        let custName = document.getElementById('customerNameHidden').value;
        document.getElementById('modalTitle').innerText = action + " - " + custName;
        document.getElementById('actionType').value = action;

        let fieldsHTML = '';

        if(action === 'Sale' || action === 'Purchase' || action === 'Girvi Rakha' || action === 'Girvi Jama') {
            fieldsHTML = `
                <div class="form-group" style="position:relative;">
                    <label>Item Barcode / Search</label>
                    <input type="text" id="p_item" placeholder="Scan Barcode ya Item..." autocomplete="off" onfocus="openItemDropdown()" oninput="filterItemDropdown()" style="border:2px solid #C5A059; font-weight:bold;" required>
                    <div id="itemDropdownList" class="dropdown-list" style="max-height: 180px; z-index:9999;"></div>
                </div>
                
                <div class="form-row">
                    <div class="form-group" style="flex:1;">
                        <label>Net Wt (g)</label>
                        <input type="number" step="0.001" id="p_weight" placeholder="0.000" oninput="calculateSmartAmount()" required>
                    </div>
                    <div class="form-group" style="flex:1;">
                        <label>Rate (₹/g)</label>
                        <input type="number" id="p_rate" placeholder="₹ Rate" oninput="calculateSmartAmount()">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group" style="flex:1;">
                        <label>Making (₹)</label>
                        <input type="number" id="p_making" placeholder="Flat ₹" value="0" oninput="calculateSmartAmount()">
                    </div>
                    <div class="form-group" style="flex:1;">
                        <label>GST (%)</label>
                        <input type="number" id="p_gst" value="${globalGstDefault}" oninput="calculateSmartAmount()">
                    </div>
                </div>

                <div class="amount-box">
                    <div class="amount-row"><span>Metal Value:</span> <b id="liveMetal">₹0</b></div>
                    <div class="amount-row"><span>Making + GST:</span> <b id="liveTax">₹0</b></div>
                    <div class="amount-total"><span>Grand Total:</span> <span id="liveTotal">₹0</span></div>
                </div>

                <div class="form-row">
                    <div class="form-group" style="flex:2;">
                        <label>Customer Paid (₹)</label>
                        <input type="number" id="p_paid" placeholder="Amount Received" style="font-size:1.1rem; font-weight:bold; color:#2e7d32;" required>
                    </div>
                    <div class="form-group" style="flex:1;">
                        <label>Mode</label>
                        <select id="p_mode" style="font-weight:bold;">
                            <option value="Cash">Cash</option>
                            <option value="UPI">UPI</option>
                        </select>
                    </div>
                </div>
            `;
        } else {
            fieldsHTML = `
                <div class="form-group"><label>Amount (₹)</label><input type="number" id="p_amount" style="font-size:1.2rem; font-weight:bold; color:#D32F2F;" required></div>
                <div class="form-group"><label>Payment Mode</label>
                    <select id="p_mode">
                        <option value="Cash">Cash</option><option value="UPI">UPI</option>
                    </select>
                </div>
                <div class="form-group"><label>Remarks (Optional)</label><input type="text" id="p_desc" placeholder="Koi Detail?"></div>
            `;
        }

        document.getElementById('formFields').innerHTML = fieldsHTML;
        document.getElementById('entryModal').style.display = 'block';
    }

    function closePopup() {
        document.getElementById('entryModal').style.display = 'none';
    }

    /* --- Smart Auto-Calculation --- */
    function calculateSmartAmount() {
        let wt = parseFloat(document.getElementById('p_weight').value) || 0;
        let rate = parseFloat(document.getElementById('p_rate').value) || 0;
        let making = parseFloat(document.getElementById('p_making').value) || 0;
        let gstPct = parseFloat(document.getElementById('p_gst').value) || 0;

        let metalVal = wt * rate;
        let baseTotal = metalVal + making;
        let gstAmt = baseTotal * (gstPct / 100);
        let finalTotal = Math.round(baseTotal + gstAmt);

        document.getElementById('liveMetal').innerText = "₹" + Math.round(metalVal).toLocaleString();
        document.getElementById('liveTax').innerText = "₹" + Math.round(making + gstAmt).toLocaleString();
        document.getElementById('liveTotal').innerText = "₹" + finalTotal.toLocaleString();
        
        // Auto fill payment received field with Grand Total
        document.getElementById('p_paid').value = finalTotal;
    }

    /* --- Inventory & Barcode Logic --- */
    function openItemDropdown() {
        renderItemDropdown(allInventory);
    }

    function filterItemDropdown() {
        let txt = document.getElementById('p_item').value.trim().toUpperCase();
        
        // Exact Barcode Scanner Match
        let exactMatch = allInventory.find(item => item.status === 'stock' && item.barcode && item.barcode.toUpperCase() === txt);
        if(exactMatch) {
            document.getElementById('itemDropdownList').style.display = 'none';
            selectInventoryItem(exactMatch);
            return;
        }

        let filtered = allInventory.filter(item => 
            item.status === 'stock' && (
                (item.barcode && item.barcode.toUpperCase().includes(txt)) || 
                (item.category && item.category.toUpperCase().includes(txt))
            )
        );
        renderItemDropdown(filtered);
        document.getElementById('itemDropdownList').style.display = 'block';
    }

    function renderItemDropdown(list) {
        const div = document.getElementById('itemDropdownList');
        if(!div) return;
        div.innerHTML = '';
        
        if(list.length === 0) return;

        list.slice(0, 10).forEach(item => {
            let divItem = document.createElement('div');
            divItem.className = 'dropdown-item';
            
            let wt = parseFloat(item.netWt || item.grossWeight || item.weight || 0).toFixed(3);
            divItem.innerHTML = `<b>${item.barcode}</b> - ${item.category} <small style="color:#C5A059;">[${item.purity} | ${wt}g]</small>`;
            
            divItem.onmousedown = function(e) {
                e.preventDefault(); 
                selectInventoryItem(item);
                div.style.display = 'none';
            };
            div.appendChild(divItem);
        });
    }

    function selectInventoryItem(item) {
        selectedItemObj = item;
        let wt = parseFloat(item.netWt || item.grossWeight || item.weight || 0);
        
        document.getElementById('p_item').value = `${item.barcode} | ${item.category}`;
        document.getElementById('p_weight').value = wt;

        // Smart Rate Calculation just like sales.html
        let isSilv = checkIsSilver(item.purity);
        let pureRatePerGram = isSilv ? (goldRates.rateSilver / 1000) : (goldRates.rate24k / 10);
        let r = 0;
        
        if(item.purity === '22K') r = goldRates.rate22k / 10;
        else if(item.purity === '18K') r = (goldRates.rate18k || (goldRates.rate22k * 0.82)) / 10;
        else r = pureRatePerGram * getPurityFactor(item.purity);

        document.getElementById('p_rate').value = parseFloat(r.toFixed(2));
        
        calculateSmartAmount();
    }

    // Hide dropdowns click outside
    document.addEventListener('click', function(event) {
        let pItem = document.getElementById('p_item');
        let iList = document.getElementById('itemDropdownList');
        if (pItem && iList && !pItem.contains(event.target) && !iList.contains(event.target)) { iList.style.display = 'none'; }
        let searchC = document.getElementById('searchCustomer');
        let cList = document.getElementById('dropdownList');
        if (searchC && cList && !searchC.contains(event.target) && !cList.contains(event.target)) { cList.style.display = 'none'; }
    });

    /* --- THE MASTER SAVE FUNCTION --- */
    async function saveEntry() {
        let action = document.getElementById('actionType').value;
        let cid = document.getElementById('customerIdHidden').value;
        let dateToday = new Date().toISOString();

        try {
            const db = await dbPromise;
            const tx = db.transaction(['sales', 'inventory', 'cashflow', 'loans'], 'readwrite');

            if(action === 'Sale' || action === 'Purchase' || action === 'Girvi Rakha') {
                if(!selectedItemObj) return alert("Pehle upar se Item select karein!");
                
                let wt = parseFloat(document.getElementById('p_weight').value);
                let rate = parseFloat(document.getElementById('p_rate').value);
                let mkAmt = parseFloat(document.getElementById('p_making').value) || 0;
                let gstPct = parseFloat(document.getElementById('p_gst').value) || 0;
                let paid = parseFloat(document.getElementById('p_paid').value) || 0;
                let payMode = document.getElementById('p_mode').value;

                let metalVal = wt * rate;
                let baseAmt = metalVal + mkAmt;
                let gstAmt = baseAmt * (gstPct / 100);
                let grandTotal = Math.round(baseAmt + gstAmt);
                
                // Construct EXACT Item array for `sales.html` compatibility
                let cartItem = {
                    id: selectedItemObj.id,
                    isOldGold: false,
                    barcode: selectedItemObj.barcode,
                    category: selectedItemObj.category,
                    purity: selectedItemObj.purity,
                    weight: wt,
                    grossWt: wt,
                    stoneWt: 0,
                    netWt: wt,
                    payableWt: wt,
                    sellQty: 1,
                    rate: rate,
                    makingType: 'flat',
                    makingRate: mkAmt,
                    makingAmount: mkAmt,
                    baseAmount: baseAmt,
                    gstPct: gstPct,
                    gstAmount: gstAmt,
                    total: grandTotal
                };

                let saleData = {
                    date: dateToday, customerId: parseInt(cid), items: [cartItem],
                    subTotal: baseAmt, gst: gstAmt, oldGoldDeduction: 0,
                    discountMode: 'flat', discount: 0, bcWalletDeduction: 0,
                    grandTotal: grandTotal, paidAmount: paid, pendingAmount: grandTotal - paid,
                    payments: [{ mode: payMode, amount: paid, date: dateToday }],
                    isGstBill: true, status: 'completed'
                };

                if(action === 'Sale') {
                    // Update Inventory Logic (Exact replica of sales.html updateStockStatusInternal)
                    let storeItem = await new Promise(r => tx.objectStore('inventory').get(selectedItemObj.id).onsuccess = e => r(e.target.result));
                    if(storeItem) {
                        let isSilver = checkIsSilver(storeItem.purity);
                        if(isSilver || storeItem.category === 'MIX' || storeItem.pieces > 1) {
                            storeItem.pieces = Math.max(0, (parseInt(storeItem.pieces) || 1) - 1);
                            storeItem.grossWt = Math.max(0, storeItem.grossWt - wt);
                            storeItem.netWt = Math.max(0, storeItem.netWt - wt);
                            storeItem.weight = storeItem.grossWt;
                            if (storeItem.pieces <= 0 || storeItem.netWt <= 0.05) storeItem.status = 'sold';
                        } else {
                            storeItem.status = 'sold';
                            storeItem.pieces = 0; storeItem.netWt = 0; storeItem.weight = 0;
                        }
                        tx.objectStore('inventory').put(storeItem);
                    }

                    // Save Sale & Cashflow
                    let sReq = tx.objectStore('sales').add(saleData);
                    tx.objectStore('cashflow').add({ date: dateToday, type: 'IN', mode: payMode, category: 'POS Sale', amount: paid, note: 'Quick Sale Entry' });
                }
                else if (action === 'Girvi Rakha') {
                    // Logic for Girvi (Loans)
                    tx.objectStore('loans').add({
                        customerId: parseInt(cid), date: dateToday.split('T')[0], status: 'active',
                        item: selectedItemObj.category, metal: checkIsSilver(selectedItemObj.purity) ? 'Silver' : 'Gold',
                        weight: wt, amount: grandTotal // In loan, grandTotal is loan given
                    });
                    tx.objectStore('cashflow').add({ date: dateToday, type: 'OUT', mode: payMode, category: 'New Gold Loan', amount: grandTotal });
                }

            } else {
                // Cash Only Entries (Payment In/Out)
                let amt = parseFloat(document.getElementById('p_amount').value);
                let mode = document.getElementById('p_mode').value;
                let desc = document.getElementById('p_desc').value || action;
                let type = (action === 'Payment Diya' || action === 'Expense') ? 'OUT' : 'IN';
                
                tx.objectStore('cashflow').add({
                    date: dateToday, type: type, mode: mode, category: action, amount: amt, note: desc
                });
            }

            tx.oncomplete = () => {
                alert("✅ Record successfully saved!");
                closePopup();
                resetSearch();
                window.location.reload(); // Refresh to get updated stock
            };
            tx.onerror = (e) => {
                console.error(e); alert("❌ Error saving data.");
            };

        } catch(error) {
            console.error("Master Save Error:", error); alert("❌ DB Error!");
        }
    }
</script>

</body>
</html>
