<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Dashboard - Bharti Jewellers</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; margin: 0; padding: 15px; }
        .master-container { padding: 20px; max-width: 800px; margin: auto; background: #fff; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        
        /* Dropdown Style */
        .dropdown-container { position: relative; margin-bottom: 20px; }
        .search-box { width: 100%; padding: 15px; font-size: 1.1rem; border: 2px solid #d4af37; border-radius: 8px; box-sizing: border-box; text-align: center; font-weight: bold; }
        .dropdown-list { display: none; position: absolute; width: 100%; max-height: 200px; overflow-y: auto; background: white; border: 1px solid #ccc; z-index: 2000; box-shadow: 0 4px 6px rgba(0,0,0,0.2); }
        .dropdown-item { padding: 12px; border-bottom: 1px solid #eee; cursor: pointer; text-align: left; font-size: 0.95rem; color: #333; }
        .dropdown-item:hover { background: #f0f0f0; color: #d4af37; font-weight: bold; }

        .action-section { display: none; }
        .customer-title { text-align: center; color: #333; margin-bottom: 20px; font-size: 1.4rem; border-bottom: 2px solid #d4af37; padding-bottom: 10px; }
        
        /* Grid Buttons */
        .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .column { padding: 10px; border-radius: 8px; }
        .col-left { background: #e8f5e9; border: 1px solid #c8e6c9; } 
        .col-right { background: #ffebee; border: 1px solid #ffcdd2; } 
        h3 { text-align: center; margin-top: 0; font-size: 1rem; }
        .col-left h3 { color: #2e7d32; }
        .col-right h3 { color: #c62828; }
        
        .action-btn { width: 100%; padding: 10px; margin-bottom: 10px; border: none; border-radius: 5px; font-size: 0.95rem; font-weight: bold; cursor: pointer; }
        .btn-in { background: #4caf50; color: white; }
        .btn-out { background: #f44336; color: white; }
        .btn-neutral { background: #2196f3; color: white; margin-top: 20px; width: 100%; padding: 12px; font-size: 1.1rem; border:none; border-radius: 5px;}

        /* Popup Form (Modal) */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.7); }
        .modal-content { background-color: #fff; margin: 15% auto; padding: 20px; border-radius: 8px; width: 90%; max-width: 400px; position: relative; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        .close-btn { position: absolute; right: 15px; top: 10px; font-size: 24px; cursor: pointer; color: #555; }
        
        .form-group { margin-bottom: 15px; position: relative; }
        .form-group label { display: block; font-size: 0.9rem; font-weight: bold; margin-bottom: 5px; color: #333; }
        .form-group input, .form-group select { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 1rem;}
        .save-btn { width: 100%; padding: 14px; background: #d4af37; color: white; font-size: 1.2rem; font-weight: bold; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

<div class="master-container">
    <!-- Dropdown & Search -->
    <div class="dropdown-container">
        <input type="text" id="searchCustomer" class="search-box" placeholder="🔍 Select ya Search Customer..." autocomplete="off" onclick="openDropdown()" oninput="filterDropdown()">
        <div id="dropdownList" class="dropdown-list">
            <!-- Data yahan JS se aayega -->
        </div>
    </div>

    <!-- Action Buttons -->
    <div id="actionPanel" class="action-section">
        <h2 class="customer-title" id="displayCustName">Customer Name</h2>
        
        <div class="action-grid">
            <div class="column col-left">
                <h3>⬇️ IN (Aaya / Jama)</h3>
                <button class="action-btn btn-in" onclick="openPopup('Sale')">🛒 Sale (Bikri)</button>
                <button class="action-btn btn-in" onclick="openPopup('Byaaj Jama')">💰 Byaaj Jama</button>
                <button class="action-btn btn-in" onclick="openPopup('Girvi Jama')">💍 Girvi Jama</button>
                <button class="action-btn btn-in" onclick="openPopup('Release')">🔓 Release</button>
                <button class="action-btn btn-in" onclick="openPopup('Payment In')">💵 Payment In</button>
            </div>

            <div class="column col-right">
                <h3>⬆️ OUT (Gaya / Udhar)</h3>
                <button class="action-btn btn-out" onclick="openPopup('Girvi Rakha')">🏦 Girvi Diya</button>
                <button class="action-btn btn-out" onclick="openPopup('Purchase')">🛍️ Purchase</button>
                <button class="action-btn btn-out" onclick="openPopup('Payment Diya')">💸 Payment Diya</button>
                <button class="action-btn btn-out" onclick="openPopup('Expense')">📝 Expense</button>
            </div>
        </div>
        
        <button class="action-btn btn-neutral" onclick="resetSearch()">❌ Cancel / New Entry</button>
    </div>
</div>

<!-- POPUP MODAL (Entry Form) -->
<div id="entryModal" class="modal">
    <div class="modal-content">
        <span class="close-btn" onclick="closePopup()">&times;</span>
        <h2 id="modalTitle" style="margin-top:0; color:#d4af37; border-bottom: 2px solid #eee; padding-bottom: 10px;">Form</h2>
        
        <form id="dynamicForm">
            <input type="hidden" id="actionType">
            <input type="hidden" id="customerHidden">
            
            <div id="formFields">
                <!-- Fields JS se aayenge -->
            </div>

            <button type="button" class="save-btn" onclick="saveEntry()">💾 Save Entry</button>
        </form>
    </div>
</div>

<script src="db.js"></script>

<script>
    let allCustomers = [];
    let allInventory = []; // Inventory ka data rakhne ke liye

    // 1. Data load at start
    window.onload = async function() {
        try {
            allCustomers = await getAllItems('customers');
            allInventory = await getAllItems('inventory'); // Stock ka data fetch karein
        } catch (error) {
            console.error("Data load failed:", error);
        }
    };

    // 2. Customer Dropdown Logic
    function openDropdown() {
        document.getElementById('dropdownList').style.display = 'block';
        renderDropdown(allCustomers);
    }

    function filterDropdown() {
        let txt = document.getElementById('searchCustomer').value.toLowerCase();
        document.getElementById('dropdownList').style.display = 'block';
        let filtered = allCustomers.filter(c => 
            (c.name && c.name.toLowerCase().includes(txt)) || 
            (c.mobile && c.mobile.includes(txt))
        );
        renderDropdown(filtered);
    }

    function renderDropdown(list) {
        const div = document.getElementById('dropdownList');
        div.innerHTML = '';
        if(list.length === 0) {
            div.innerHTML = '<div class="dropdown-item" style="text-align:center;">Naya Customer Add Karein...</div>';
            return;
        }
        list.forEach(c => {
            let item = document.createElement('div');
            item.className = 'dropdown-item';
            item.innerText = c.name + (c.mobile ? ` - ${c.mobile}` : '');
            item.onclick = function() {
                selectCustomer(c.name, item.innerText);
            };
            div.appendChild(item);
        });
    }

    function selectCustomer(realName, displayTxt) {
        document.getElementById('searchCustomer').value = displayTxt;
        document.getElementById('dropdownList').style.display = 'none';
        document.getElementById('actionPanel').style.display = 'block';
        document.getElementById('displayCustName').innerText = "👤 " + realName;
    }

    function resetSearch() {
        document.getElementById('searchCustomer').value = '';
        document.getElementById('actionPanel').style.display = 'none';
    }

    // 3. Popup Form & Inventory Dropdown Logic
    function openPopup(action) {
        let customer = document.getElementById('displayCustName').innerText.replace('👤 ', '');
        
        document.getElementById('modalTitle').innerText = action + " - " + customer;
        document.getElementById('actionType').value = action;
        document.getElementById('customerHidden').value = customer;

        let fieldsHTML = '';

        if(action === 'Sale' || action === 'Purchase' || action === 'Girvi Rakha' || action === 'Girvi Jama') {
            fieldsHTML = `
                <div class="form-group">
                    <label>Item / Barcode Search</label>
                    <input type="text" id="p_item" placeholder="Barcode ya Item type karein..." autocomplete="off" onclick="openItemDropdown()" oninput="filterItemDropdown()" required>
                    <div id="itemDropdownList" class="dropdown-list"></div>
                </div>
                <div class="form-group"><label>Weight (Grams)</label><input type="number" step="0.001" id="p_weight" required></div>
                <div class="form-group"><label>Total Amount (₹)</label><input type="number" id="p_amount" required></div>
            `;
        } else {
            fieldsHTML = `
                <div class="form-group"><label>Amount (₹)</label><input type="number" id="p_amount" required></div>
                <div class="form-group"><label>Remarks / Detail</label><input type="text" id="p_item" placeholder="Koi detail? (Optional)"></div>
            `;
        }

        document.getElementById('formFields').innerHTML = fieldsHTML;
        document.getElementById('entryModal').style.display = 'block';
    }

    function closePopup() {
        document.getElementById('entryModal').style.display = 'none';
    }

    // --- Inventory Items ki Dropdown list ke functions ---
    function openItemDropdown() {
        renderItemDropdown(allInventory);
    }

    function filterItemDropdown() {
        let txt = document.getElementById('p_item').value.toLowerCase();
        let filtered = allInventory.filter(item => 
            (item.barcode && item.barcode.toLowerCase().includes(txt)) || 
            (item.category && item.category.toLowerCase().includes(txt)) ||
            (item.name && item.name.toLowerCase().includes(txt))
        );
        renderItemDropdown(filtered);
    }

    function renderItemDropdown(list) {
        const div = document.getElementById('itemDropdownList');
        if(!div) return;
        div.style.display = 'block';
        div.innerHTML = '';
        
        if(list.length === 0) {
            div.innerHTML = '<div class="dropdown-item">Item nahi mila. Manually type karein.</div>';
            return;
        }

        list.forEach(item => {
            let divItem = document.createElement('div');
            divItem.className = 'dropdown-item';
            
            // Format banayenge: "B-001 - Gold Ring (12.500g)"
            let itemName = item.category || item.name || "Item";
            let displayTxt = `${item.barcode ? '[' + item.barcode + '] ' : ''}${itemName}`;
            let wtText = item.weight ? ` - ${item.weight}g` : '';
            
            divItem.innerText = displayTxt + wtText;
            
            divItem.onclick = function() {
                // Input box me naam dalenge
                document.getElementById('p_item').value = displayTxt;
                
                // Agar item ka weight database me hai, to weight wale box me automatically daal denge
                if(item.weight && document.getElementById('p_weight')) {
                    document.getElementById('p_weight').value = item.weight;
                }
                
                div.style.display = 'none';
            };
            div.appendChild(divItem);
        });
    }

    // Dropdown ke bahar click karne par band karne ka code
    window.onclick = function(event) {
        if (!event.target.matches('#searchCustomer')) {
            let cList = document.getElementById('dropdownList');
            if(cList) cList.style.display = 'none';
        }
        if (!event.target.matches('#p_item')) {
            let iList = document.getElementById('itemDropdownList');
            if(iList) iList.style.display = 'none';
        }
    }

    // 4. Save Entry to db.js
    async function saveEntry() {
        let action = document.getElementById('actionType').value;
        let customer = document.getElementById('customerHidden').value;
        let amount = document.getElementById('p_amount') ? document.getElementById('p_amount').value : 0;
        let item = document.getElementById('p_item') ? document.getElementById('p_item').value : '';
        let weight = document.getElementById('p_weight') ? document.getElementById('p_weight').value : 0;

        if(!amount) { alert("Bhai, Amount toh dalo!"); return; }

        let dateToday = new Date().toISOString().split('T')[0];
        let storeName = '';
        let finalData = { date: dateToday, customerName: customer, amount: parseFloat(amount), status: 'completed' };

        if(action === 'Sale') {
            storeName = 'sales'; finalData.item = item; finalData.weight = parseFloat(weight);
        } else if(action === 'Girvi Rakha' || action === 'Girvi Jama') {
            storeName = 'loans'; finalData.item = item; finalData.weight = parseFloat(weight); finalData.status = action === 'Girvi Rakha' ? 'active' : 'closed';
        } else if(action === 'Purchase') {
            storeName = 'purchases'; finalData.item = item; finalData.weight = parseFloat(weight);
        } else {
            storeName = 'cashflow'; finalData.mode = action; finalData.description = item;
        }

        try {
            await addItem(storeName, finalData);
            alert("✅ Entry Save Ho Gayi!");
            closePopup();
            resetSearch();
        } catch(error) {
            console.error("Save failed", error);
            alert("❌ Data Save Error!");
        }
    }
</script>

</body>
</html>
