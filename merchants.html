<!-- mMobile के नीचे इसे लगाएँ -->
<div class="form-group" style="margin-top: 15px;">
    <label>Merchant Type (व्यापारी का प्रकार)</label>
    <div class="radio-group">
        <div class="radio-btn active out" id="catBoth" onclick="setMCat('Both')">Both (दोनो)</div>
        <div class="radio-btn" id="catGold" onclick="setMCat('Gold')" style="color: var(--accent-gold); border-color: var(--accent-gold);">Only Gold</div>
        <div class="radio-btn" id="catSilver" onclick="setMCat('Silver')" style="color: var(--accent-silver); border-color: var(--accent-silver);">Only Silver</div>
    </div>
    <input type="hidden" id="mCategoryVal" value="Both">
</div>

<!-- Opening Balances वाले हिस्से को इस तरह अपडेट करें -->
<div id="balanceField" style="background:#f8fafc; padding:20px; border-radius:12px; border:1px solid #e2e8f0; margin-top:20px;">
    <div style="font-size:0.85rem; color:#333; font-weight:700; margin-bottom:15px; text-transform:uppercase;">Opening Balances</div>
    
    <div class="form-group">
        <label>Cash Balance (₹)</label>
        <input type="number" id="mBalance" value="0">
    </div>
    
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
        <div class="form-group" id="grpGoldBal">
            <label style="color:var(--accent-gold);">Gold Balance (g)</label>
            <input type="number" id="mGoldBalance" value="0" step="0.001">
        </div>
        <div class="form-group" id="grpSilverBal">
            <label style="color:var(--accent-silver);">Silver Balance (g)</label>
            <input type="number" id="mSilverBalance" value="0" step="0.001">
        </div>
    </div>
</div>
